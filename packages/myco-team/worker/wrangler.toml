name = "myco-team-sync"
main = "src/index.ts"
compatibility_date = "2025-03-27"
# nodejs_compat is required by the agents SDK and @modelcontextprotocol/sdk,
# which depend on packages that import Node.js built-ins (node:async_hooks,
# node:diagnostics_channel, node:os, etc.).
compatibility_flags = [ "nodejs_compat", "global_fetch_strictly_public" ]

[vars]
# See packages/myco/src/constants.ts SYNC_PROTOCOL_VERSION /
# MIN_COMPAT_CLIENT_VERSION — these MUST stay in lockstep. Worker
# code reads these as strings and parseInt's them at request time.
SYNC_PROTOCOL_VERSION = "3"
MIN_COMPAT_CLIENT_VERSION = "1"
MYCO_TEAM_PACKAGE_VERSION = "<MYCO_TEAM_PACKAGE_VERSION>"
MYCO_SCHEMA_VERSION = "<MYCO_SCHEMA_VERSION>"
# Mirror the queue names into env vars so the queue() handler can route on
# equality (batch.queue === env.SYNC_QUEUE_NAME) instead of suffix-matching.
SYNC_QUEUE_NAME = "<YOUR_SYNC_QUEUE_NAME>"
SYNC_DLQ_NAME = "<YOUR_SYNC_DLQ_NAME>"

# D1 database — fill database_id after `wrangler d1 create myco-team`
[[d1_databases]]
binding = "MYCO_TEAM_DB"
database_name = "myco-team"
database_id = "<YOUR_D1_DATABASE_ID>"

# Vectorize index — fill index_name after `wrangler vectorize create myco-team-vectors`
[[vectorize]]
binding = "MYCO_TEAM_VECTORS"
index_name = "myco-team-vectors"

# KV namespace for runtime secrets (MCP tokens, etc.)
[[kv_namespaces]]
binding = "MYCO_SECRETS"
id = "<YOUR_KV_NAMESPACE_ID>"

# Workers AI binding
[ai]
binding = "AI"

# Sync queue — producer binding for /api/team/enqueue.
# Queue name is project-scoped; provisioning fills <YOUR_SYNC_QUEUE_NAME>.
[[queues.producers]]
binding = "SYNC_QUEUE"
queue = "<YOUR_SYNC_QUEUE_NAME>"

# Sync queue consumer — receives MessageBatch<SyncPayload>, writes to D1.
# Failures retry with exponential backoff up to max_retries, then route to
# the project's DLQ. Batch tuning kept conservative; revisit after
# operating data lands.
[[queues.consumers]]
queue = "<YOUR_SYNC_QUEUE_NAME>"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 10
dead_letter_queue = "<YOUR_SYNC_DLQ_NAME>"

[triggers]
crons = ["*/5 * * * *"]

# Observability block — left as a placeholder so `myco-team-dev upgrade
# --observability` can opt the deploy into Cloudflare's persistent log
# stream. Defaults to disabled because logs cost extra. The deploy
# patcher rewrites this comment to a real `[observability]` block when
# the flag is set, and back to a comment otherwise.
# <MYCO_OBSERVABILITY_BLOCK>
