name: pi
displayName: Pi
binary: pi
configDir: .pi
detectionDir: ~/.pi
pluginRootEnvVar: PI_PLUGIN_ROOT
hookFields:
  sessionId: session_id
  transcriptPath: transcript_path
  lastResponse: last_assistant_message
capture:
  planDirs:
    - .pi/plans/
  # Pi writes an append-only JSONL per session, so the transcript ships as
  # byte deltas like any other harness and the store stays Pi's own.
  transcriptDiscovery:
    roots:
      - ~/.pi/agent/sessions
    patterns:
      # `<project slug>/<ISO timestamp>_<session uuid>.jsonl`
      - "*/*_{sessionId}.jsonl"
    # The timestamp and the uuid are both dash-delimited, so no greediness rule
    # recovers the boundary between them; the id's shape is what resolves it.
    sessionIdPattern: "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
    transcriptCwdPath: "cwd"
    retention: harness
registration:
  hookResponse:
    # The plugin reads the hook's stdout directly, so the response is JSON and
    # carries the minted prompt id back for stamping on transcript lines.
    format: json
    fieldNames:
      additionalContext: additionalContext
      promptId: promptId
  # Pi uses an extension file, not JSON hook entries
  hooksTarget: .pi/extensions/myco/index.ts
  # Pi's user-global agent extensions live under ~/.pi/agent/extensions/
  globalHooksTarget: ~/.pi/agent/extensions/myco/index.ts
  hooksFormat: plugin-file
  # package.json for the extension's deps
  pluginPackageTarget: .pi/extensions/myco/package.json
  # Pi has no native MCP — Myco tools are registered via pi.registerTool()
  # mcpTarget is omitted; tools are wired in the extension itself.
  globalMcpTarget: null
  skillsTarget: .agents/skills
  globalSkillsTarget: ~/.agents/skills
  retiredGlobalSkillsTargets:
    - ~/.pi/agent/skills
  # No instructionsFile — pi reads AGENTS.md natively via context files

capabilities:
  # The transcript is the only writer of this symbiont's turn rows: the
  # prompt-submit hook mints the prompt id, returns it for the plugin to stamp
  # on its transcript lines, and injects, but ships no `prompt` event.
  turnRowSource: transcript
  # Pi's Myco tools are registered natively in the extension via
  # pi.registerTool() and dispatched in-process; no mcpTarget is declared, so
  # the installer writes no MCP server for it.
  sessionStartInjection: true
  # Pi can inject at before_agent_start, but spawned-subagent lifecycle needs
  # runtime proof before enabling direct child injection.
  subagentStartInjection: false
  # Tools whose tool_input carries a file path. Pi's lowercase tools put it
  # at `path` (relative or absolute) — confirmed from the live buffer of
  # smoke session 2026-06-11T21-06-03…: `read`/`write` with
  # `{ path, offset?, limit? }` / `{ path, content }`; the dogfood vault's
  # activity history shows `edit` uses `{ path, edits: [...] }` and `bash`
  # uses `{ command, timeout }`.
  pathBearingTools:
    - tool: read
      pathField: path
    - tool: write
      pathField: path
      mutates: true
    - tool: edit
      pathField: path
      mutates: true
    - tool: bash
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl]
