name: opencode
displayName: OpenCode
binary: opencode
configDir: .opencode
detectionDir: ~/.config/opencode
pluginRootEnvVar: OPENCODE_PLUGIN_ROOT
resumeCommand: "opencode --session {sessionId}"
hookFields:
  sessionId: session_id
  transcriptPath: transcript_path
  lastResponse: last_assistant_message
capture:
  planDirs:
    # opencode Plan mode permits edits only to .opencode/plans/*.md — captured by plan-capture.ts
    - .opencode/plans/
registration:
  # Hooks are delivered as a verbatim TS plugin file, not a JSON merge
  hooksTarget: .opencode/plugins/myco.ts
  # User-global opencode plugin lives under ~/.config/opencode/plugins/
  globalHooksTarget: ~/.config/opencode/plugins/myco.ts
  hooksFormat: plugin-file
  # .opencode/package.json declares the plugin SDK dep so opencode's Bun installs it at startup
  pluginPackageTarget: .opencode/package.json
  # opencode.json hosts MCP + permissions under non-standard keys
  mcpTarget: opencode.json
  globalMcpTarget: ~/.config/opencode/opencode.json
  mcpServersKey: mcp
  settingsTarget: opencode.json
  skillsTarget: .agents/skills
  globalSkillsTarget: ~/.config/opencode/skills
  # No instructionsFile — opencode reads AGENTS.md natively
capabilities:
  sessionStartInjection: true
  # Tools whose tool_input carries a file path. opencode uses camelCase
  # `filePath` (vs Claude's snake_case `file_path`). Drives capture-side
  # population of `activities.file_path` for the FTS index and the
  # per-activity file column in the UI.
  pathBearingTools:
    - tool: read
      pathField: filePath
    - tool: write
      pathField: filePath
    - tool: edit
      pathField: filePath
