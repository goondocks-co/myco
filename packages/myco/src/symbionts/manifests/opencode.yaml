name: opencode
displayName: OpenCode
binary: opencode
health:
  installLocations: ["~/.config/opencode"]
  # Read-only WAL access requires an existing readable shared-memory index; unavailable stores leave activity unknown in Health.
  activityLocations:
    - kind: sqlite
      path: opencode/opencode.db
      dataHomeEnv: XDG_DATA_HOME
      dataHomeDefault: "~/.local/share"
      query: "SELECT id, time_updated AS ran_at FROM session WHERE parent_id IS NULL AND time_updated >= ? ORDER BY time_updated DESC"
      sessionIdColumn: id
      timeColumn: ran_at
configDir: .opencode
detectionDir: ~/.config/opencode
pluginRootEnvVar: OPENCODE_PLUGIN_ROOT
resumeCommand: "opencode --session {sessionId}"
hookFields:
  sessionId: session_id
  transcriptPath: transcript_path
  lastResponse: last_assistant_message
capture:
  planDirs:
    # opencode Plan mode permits edits only to .opencode/plans/*.md — captured by plan-capture.ts
    - .opencode/plans/
  # The native session store provides no append-only byte stream. The plugin writes
  # a transcript from the events it sees in process, and Myco's retention pass ages it.
  transcriptDiscovery:
    roots:
      - "@memberHome/member/transcripts/opencode"
    patterns:
      - "{sessionId}.jsonl"
    transcriptCwdPath: "cwd"
    retention: member
registration:
  hookResponse:
    # The plugin reads the hook's stdout directly, so the response is JSON and
    # carries the minted prompt id back for stamping on transcript lines.
    format: json
    fieldNames:
      additionalContext: additionalContext
      promptId: promptId
  # Hooks are delivered as a verbatim TS plugin file, not a JSON merge
  hooksTarget: .opencode/plugins/myco.ts
  # User-global opencode plugin lives under ~/.config/opencode/plugins/
  globalHooksTarget: ~/.config/opencode/plugins/myco.ts
  hooksFormat: plugin-file
  # A member's plugin is project-scoped; OpenCode loads every `.opencode/` from
  # the launch directory up to the git root, and the global Myco plugin steps
  # aside for a project that carries this file.
  memberHooksTarget: .opencode/plugins/myco.ts
  # .opencode/package.json declares the plugin SDK dep so opencode's Bun installs it at startup
  pluginPackageTarget: .opencode/package.json
  # opencode.json hosts MCP + permissions under non-standard keys
  mcpTarget: opencode.json
  # OpenCode has no header-helper field, so a member keeps the stdio bridge,
  # which carries the member credential and follows a rotated token. It merges
  # this project's `myco` server into the global one: the project's `command`
  # wins, while the global entry's `environment`, `enabled`, `url` and
  # `headers` survive into it (opencode 1.18.21, `opencode debug config`).
  memberMcpGlobalMerge: true
  globalMcpTarget: ~/.config/opencode/opencode.json
  mcpServersKey: mcp
  settingsTarget: opencode.json
  skillsTarget: .agents/skills
  globalSkillsTarget: ~/.agents/skills
  retiredGlobalSkillsTargets:
    - ~/.config/opencode/skills
  # No instructionsFile — opencode reads AGENTS.md natively

capabilities:
  sessionStartInjection: true
  # The transcript is the only writer of this symbiont's turn rows: the
  # prompt-submit hook mints the prompt id, returns it for the plugin to stamp
  # on its transcript lines, and injects, but ships no `prompt` event.
  turnRowSource: transcript
  preToolUseInjection: false
  # Plugin child-session injection is a separate runtime path; don't mark
  # generic subagent-start support until parentID semantics are proven.
  subagentStartInjection: false
  # Tools whose tool_input carries a file path. opencode uses camelCase
  # `filePath` (vs Claude's snake_case `file_path`). Drives capture-side
  # population of `activities.file_path` for the FTS index and the
  # per-activity file column in the UI.
  pathBearingTools:
    - tool: read
      pathField: filePath
    - tool: write
      pathField: filePath
      mutates: true
    - tool: edit
      pathField: filePath
      mutates: true
    # apply_patch carries the whole patch envelope on `patchText`
    # ("*** Begin Patch\n*** Add File: /tmp/x\n+…\n*** End Patch") — the
    # path lives in the `*** Add/Update/Delete File:` header, not a field.
    # Confirmed from the live buffer of smoke session ses_147807fe…
    # (2026-06-11). The `patch` extractor returns the FIRST file header;
    # multi-file patches only register one activity row anyway. Hunk-level
    # content beyond the headers is not extractable.
    - tool: apply_patch
      pathField: patchText
      extract: patch
      mutates: true
    # bash input is `{ command, … }` — extract cat-style reads.
    - tool: bash
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl]

# What a worker needs to run this harness for the Deployment (`runner-harnesses.generated.ts` in myco-shared).
runner:
  order: 3
  # Its default configuration allows every tool without asking, and a plugin it loads can answer a permission request
  # before the driver does.
  asking: { kind: run-agent, env: OPENCODE_CONFIG_CONTENT, extensionsOff: { OPENCODE_PURE: '1' }, sourceReads: { read: ask, glob: ask, grep: ask, list: ask, external_directory: ask } }
  credential:
    provider: anthropic
    slot: anthropic
    variables: [ANTHROPIC_API_KEY]
  profile:
    models: { low: null, default: null, high: null }
    efforts: { low: low, default: medium, high: high }
    allowedEfforts: [minimal, low, medium, high, xhigh, max]
    # OpenRouter names a model that follows its family's newest with a leading `~`.
    modelPattern: '^[A-Za-z0-9][A-Za-z0-9._-]*/~?[A-Za-z0-9][A-Za-z0-9._:/-]{0,240}$'
    modelHint: Use provider/model. An unset model holds runs at this tier.
    # OpenRouter serves a `~` model as whichever model it names at each request.
    providerAliasPattern: '^openrouter/~'
    # OpenRouter's `~anthropic/…-latest` models follow Anthropic's newest model of each family. Other providers
    # OpenCode reaches publish no model that follows a family, so they have no preset.
    presets:
      - id: openrouter-claude-latest
        provider: openrouter
        label: Newest Claude through OpenRouter
        description: Haiku, Sonnet and Opus through OpenRouter, always the newest version.
        models:
          low: openrouter/~anthropic/claude-haiku-latest
          default: openrouter/~anthropic/claude-sonnet-latest
          high: openrouter/~anthropic/claude-opus-latest
  # How a stop it explains in its own words reads as a coded reason: a protocol error's message and what it writes to
  # stderr. The first pattern that matches decides; the words are read on the worker and never stored.
  diagnostics:
    - { code: login_missing, pattern: 'ProviderAuthError|LoadAPIKeyError|api key is missing|\bunauthorized\b|(?:HTTP|status|status code|error_status)[ :="]*401\b|\b401 Unauthorized\b|\(401\)|not authenticated|authentication required' }
    - { code: rate_limited, pattern: '(?:HTTP|status|status code|error_status)[ :="]*429\b|\b429 Too Many\b|\(429\)|too many requests|rate[_ -]?limit|usage limit|\bquota\b' }
    - { code: model_refused, pattern: 'ModelNotFound|\bmodel\b[^\n]{0,80}\b(?:not found|not supported|does not exist|not available)\b' }
    - { code: timed_out, pattern: '\btimed[ -]?out\b|\bETIMEDOUT\b|idle timeout|request timeout' }
  # How a worker runs it.
  worker:
    binary: opencode
    launch: { kind: subcommand, args: [acp] }
    login: { kind: file, path: ~/.local/share/opencode/auth.json, requires: [] }
    isolation: { kind: additive }
    sourceGit: shim
    modelSetting: config
    # It lists one provider/model per line, for the providers it is logged in to and those that need no login. Its
    # protocol session offers the same list, but opening one to read it keeps a session in its history.
    models:
      kind: command
      args: [models]
      format: lines
      provider: id-prefix
    # How each call in its stream reads as a step of the run's step log: by the agent protocol's own kind of the
    # call, its target read from the call's locations and raw input. Its free-text title, contents and output are never read.
    stepTool: category
    # How its calls name one of the tools Myco's server lists for the run: the protocol gives a call no tool name, so
    # its title is compared whole with each form, `{tool}` standing for one of the run's tools, or its input names
    # the server and the tool apart, as Cursor's does. The grant and the step log both read a call through this.
    mycoCalls:
      names: ['mcp__myco__{tool}', 'myco_{tool}']
      input: { server: rawInput.providerIdentifier, tool: rawInput.toolName }
    # Session updates its driver does not read that never carry a call: the agent's plan, its commands, its mode and
    # the user's own message.
    notSteps: [session/update:plan, session/update:available_commands_update, session/update:current_mode_update, session/update:user_message_chunk]
    steps:
      - { toolPrefix: mcp__myco__, kind: myco, target: [rawInput.op, rawInput.args.op, rawInput.arguments.op] }
      - { category: read, kind: read, target: [locations.0.path, rawInput.path, rawInput.filePath, rawInput.file_path] }
      - { category: search, kind: search, target: [locations.0.path, rawInput.path] }
      - { category: edit, kind: edit, target: [locations.0.path, rawInput.path, rawInput.filePath, rawInput.file_path] }
      - { category: delete, kind: edit, target: [locations.0.path, rawInput.path] }
      - { category: move, kind: edit, target: [locations.0.path, rawInput.path] }
      - { category: execute, kind: command, target: [rawInput.command, rawInput.cmd] }
      - { category: fetch, kind: fetch, target: [rawInput.url, rawInput.query] }
      - { category: think, kind: tool, target: [], words: Thought it through }
      - { category: switch_mode, kind: tool, target: [], words: Switched its mode }
    accounting:
      reported: acp-session
      zeroDollars: unavailable
      modelSources: [session.models, session.configOptions, session.currentModelId]
      launchFallback: none
      provider: { kind: model-prefix }
      tokenScope: unverified
      lastResponseVersions: [1.18.21, 1.18.29]
