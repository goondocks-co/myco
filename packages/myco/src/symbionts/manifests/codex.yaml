name: codex
displayName: Codex
binary: codex
configDir: .codex
detectionDir: ~/.codex
pluginRootEnvVar: CODEX_PLUGIN_ROOT
settingsPath: .codex/config.toml
resumeCommand: "codex --resume {sessionId}"
hookFields:
  sessionId: session_id
  transcriptPath: transcript_path
  lastResponse: last_assistant_message
capture:
  planDirs: []
  planTags:
    # Codex's plan mode does not write markdown files to disk; instead
    # it emits structured plan updates via the `update_plan` function-call
    # tool (response_item / function_call / name=update_plan with a JSON
    # `plan` array in `arguments`). The Codex transcript parser
    # (`packages/myco/src/symbionts/parsers/codex-jsonl.ts`) synthesizes
    # an `<update_plan>...</update_plan>` envelope from the tool call's
    # JSON args at parse time, appended to the assistant turn's
    # aiResponse, so this shared tag-extraction path captures it.
    - update_plan
  rules:
    # Ephemeral sub-invocation filter (structural, two-layer defense).
    #
    # Codex spawns internal LLM sub-invocations for things like UI
    # title generation. Those sub-invocations fire SessionStart and
    # UserPromptSubmit with their own session_id but never write a
    # rollout transcript file, so both events arrive with
    # `transcript_path: null`. Real user-facing sessions always have a
    # rollout file in ~/.codex/sessions/... and therefore a populated
    # transcript_path.
    #
    # Dropping on `transcript_path_missing` is a deliberately
    # pattern-based signal — robust across Codex and extension updates
    # because it keys on the Codex protocol contract (transcript_path
    # is populated iff a real transcript exists), not on any specific
    # prompt text that could drift.
    #
    # Scope is `any_agent` for both rules because detection itself
    # falls back to transcript_path → configDir matching; when that's
    # missing the hook can't attribute the event, so the owning
    # manifest has to opt into enforcing the rule regardless.

    # Layer 1 — stop the phantom from ever being registered.
    - event: session_start
      scope: any_agent
      when:
        transcript_path_missing: true
      action: drop
      reason: ephemeral-sub-invocation

    # Layer 2 — safety net. Deletes any phantom session row that did
    # slip past SessionStart (e.g. because Codex's rollout file hadn't
    # been flushed by the time SessionStart was queried).
    - event: user_prompt
      scope: any_agent
      when:
        transcript_path_missing: true
      action: drop
      reason: ephemeral-sub-invocation

    # Layer 3 — sub-agent thread spawn filter (structural).
    #
    # Codex spawns sub-agents (thread_spawn) for code review, testing,
    # etc. These write real transcript files but are NOT user-initiated
    # sessions. Their session_meta has:
    #   "source": {"subagent": {"thread_spawn": {...}}}
    # while user sessions have "source": "vscode" or similar strings.
    #
    # This condition reads the transcript's first JSON line and checks
    # the dot-path field — a structural signal that won't drift.
    - event: session_start
      scope: this_agent
      when:
        transcript_meta_field_exists: source.subagent
      action: drop
      reason: subagent-thread-spawn

    # Layer 4 — safety net for sub-agent prompts that slip past
    # SessionStart (e.g. transcript not yet flushed).
    - event: user_prompt
      scope: this_agent
      when:
        transcript_meta_field_exists: source.subagent
      action: drop
      reason: subagent-thread-spawn

    # Layer 5 — non-interactive exec filter (structural).
    #
    # `codex exec` writes a real rollout transcript, but it is a
    # programmatic validation/automation surface rather than the user's
    # interactive Codex conversation. Those transcripts have:
    #   "source": "exec"
    # in session_meta. Treat them as junk capture for the interactive
    # session archive and drop them before materializing a session row.
    - event: session_start
      scope: this_agent
      when:
        transcript_meta_field_equals:
          path: source
          value: exec
      action: drop
      reason: noninteractive-exec

    # Layer 6 — safety net for exec prompts that slip past SessionStart.
    - event: user_prompt
      scope: this_agent
      when:
        transcript_meta_field_equals:
          path: source
          value: exec
      action: drop
      reason: noninteractive-exec

    # Codex injects AGENTS.md + the Myco cortex session context as the
    # first `response_item/message/user` in every rollout. Structurally
    # identical to a real user prompt, so we filter by the prefix the
    # injection always carries. This rule runs at both hook time and
    # transcript-mining time via the shared evaluateUserPromptRules path.
    - event: user_prompt
      scope: this_agent
      when:
        prompt_starts_with: "# AGENTS.md instructions"
      action: drop
      reason: agents-md-context-injection

    # Codex sub-agent completion notifications.
    #
    # Codex's analog to Claude Code's <task-notification>: when a parallel
    # sub-agent invoked via the Agent tool finishes, the runtime injects a
    # <subagent_notification> envelope into the parent transcript as a
    # synthetic user-type entry. Capture but tag origin='agent_dispatch' —
    # these are agent-to-agent communications, distinct from the model's
    # own system-injected continuations.
    - event: user_prompt
      scope: this_agent
      when:
        prompt_starts_with: "<subagent_notification>"
      action: classify
      set_origin: agent_dispatch
      reason: codex-subagent-notification

    # Codex environment_context headers.
    #
    # Codex prepends `<environment_context>` blocks (shell, current_date,
    # timezone, cwd) to user-type entries when the runtime wants the model
    # to refresh its environmental awareness. Not user input.
    - event: user_prompt
      scope: this_agent
      when:
        prompt_starts_with: "<environment_context>"
      action: classify
      set_origin: system
      reason: codex-environment-context

    # Slash-skill envelope expansions (Codex).
    - event: user_prompt
      scope: this_agent
      when:
        prompt_starts_with: "<skill>"
      action: classify
      set_origin: system
      reason: codex-skill-envelope

    # Codex Desktop wraps user prompts with a file-mention preamble when
    # screenshots or files are attached:
    #   "# Files mentioned by the user:\n## <filename>: <path>\n## My request for Codex:\n<actual prompt>"
    # Strip the preamble so the captured prompt contains only the user's text.
    - event: user_prompt
      scope: this_agent
      when:
        prompt_contains: "## My request for Codex:"
      action: rewrite_prompt
      extract_after: "## My request for Codex:\n"
      reason: codex-desktop-file-preamble

    # NOTE: the VS Code Codex extension uses a different preamble
    # (`# Context from my IDE setup:` … `## My request for Codex:`).
    # Keying on the shared `## My request for Codex:` marker above
    # should handle both Desktop and VS Code variants. If the VS Code
    # preamble diverges, add a separate rule keyed on its specific marker.
  prompts:
    shapes:
      - name: user_message
        match:
          type: response_item
          fieldEquals:
            payload.type: message
            payload.role: user
        textAt: payload.content[0].text
    resetBoundaries:
      # Codex emits `turn_context` events whenever the agent enters a new
      # turn. Reset only fires when `payload.turn_id` changes from the
      # previously-seen value — consecutive `turn_context` events that
      # share a turn_id are the same turn, not a boundary.
      - match:
          type: turn_context
        changeOn: payload.turn_id
    interruptMarker: "<turn_aborted>"
registration:
  hooksTarget: .codex/hooks.json
  # Codex hooks live in a dedicated JSON file at both scopes. The plan's
  # original "consolidate hooks + MCP into config.toml" left the installer
  # writing JSON over a TOML file, corrupting the user's mcp_servers /
  # profiles / etc. Hooks go to a separate JSON file; MCP keeps config.toml.
  globalHooksTarget: ~/.codex/hooks.json
  mcpTarget: .codex/config.toml
  mcpFormat: toml
  globalMcpTarget: ~/.codex/config.toml
  skillsTarget: .agents/skills
  globalSkillsTarget: ~/.codex/skills
  settingsTarget: .codex/config.toml
  # Settings under global scope MUST land in config.toml (TOML) and
  # NOT share a path with the JSON hooks file. Required because
  # settingsFormat is `toml`; the manifest schema's TOML-vs-JSON
  # refine() enforces this declaration.
  globalSettingsTarget: ~/.codex/config.toml
  settingsFormat: toml
capabilities:
  # Hook template registers a session-start hook that fetches Cortex context.
  sessionStartInjection: true
  # SubagentStart can inject additionalContext as extra developer context for
  # the child agent.
  subagentStartInjection: true
  # HTTP MCP cannot carry per-project tenancy for Codex: its MCP config is global
  # (one entry, many projects), it sends no tenancy headers and no MCP `roots`,
  # and its MCP child runs at cwd=/ on Desktop — zero per-request project signal.
  # Its SHELL tool DOES run in the workspace, so `myco tool call` resolves full
  # tenancy from cwd. Declare the shell/CLI as Codex's tenancy-capable transport;
  # the installer writes no MCP server and session-start injects a CLI directive.
  toolTransport: cli
  # Emit hookSpecificOutput envelope on PreToolUse so Canopy anatomy reaches
  # the agent's context.
  preToolUseInjection: true
  # File reads come through Codex's canonical 'Bash' tool with the path
  # embedded in the command string. The resolver shlex-parses and picks the
  # last non-flag positional arg when the command name is in this allowlist.
  canopyReadTools:
    - tool: Bash
      pathField: command
      extract: shell-arg
      readCommands:
        - cat
        - head
        - tail
        - less
        - more
        - bat
        - wc
        - file
        - nl
        - sed
        - awk
        - grep
        - rg
        - perl
  # Codex's read surface flows through the Bash tool; its write surface is
  # the dedicated `apply_patch` tool, which carries the whole patch envelope
  # on `command` ("*** Begin Patch\n*** Update File: docs/x.md\n…") — the
  # path lives in the `*** Add/Update/Delete File:` header, so the `patch`
  # extractor pulls the first one (multi-file patches still register a
  # single activity row). Shape confirmed from the dogfood vault's activity
  # history (2,780 apply_patch rows, previously all file_path=NULL).
  pathBearingTools:
    - tool: Bash
      pathField: command
      extract: shell-arg
      readCommands:
        - cat
        - head
        - tail
        - less
        - more
        - bat
        - wc
        - file
        - nl
        - sed
        - awk
        - grep
        - rg
        - perl
    - tool: apply_patch
      pathField: command
      extract: patch

hooks:
  # Single-event turn-end: `Stop` carries both the inline response and the
  # transcript path. The daemon's stop dispatcher runs both phases in
  # sequence for this single event — matching pre-refactor behavior.
  Stop:
    phases: [response, transcript]
