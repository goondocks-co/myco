name: claude-code
displayName: Claude Code
binary: claude
configDir: .claude
pluginRootEnvVar: CLAUDE_PLUGIN_ROOT
settingsPath: .claude/settings.json
resumeCommand: "claude --resume {sessionId}"
hookFields:
  sessionId: session_id
  transcriptPath: transcript_path
  lastResponse: last_assistant_message
capture:
  planDirs:
    # Claude Code's plan mode writes to ~/.claude/plans/ (global), not the project-local
    # .claude/plans/. We watch both: home for plan-mode output, project-local for any
    # user-committed plans in the repo.
    - ~/.claude/plans/
    - .claude/plans/
  planTags:
    # Ultraplan sends the approved cloud plan back to the terminal by injecting
    # it into the next user prompt as <ultraplan>...</ultraplan>.
    - ultraplan
  rules:
    # Slash-command dispatch envelope filter (structural).
    #
    # When the user runs `/name args`, Claude Code fires UserPromptSubmit with
    # the raw `/name args` text — the hook captures it and stores it in a
    # prompt_batch (buffer-backed if the daemon is down). The transcript then
    # logs the dispatch as a pair of user entries sharing one promptId:
    #   1. <command-message>name</command-message>
    #      <command-name>/name</command-name>
    #      <command-args>args</command-args>
    #   2. the expanded command body (the rendered .claude/commands/<name>.md).
    #
    # Without this rule, transcript mining at Stop emits the XML-wrapped text
    # as a record, reconcile can't match its prefix to the hook-stored
    # `/name args` batch, and a duplicate batch is inserted. Dropping the
    # wrapper entry also suppresses the expanded body via shape-level
    # dedupeBy: promptId, so zero transcript records are emitted for the
    # dispatch. The live hook capture is authoritative.
    #
    # The `<command-message>` prefix is Claude-synthesized — it only appears
    # on real slash-command dispatches (prompts whose first token is a
    # recognized `/name`). Plain prompts, mid-sentence `/` mentions, and
    # queued_command attachments (which carry raw `/name args` text, not the
    # XML envelope) are unaffected.
    - event: user_prompt
      scope: this_agent
      when:
        prompt_starts_with: "<command-message>"
      action: drop
      reason: claude-code-slash-command-dispatch
    # Built-in CLI command dispatch envelope filter (structural).
    #
    # Twin of the rule above, targeting Claude Code's built-in CLI operations
    # (`/exit`, `/compact`, `/clear`, `/mcp`, `/plugin`, `/reload-plugins`,
    # `/extra-usage`). Unlike user-authored slash commands, these do NOT fire
    # UserPromptSubmit — they're internal CLI ops. They land in the transcript
    # as user-type entries whose content starts with `<command-name>` instead
    # of `<command-message>`:
    #   <command-name>/compact</command-name>
    #   <command-message>compact</command-message>
    #   <command-args></command-args>
    #
    # Because these entries share a promptId with their paired
    # `<local-command-caveat>` meta entry and any follow-up synthesized summary
    # ("This session is being continued..." from /compact), dedupeBy: promptId
    # suppresses those once the dispatch is dropped — one rule handles the
    # whole envelope group.
    #
    # The isMeta filter on the user_prompt shape doesn't catch these because
    # Claude Code does not tag `<command-name>` dispatch entries with isMeta.
    - event: user_prompt
      scope: this_agent
      when:
        prompt_starts_with: "<command-name>"
      action: drop
      reason: claude-code-builtin-command-dispatch
  prompts:
    shapes:
      # Standard user prompts. Claude Code tags synthesized transcript entries
      # (local-command caveats, skill-basedir injections, expanded command
      # bodies, misc system notices) with `isMeta: true`. Filtering on that
      # flag at the shape level avoids whack-a-mole prefix rules for each new
      # synthesized wrapper the CLI invents. Real user prompts carrying
      # attachments (screenshots, documents) are `isMeta: undefined` — the
      # synthesized `[Image source: ...]` side-log entries are isMeta: true
      # and paired with a real non-isMeta sibling via promptId, so they're
      # safely skipped without losing image captures.
      #
      # Dispatch envelopes (`<command-message>...`) are NOT isMeta — the
      # capture.rules drop above catches those.
      #
      # message.content is either a plain string or an array of typed blocks;
      # the walker's path resolver handles both.
      - name: user_prompt
        match:
          type: user
          hasField: promptId
          fieldNotEquals:
            isMeta: true
        dedupeBy: promptId
        textAt: message.content
      # Steering prompts queued via the Esc→queue UI. Claude Code does NOT
      # fire UserPromptSubmit for these, so the transcript is the only
      # capture path. No explicit kind — position in the event stream
      # determines whether the walker classifies this as steering.
      - name: queued_command
        match:
          type: attachment
          fieldEquals:
            attachment.type: queued_command
        dedupeBy: uuid
        textAt: attachment.prompt
    resetBoundaries:
      - match:
          type: assistant
          fieldEquals:
            message.stop_reason: end_turn
    interruptMarker: "[Request interrupted by user for tool use]"
registration:
  hooksTarget: .claude/settings.json
  mcpTarget: .mcp.json
  skillsTarget: .claude/skills
  settingsTarget: .claude/settings.json
  instructionsFile: CLAUDE.md
