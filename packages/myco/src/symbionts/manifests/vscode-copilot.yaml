name: vscode-copilot
displayName: VS Code Copilot
binary: code
configDir: .vscode
# VS Code Copilot detection key: ~/.copilot/ is the user-home location the
# Copilot extension reads hooks from. Platform-specific VS Code data dirs
# (~/Library/Application Support/Code, ~/.config/Code) are NOT used as the
# detection signal; ~/.copilot is more portable.
detectionDir: ~/.copilot
pluginRootEnvVar: VSCODE_PLUGIN_ROOT
hookFields:
  sessionId: sessionId
  transcriptPath: transcript_path
  lastResponse: last_assistant_message
capture:
  planDirs: []
registration:
  hooksTarget: .github/hooks/myco-hooks.json
  # Copilot global hooks live in user home; workspace overrides user (no merge).
  globalHooksTarget: ~/.copilot/hooks/myco-hooks.json
  mcpTarget: .vscode/mcp.json
  # VS Code global MCP currently macOS-specific. Cross-platform handling
  # lands when Windows/Linux paths are wired through the installer.
  globalMcpTarget: ~/Library/Application Support/Code/User/mcp.json
  skillsTarget: .agents/skills
  globalSkillsTarget: ~/.copilot/skills
  settingsTarget: .vscode/settings.json
  instructionsFile: .github/copilot-instructions.md
capabilities:
  sessionStartInjection: true
