name: antigravity
displayName: Google Antigravity
binary: antigravity
configDir: .agents/plugins/myco
# Antigravity uses the same ~/.gemini/ user-home directory as the retired
# Gemini CLI — Google reused the dir under the new product. The detection
# signal is the user-home dir's presence; existing installs with stale Myco
# Gemini config are migrated away in Step 16.
detectionDir: ~/.gemini
pluginRootEnvVar: ANTIGRAVITY_PLUGIN_ROOT
# Hook input shape per the official Antigravity hooks docs
# (https://antigravity.google/docs/hooks). Every event includes a common
# block: conversationId, workspacePaths, transcriptPath, artifactDirectoryPath.
# Event-specific fields layer on top.
#
#   - PreInvocation:  invocationNum, initialNumSteps. NO prompt field —
#                     the user message lives in the transcript file at
#                     transcriptPath, not on the hook payload.
#   - PreToolUse:     toolCall { name, args }, stepIdx.
#   - PostToolUse:    stepIdx, error (optional). NO result body — the tool
#                     output also reads from the transcript.
#   - PostInvocation: same as PreInvocation.
#   - Stop:           executionNum, terminationReason, error, fullyIdle.
#
# We omit `prompt`, `lastResponse`, and `toolOutput` deliberately — none
# exist in Antigravity's payload schema, and previous mappings here were
# wrong (read from the spec, not from inference).
hookFields:
  sessionId: conversationId
  transcriptPath: transcriptPath
  toolName: toolCall.name
  toolInput: toolCall.args
capture:
  planDirs:
    # Antigravity workspace plans land here; user-global plan dir TBD during
    # dogfood. Mirrors the pattern other symbionts use until verified.
    - .agents/plugins/myco/plans/
registration:
  # Antigravity discovers workspace plugins under .agents/plugins/<name>/.
  # The hooks file inside that bundle is hooks.json.
  hooksTarget: .agents/plugins/myco/hooks.json
  globalHooksTarget: ~/.gemini/config/plugins/myco/hooks.json
  # Plugin-bundle layout: the hooks file is Myco-owned inside its own bundle
  # dir, so the installer copies templates/antigravity/hooks.json verbatim
  # rather than merging into an external user-managed file.
  hooksFormat: plugin-file
  hooksTemplateFile: hooks.json
  # Antigravity hooks emit JSON on stdout; field mapping rebases Myco's
  # internal HookResponse semantics to Antigravity's response shape.
  # Antigravity's response shape varies per event:
  #   - PreInvocation/PostInvocation: { injectSteps: [{ ephemeralMessage: "<text>" }] }
  #   - PostToolUse:                   {}            (empty)
  #   - Stop:                          { decision: "<continue|allow>", reason?: "<text>" }
  #     'continue' forces the agent to keep running; any other value
  #     allows the stop. Myco never force-continues — Stop is a pure
  #     terminate signal for capture purposes.
  #
  # `format: antigravity-inject-steps` selects the dedicated serializer
  # in src/hooks/response.ts that knows the per-event shapes. The flat
  # `fieldNames` mapping we used before was wrong — it emitted
  # `{ ephemeralMessage: "<text>" }` (no injectSteps wrapper), which
  # Antigravity silently dropped. Caught during the R4 verification
  # pass by reading the live docs (the prior wisdom spore had the
  # shape wrong).
  hookResponse:
    format: antigravity-inject-steps
  mcpTarget: .agents/plugins/myco/mcp_config.json
  globalMcpTarget: ~/.gemini/config/plugins/myco/mcp_config.json
  # Antigravity's bundle marker. Without `plugin.json` at the root of
  # the plugin dir, Antigravity's plugin loader doesn't recognize the
  # bundle and our hooks/MCP/skills never activate. Google's reference
  # plugins (google-antigravity-sdk, modern-web-guidance-plugin) both
  # ship a `plugin.json` with metadata-only fields (name, version,
  # description, author, license, keywords) — hooks.json and
  # mcp_config.json are sibling files discovered by convention.
  pluginManifestTarget: .agents/plugins/myco/plugin.json
  globalPluginManifestTarget: ~/.gemini/config/plugins/myco/plugin.json
  # Antigravity CLI (`agy`, successor to the deprecated Gemini CLI) reads the
  # cross-agent `.agents/skills` standard (https://antigravity.google/docs/skills):
  #   1. workspace `.agents/skills/`  — read natively; Myco's intelligence
  #                                     pipeline writes the project's generated
  #                                     skills here, and other `.agents`-standard
  #                                     symbionts already symlink the package
  #                                     skills into the same dir, so `skillsTarget`
  #                                     is deliberately omitted (lean install, no
  #                                     duplicate symlinks).
  #   2. global `~/.agents/skills/`   — the user-level cross-agent standard dir;
  #                                     package skills land here so an
  #                                     Antigravity-only workspace still sees
  #                                     them. Replaces the deprecated Gemini-era
  #                                     `~/.gemini/antigravity/skills`.
  globalSkillsTarget: ~/.agents/skills
  retiredGlobalSkillsTargets:
    - ~/.gemini/antigravity/skills
  # No standalone settings file — Antigravity wires settings through the
  # plugin bundle's plugin.json.
capabilities:
  # MCP stdio spawns at $HOME (not workspace), `${workspaceFolder}` does not
  # expand, no roots, and its workspace-on-stdin hook path collides with MCP
  # stdio's protocol stdin. Shell carries tenancy.
  toolTransport: cli
  sessionStartInjection: true
  subagentStartInjection: false
  preToolUseInjection: false
  # Tools whose toolCall.args carry a file path. Antigravity's current app
  # uses PascalCase argument names — confirmed from the live buffer of smoke
  # session b49c825e… (2026-06-11): `view_file` with `{ AbsolutePath,
  # StartLine, EndLine, … }` and `write_to_file` with `{ TargetFile,
  # CodeContent, Overwrite, … }`. The snake_case entries below cover the
  # Gemini-era tool surface (`read_file`/`replace` with `file_path`,
  # `run_shell_command` with `command`) still present in older installs —
  # the dogfood vault has extracted rows for both generations.
  pathBearingTools:
    # Current Antigravity app (PascalCase args)
    - tool: view_file
      pathField: AbsolutePath
    - tool: write_to_file
      pathField: TargetFile
    # Gemini-era surface (snake_case args)
    - tool: read_file
      pathField: file_path
    - tool: replace
      pathField: file_path
    - tool: run_shell_command
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl]
