name: antigravity
displayName: Google Antigravity
binary: agy
health:
  installLocations: []
  activityLocations: [{ kind: file, path: "@transcripts" }]
configDir: .agents/plugins/myco
pluginRootEnvVar: ANTIGRAVITY_PLUGIN_ROOT
# https://antigravity.google/docs/hooks
# Common input includes conversationId, workspacePaths, transcriptPath and lastUserInput.
# PreInvocation accepts injectSteps; Myco wires session context only, once per conversation.
# PostToolUse carries toolCall and optional error, with no result body.
hookFields:
  sessionId: conversationId
  transcriptPath: transcriptPath
  toolName: toolCall.name
  toolInput: toolCall.args
  toolError: error
# Antigravity names the workspace only in the hook payload: the launch preamble reads it from stdin and starts there.
hookInput:
  workspaceFromStdin: workspacePaths
capture:
  transcriptEvidence:
    toolCalls: not_visible
    failedTools: not_visible
    mycoCalls: not_visible
    filesEdited: not_visible
    commits: member_report_required
  # One brain dir per conversation, under whichever surface produced it.
  transcriptDiscovery:
    roots:
      - "~/.gemini/antigravity-cli"
      - "~/.gemini/antigravity"
      - "~/.gemini/antigravity-ide"
    patterns:
      - "brain/{sessionId}/.system_generated/logs/transcript_full.jsonl"
      - "brain/{sessionId}/.system_generated/logs/transcript.jsonl"
  planDirs:
    # Antigravity workspace plans land here; user-global plan dir TBD during
    # dogfood. Mirrors the pattern other symbionts use until verified.
    - .agents/plugins/myco/plans/
registration:
  settingsTarget: null
  globalSettingsTarget: null
  hooksTarget: .agents/hooks.json
  memberHooksTarget: .agents/hooks.json
  globalHooksTarget: ~/.gemini/config/hooks.json
  hooksRootKey: myco
  memberCaptureLimits: "Prompts and replies come from the transcript; PreInvocation prompt memory is not wired; no tool-time memory output. Earlier transcripts need project attribution."
  # https://antigravity.google/docs/hooks
  # Context is carried in injectSteps; tool completion returns {}, Stop returns an allow decision.
  hookResponse:
    format: antigravity-inject-steps
  mcpTarget: .agents/mcp_config.json
  globalMcpTarget: ~/.gemini/config/mcp_config.json
  globalSkillsTarget: ~/.gemini/config/skills
  retiredGlobalSkillsTargets:
    - ~/.gemini/antigravity/skills
capabilities:
  turnRowSource: transcript
  transcriptFidelity: no_tool_results
  sessionStartInjection: true
  sessionStartOnce: true
  subagentStartInjection: false
  preToolUseInjection: false
  # Tools whose toolCall.args carry a file path. Antigravity's current app
  # uses PascalCase argument names — confirmed from the live buffer of smoke
  # session b49c825e… (2026-06-11): `view_file` with `{ AbsolutePath,
  # StartLine, EndLine, … }` and `write_to_file` with `{ TargetFile,
  # CodeContent, Overwrite, … }`. The snake_case entries below cover the
  # Gemini-era tool surface (`read_file`/`replace` with `file_path`,
  # `run_shell_command` with `command`) still present in older installs —
  # the dogfood vault has extracted rows for both generations.
  pathBearingTools:
    # Current Antigravity app (PascalCase args)
    - tool: view_file
      pathField: AbsolutePath
    - tool: replace_file_content
      pathField: TargetFile
      mutates: true
    - tool: multi_replace_file_content
      pathField: TargetFile
      mutates: true
    - tool: write_to_file
      pathField: TargetFile
      mutates: true
    # Gemini-era surface (snake_case args)
    - tool: read_file
      pathField: file_path
    - tool: replace
      pathField: file_path
      mutates: true
    - tool: run_shell_command
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl]

# What a worker needs to run this harness for the Deployment (`runner-harnesses.generated.ts` in myco-shared).
runner:
  order: 5
  # It reads its allow list from ~/.gemini/antigravity-cli/settings.json, and neither its CLI nor its protocol server
  # is known to take a variable or flag that moves it.
  asking: { kind: unheld }
  credential:
    provider: google
    slot: null
    variables: [GEMINI_API_KEY]
  profile:
    models: { low: null, default: null, high: null }
    efforts: { low: low, default: medium, high: high }
    allowedEfforts: []
    modelPattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,255}$'
    modelHint: Model selection is unavailable for this agent.
  # How a stop it explains in its own words reads as a coded reason: a protocol error's message and what it writes to
  # stderr. The first pattern that matches decides; the words are read on the worker and never stored.
  diagnostics:
    - { code: login_missing, pattern: '\bunauthenticated\b|\bunauthorized\b|(?:HTTP|status|status code|error_status)[ :="]*401\b|\b401 Unauthorized\b|\(401\)|not logged in|authentication required' }
    - { code: rate_limited, pattern: '(?:HTTP|status|status code|error_status)[ :="]*429\b|\b429 Too Many\b|\(429\)|resource_exhausted|too many requests|rate[_ -]?limit|\bquota\b' }
    - { code: model_refused, pattern: '\bmodel\b[^\n]{0,80}\b(?:not found|not supported|does not exist|not available)\b' }
    - { code: timed_out, pattern: '\btimed[ -]?out\b|\bETIMEDOUT\b|deadline exceeded|idle timeout|request timeout' }
  # How a worker runs it.
  worker:
    binary: agy
    signInHint:
      default: "Open Antigravity on this runner and complete its sign-in."
    launch: { kind: sidecar, binary: agy_acp_server.par }
    login: { kind: file, path: ~/.gemini/antigravity-cli/settings.json, requires: [] }
    isolation: { kind: additive }
    # Its shell has not been seen reaching the run's git.
    sourceGit: none
    modelSetting: none
    # How each call in its stream reads as a step of the run's step log: by the agent protocol's own kind of the
    # call, its target read from the call's locations and raw input. Its free-text title, contents and output are never read.
    stepTool: category
    # How its calls name one of the tools Myco's server lists for the run: the protocol gives a call no tool name, so
    # its title is compared whole with each form, `{tool}` standing for one of the run's tools, or its input names
    # the server and the tool apart, as Cursor's does. The grant and the step log both read a call through this.
    mycoCalls:
      names: ['mcp__myco__{tool}', 'myco_{tool}']
      input: { server: rawInput.providerIdentifier, tool: rawInput.toolName }
    # Session updates its driver does not read that never carry a call: the agent's plan, its commands, its mode and
    # the user's own message.
    notSteps: [session/update:plan, session/update:available_commands_update, session/update:current_mode_update, session/update:user_message_chunk]
    steps:
      - { toolPrefix: mcp__myco__, kind: myco, target: [rawInput.op, rawInput.args.op, rawInput.arguments.op] }
      - { category: read, kind: read, target: [locations.0.path, rawInput.path, rawInput.filePath, rawInput.file_path] }
      - { category: search, kind: search, target: [locations.0.path, rawInput.path] }
      - { category: edit, kind: edit, target: [locations.0.path, rawInput.path, rawInput.filePath, rawInput.file_path] }
      - { category: delete, kind: edit, target: [locations.0.path, rawInput.path] }
      - { category: move, kind: edit, target: [locations.0.path, rawInput.path] }
      - { category: execute, kind: command, target: [rawInput.command, rawInput.cmd] }
      - { category: fetch, kind: fetch, target: [rawInput.url, rawInput.query] }
      - { category: think, kind: tool, target: [], words: Thought it through }
      - { category: switch_mode, kind: tool, target: [], words: Switched its mode }
    accounting:
      reported: acp-session
      zeroDollars: unavailable
      modelSources: [session.models, session.configOptions, session.currentModelId]
      launchFallback: none
      provider: { kind: unavailable }
      tokenScope: unverified

# Prompts are named by their explicit source step_index.
promptIdentity:
  kind: transcript-only
  scheme: member-transcript-v1

recordIdentity:
  scheme: source-record-v1
  schemes:
    legacy-session-v1:
      response:
        position: true
        withinRecord: record-text
        evidence: tests/fixtures/record-identity-evidence.json
    source-record-v1:
      response:
        position: true
        withinRecord: record-text
        evidence: tests/fixtures/record-identity-evidence.json
