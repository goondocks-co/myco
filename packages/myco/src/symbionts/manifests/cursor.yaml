name: cursor
displayName: Cursor
binary: cursor
configDir: .cursor
detectionDir: ~/.cursor
pluginRootEnvVar: CURSOR_PLUGIN_ROOT
settingsPath: .cursor/mcp.json
projectDirEnvVar: CURSOR_PROJECT_DIR
hookFields:
  sessionId: [conversation_id, session_id]
  transcriptPath: transcript_path
  lastResponse: last_assistant_message
  # A payload with no session id: the id is the transcript's directory and file name in the per-session layout, or
  # the flat transcript's file name.
  sessionIdFromTranscriptPath:
    - '/agent-transcripts/([^/]+)/\1\.jsonl$'
    - '(?:^|/)([^/.]+)\.txt$'
capture:
  # Two layouts are in use: a flat `.txt` and a per-session directory holding
  # `.jsonl`. Order is significant — a session with both resolves to `.txt`.
  transcriptDiscovery:
    roots: ["~/.cursor/projects"]
    patterns:
      - "*/agent-transcripts/{sessionId}.txt"
      - "*/agent-transcripts/{sessionId}/{sessionId}.jsonl"
  planDirs:
    # Cursor's plan output lands in ~/.cursor/plans/ (global), not project-local.
    # Watch both: home for agent-written plans, project-local for any committed plans.
    - ~/.cursor/plans/
    - .cursor/plans/
  rules:
    # New Cursor app payloads (observed live 2026-06-11, smoke session
    # 64465029-53bf-43c2-bb6a-aea6627f56f4) wrap the user's text in a
    # `<user_query>\n…\n</user_query>` envelope. Strip it so the stored
    # prompt is the user's verbatim text. The strip only fires when BOTH
    # tags are present (partial tags pass through untouched) and is
    # idempotent — see stripEnvelope in hooks/capture-rules.ts, which also
    # documents the replay-convergence window for sessions whose earlier
    # batches were stored wrapped.
    - event: user_prompt
      when:
        prompt_starts_with: "<user_query>"
      action: rewrite_prompt
      strip_envelope:
        open: "<user_query>"
        close: "</user_query>"
      reason: strip Cursor user_query envelope
registration:
  hooksTarget: .cursor/hooks.json
  # The 2.0 member scope writes the project's own hooks file, versioned as
  # Cursor requires; no 1.4 project install owns it on a member.
  memberHooksTarget: .cursor/hooks.json
  globalHooksTarget: ~/.cursor/hooks.json
  hooksConfigVersion: 1
  hookResponse:
    format: json
    fieldNames:
      additionalContext: additional_context
      continue: continue
      stopReason: stop_reason
      userMessage: user_message
      followupMessage: followup_message
      systemMessage: system_message
  # No memberMcpHeadersHelperKey: Cursor ignores a header helper, static
  # headers cannot follow a rotating member token, and the Deployment serves no
  # MCP OAuth, so a member keeps the stdio entry.
  mcpTarget: .cursor/mcp.json
  globalMcpTarget: ~/.cursor/mcp.json
  skillsTarget: .agents/skills
  retiredSkillsTargets:
    - .cursor/skills
  globalSkillsTarget: ~/.agents/skills
  retiredGlobalSkillsTargets:
    - ~/.cursor/skills
  settingsTarget: .cursor/settings.json
  # Cursor's ~/.cursor/hooks.json accepts `chat.tools.terminal.autoApprove`
  # alongside the hooks block — share-with-hooks is the intended global
  # surface. Explicit declaration (vs. silent fallback) per /code-review
  # finding C9.
  globalSettingsTarget: ~/.cursor/hooks.json
capabilities:
  sessionStartInjection: true
  preToolUseInjection: false
  # The prompt hook can only block, so the session block gets its second
  # chance to land from a post-tool-use response.
  postToolUseInjection: true
  # The Deployment parses the transcript (`ingest/parsers/cursor.ts`), which
  # carries prompts and replies and no tool calls at all: the hooks ship the
  # tool calls and plan files and write no prompt or response row.
  turnRowSource: transcript
  transcriptFidelity: no_tool_results
  # Cursor currently exposes subagentStart for lifecycle allow/deny, not
  # proven child model-context injection.
  subagentStartInjection: false
  # Tools whose tool_input carries a file path. Cursor's composer exposes a
  # Claude-Code-style tool surface (snake_case `file_path`), confirmed from
  # live hook payloads (smoke session 64465029…, 2026-06-11: Read failure
  # event with `tool_input.file_path`) and the dogfood vault's activity
  # history (Read/Write/Edit/Delete/Grep/Shell input shapes). Without these
  # entries, events attributed `agent: cursor` stored file_path=NULL — only
  # events that Cursor's embedded Claude Code runtime mislabeled as
  # `claude-code` happened to extract via that manifest.
  pathBearingTools:
    - tool: Read
      pathField: file_path
    - tool: Write
      pathField: file_path
      mutates: true
    - tool: Edit
      pathField: file_path
      mutates: true
    - tool: MultiEdit
      pathField: file_path
      mutates: true
    - tool: Delete
      pathField: file_path
      mutates: true
    # Grep carries `file_path` only when scoped to a single file; pattern-only
    # searches have no path to extract and resolve to null.
    - tool: Grep
      pathField: file_path
    # Shell input is `{ command, cwd, timeout }` — extract cat-style reads.
    - tool: Shell
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl]

# What a worker needs to run this harness for the Deployment (`runner-harnesses.generated.ts` in myco-shared).
runner:
  order: 4
  # Its allow list and Run Everything mode live in its configuration directory; its login lives in the keychain,
  # outside it.
  asking: { kind: run-home, env: CURSOR_CONFIG_DIR }
  credential:
    provider: anthropic
    slot: anthropic
    variables: [ANTHROPIC_API_KEY]
  profile:
    models: { low: null, default: null, high: null }
    efforts: { low: low, default: medium, high: high }
    allowedEfforts: []
    modelPattern: '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,255}$'
    modelHint: Model selection is unavailable for this agent.
  # How a worker runs it.
  worker:
    binary: cursor-agent
    launch: { kind: subcommand, args: [acp] }
    login: { kind: command, args: [status] }
    isolation: { kind: additive }
    # Its shell puts the system directories first on PATH before each command.
    sourceGit: none
    modelSetting: none
    # How each call in its stream reads as a step of the run's step log: by the agent protocol's own kind of the
    # call, its target read from the call's locations and raw input. Its free-text title, contents and output are never read.
    stepTool: category
    steps:
      - { category: read, kind: read, target: [locations.0.path, rawInput.path, rawInput.filePath, rawInput.file_path] }
      - { category: search, kind: search, target: [locations.0.path, rawInput.path] }
      - { category: edit, kind: edit, target: [locations.0.path, rawInput.path, rawInput.filePath, rawInput.file_path] }
      - { category: delete, kind: edit, target: [locations.0.path, rawInput.path] }
      - { category: move, kind: edit, target: [locations.0.path, rawInput.path] }
      - { category: execute, kind: command, target: [rawInput.command, rawInput.cmd] }
      - { category: fetch, kind: fetch, target: [rawInput.url, rawInput.query] }
    accounting:
      reported: acp-session
      zeroDollars: unavailable
      modelSources: [session.models, session.configOptions, session.currentModelId]
      launchFallback: none
      provider: { kind: unavailable }
      tokenScope: unverified
