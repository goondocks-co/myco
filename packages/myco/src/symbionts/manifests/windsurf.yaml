name: windsurf
displayName: Windsurf
binary: windsurf
configDir: .windsurf
detectionDir: ~/.codeium/windsurf
pluginRootEnvVar: WINDSURF_PLUGIN_ROOT
hookFields:
  sessionId: trajectory_id
  transcriptPath: transcript_path
  lastResponse: last_assistant_message
capture:
  planDirs:
    - ~/.windsurf/plans/
registration:
  hooksTarget: .windsurf/hooks.json
  globalHooksTarget: ~/.codeium/windsurf/hooks.json
  # New capability — Windsurf MCP only available at the user-global location
  # under ~/.codeium/windsurf/mcp_config.json. No project-local equivalent;
  # mcpTarget omitted on purpose.
  globalMcpTarget: ~/.codeium/windsurf/mcp_config.json
  skillsTarget: .agents/skills
  globalSkillsTarget: ~/.codeium/windsurf/skills
  settingsTarget: .windsurf/settings.json
capabilities:
  # Windsurf's bundled hook template does not currently register a
  # session-start hook. Cortex falls back to inline delivery via
  # `myco_cortex` and to the AGENTS.md managed-guidance bullet.
  sessionStartInjection: false
