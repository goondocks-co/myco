name: copilot
displayName: GitHub Copilot
binary: copilot
health:
  installLocations: []
  activityLocations: [{ kind: file, path: "@transcripts" }]
configDir: .copilot
pluginRootEnvVar: COPILOT_PLUGIN_ROOT
# PascalCase hook registrations select Copilot CLI's compatible snake_case payload.
# https://docs.github.com/en/copilot/reference/hooks-reference
hookFields:
  sessionId: [session_id, sessionId]
  transcriptPath: [transcript_path, transcriptPath]
  lastResponse: [last_assistant_message, response]
  prompt: prompt
  toolName: [tool_name, toolName]
  toolInput: [tool_input, toolArgs]
  toolOutput: [tool_result, tool_response, toolResult]
capture:
  # One directory per session, holding an events log.
  transcriptDiscovery:
    roots: ["~/.copilot/session-state"]
    patterns:
      - "{sessionId}/events.jsonl"
  planDirs: []
registration:
  hooksTarget: .github/hooks/myco-hooks.json
  memberHooksTarget: .github/hooks/myco-hooks.json
  globalHooksTarget: ~/.copilot/hooks/myco-hooks.json
  hooksConfigVersion: 1
  mcpTarget: .mcp.json
  globalMcpTarget: ~/.copilot/mcp-config.json
  memberCaptureLimits: "Prompt-hook injection is unverified; registry memory arrives after a tool. Earlier transcripts need project attribution."
  skillsTarget: .agents/skills
  globalSkillsTarget: ~/.agents/skills
  retiredGlobalSkillsTargets:
    - ~/.copilot/skills
  settingsTarget: null
  globalSettingsTarget: null
  retiredHookSettings:
    chat.tools.terminal.autoApprove:
      myco: true
      myco-dev: true
  instructionsFile: .github/copilot-instructions.md
  hookResponse:
    format: json
    fieldNames: { additionalContext: additionalContext }
    shapes:
      PostToolUse: flat
      PostToolUseFailure: flat
      SubagentStart: flat
capabilities:
  promptSubmitInjection: false
  promptRecallToolDelivery: true
  preToolUseInjection: false
  sessionStartInjection: true
  subagentStartInjection: true
  canopyReadTools:
    # VS Code Copilot extension shape
    - tool: read_file
      pathField: filePath
    - tool: run_in_terminal
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl]
    # Copilot CLI shape
    - tool: view
      pathField: path
    - tool: bash
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl]
    - tool: powershell
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl, Get-Content, gc]
    - tool: grep
      pathField: path
  # Broader superset for capture's activities.file_path stamping —
  # repeats every canopyReadTools entry and adds Copilot's write-side
  # file mutators so the FTS index stays accurate on edits too.
  pathBearingTools:
    # VS Code Copilot extension shape
    - tool: read_file
      pathField: filePath
    - tool: run_in_terminal
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl]
    - tool: replace_string_in_file
      pathField: filePath
      mutates: true
    - tool: create_file
      pathField: filePath
      mutates: true
    - tool: apply_patch
      pathField: filePath
      mutates: true
    # Copilot CLI shape
    - tool: view
      pathField: path
    - tool: bash
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl]
    - tool: powershell
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl, Get-Content, gc]
    - tool: edit
      pathField: path
      mutates: true
    - tool: create
      pathField: path
      mutates: true
    - tool: grep
      pathField: path

hooks:
  # Single-event turn-end: `Stop` carries both the inline response and the
  # transcript path. The daemon's stop dispatcher runs both phases in
  # sequence for this single event — matching pre-refactor behavior.
  Stop:
    phases: [response, transcript]

# How this agent's prompts are named: the prompt hook mints the id for the rows it writes (`hook-owned`, from
# `capabilities.turnRowSource`).
promptIdentity:
  scheme: hook-mint-v1
