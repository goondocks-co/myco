name: copilot
displayName: GitHub Copilot
binary: copilot
health:
  installLocations: []
  activityLocations: [{ kind: file, path: "@transcripts" }]
configDir: .copilot
pluginRootEnvVar: COPILOT_PLUGIN_ROOT
# A person moves this folder with COPILOT_HOME. Copilot writes `config.json` and `session-state/` on its first run there.
settingsFolder:
  path: ~/.copilot
  variable: COPILOT_HOME
  markers: [config.json, session-state]
# PascalCase hook registrations select Copilot CLI's compatible snake_case payload.
# https://docs.github.com/en/copilot/reference/hooks-reference
hookFields:
  sessionId: [session_id, sessionId]
  transcriptPath: [transcript_path, transcriptPath]
  lastResponse: [last_assistant_message, response]
  prompt: prompt
  toolName: [tool_name, toolName]
  toolInput: [tool_input, toolArgs]
  toolOutput: [tool_result, tool_response, toolResult]
capture:
  transcriptEvidence:
    toolCalls: recorded
    failedTools: recorded
    mycoCalls: recorded
    filesEdited: observed
    commits: member_report_required
  # One directory per session, holding an events log.
  transcriptDiscovery:
    roots: ["~/.copilot/session-state"]
    patterns:
      - "{sessionId}/events.jsonl"
  planDirs: []
registration:
  hooksTarget: .github/hooks/myco-hooks.json
  memberHooksTarget: .github/hooks/myco-hooks.json
  globalHooksTarget: ~/.copilot/hooks/myco-hooks.json
  hooksConfigVersion: 1
  hooksFileOwned: true
  mcpTarget: .mcp.json
  globalMcpTarget: ~/.copilot/mcp-config.json
  memberCaptureLimits: "Prompt-hook injection is unverified; registry memory arrives after a tool. Earlier transcripts need project attribution."
  skillsTarget: .agents/skills
  globalSkillsTarget: ~/.agents/skills
  retiredGlobalSkillsTargets:
    - ~/.copilot/skills
  settingsTarget: null
  globalSettingsTarget: null
  retiredHookSettings:
    chat.tools.terminal.autoApprove:
      myco: true
      myco-dev: true
  instructionsFile: .github/copilot-instructions.md
  hookResponse:
    format: json
    fieldNames: { additionalContext: additionalContext }
    shapes:
      PostToolUse: flat
      PostToolUseFailure: flat
      SubagentStart: flat
capabilities:
  turnRowSource: transcript
  subagentRowSource: hook
  transcriptFidelity: full
  promptSubmitInjection: false
  promptRecallToolDelivery: true
  preToolUseInjection: false
  sessionStartInjection: true
  subagentStartInjection: true
  canopyReadTools:
    # VS Code Copilot extension shape
    - tool: read_file
      pathField: filePath
    - tool: run_in_terminal
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl]
    # Copilot CLI shape
    - tool: view
      pathField: path
    - tool: bash
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl]
    - tool: powershell
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl, Get-Content, gc]
    - tool: grep
      pathField: path
  # Broader superset for capture's activities.file_path stamping —
  # repeats every canopyReadTools entry and adds Copilot's write-side
  # file mutators so the FTS index stays accurate on edits too.
  pathBearingTools:
    # VS Code Copilot extension shape
    - tool: read_file
      pathField: filePath
    - tool: run_in_terminal
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl]
    - tool: replace_string_in_file
      pathField: filePath
      mutates: true
    - tool: create_file
      pathField: filePath
      mutates: true
    - tool: apply_patch
      pathField: filePath
      mutates: true
    # Copilot CLI shape
    - tool: view
      pathField: path
    - tool: bash
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl]
    - tool: powershell
      pathField: command
      extract: shell-arg
      readCommands: [cat, head, tail, less, more, bat, wc, file, nl, sed, awk, grep, rg, perl, Get-Content, gc]
    - tool: edit
      pathField: path
      mutates: true
    - tool: create
      pathField: path
      mutates: true
    - tool: grep
      pathField: path

hooks:
  # Stop ships the transcript boundary from which the Deployment derives the reply.
  Stop:
    phases: [response, transcript]

# Prompts are named by the user messageId referenced by assistant requests.
promptIdentity:
  kind: transcript-only
  scheme: member-transcript-v1
  evidence: tests/fixtures/prompt-identity/copilot-user-prompt-submit.json

recordIdentity:
  scheme: source-record-v1
  schemes:
    legacy-session-v1:
      response:
        key:
          from: record
          path: id
        withinRecord: record-text
        evidence: tests/fixtures/record-identity-evidence.json
      tool-call:
        key:
          from: call
          path: toolCallId
        resultKey:
          from: result
          path: toolCallId
        evidence: tests/fixtures/record-identity-evidence.json
    source-record-v1:
      response:
        key:
          from: record
          path: id
        withinRecord: record-text
        evidence: tests/fixtures/record-identity-evidence.json
      tool-call:
        key:
          from: call
          path: toolCallId
        resultKey:
          from: result
          path: toolCallId
        evidence: tests/fixtures/record-identity-evidence.json
