name: skill-evolve
displayName: Skill Evolution
description: >-
  Evaluate and evolve existing Myco-managed skills. Assesses content
  freshness against new spores AND codebase drift from refactors,
  identifies merge and narrowness opportunities, and autonomously
  consolidates the skill inventory.
agent: myco-agent
prompt: >-
  Assess and evolve skills that have new knowledge, codebase drift,
  or structural overlap. The instruction contains pre-filtered skills
  with new spore IDs plus pre-computed structural and drift analysis.
isDefault: false
reasoningLevel: default
maxTurns: 72
timeoutSeconds: 2400
schedule:
  enabled: false
  intervalSeconds: 21600
  runIn:
    - idle
    - sleep
  preCondition: has-active-skills
params:
  assess_interval_hours: 24
  max_skills_per_run: 3
phases:
  - name: inventory
    reasoningLevel: low
    prompt: |
      The instruction contains pre-computed structural analysis of
      all active skills. Two mechanical signals are provided:

      1. **Narrow skills** — skills with <2 H2 sections are flagged
         as mechanically narrow. These are NOT broad enough for
         standalone domain status.

      2. **Overlap pairs** — skill pairs with similar descriptions
         OR overlapping H2 headings are flagged with scores.

      ## Your job: validate and assign targets

      For each **mechanically narrow** skill:
      - Confirm it is genuinely narrow (not a false positive, e.g.,
        a debugging playbook with one long section is not narrow).
      - Identify which broader skill it should be absorbed into.
        Look at the heading lists to find the best domain match.

      For each **overlap pair**:
      - Confirm the overlap is real (not just shared vocabulary).
      - If real, decide merge direction: which skill is the target
        (broader, higher generation) and which is the source.

      If no skills are flagged as narrow and no overlap pairs exist,
      you must STILL make both calls below — vault_set_state with
      empty arrays AND vault_report with action
      "skill-evolve-inventory". A prose-only answer fails this phase.

      ## Store results

      Store via vault_set_state with key: skill-evolve-inventory as:
      {
        "run_id": "{{run_id}}",
        "merge_candidates": [
          { "source": "source-skill", "target": "target-skill",
            "reason": "overlapping setup workflow" }
        ],
        "narrow_candidates": [
          { "skill": "narrow-skill", "absorb_into": "broader-skill",
            "reason": "single narrow procedure" }
        ]
      }

      Only override the mechanical signals when you have clear
      evidence that the flag is wrong. The default is to act on
      the mechanical flags, not to find reasons to keep everything.

      ## Output discipline

      Keep responses terse. No narrative explanations.
      Do not provide analytical prose, rationale paragraphs, or
      walkthrough text outside tool payloads.
      Final phase summary must be <= 2 lines.
      Required output shape:
      - One `vault_set_state` call with merge/narrow arrays.
      - One `vault_report` call with action: "skill-evolve-inventory" and counts.
      - Final assistant text <= 2 lines, no explanatory prose.
    tools:
      - vault_set_state
      - vault_report
    maxTurns: 8
    required: true
    postCondition: skill-evolve-inventory

  - name: assess
    reasoningLevel: default
    prompt: |
      ## Scope boundary (critical)

      Mechanical drift signals are TRIAGE only. They are cheap hints,
      not source-of-truth code understanding.
      - Use pre-computed drift/growth signals to decide where to look.
      - Use agent exploration tools (vault_search_fts, fs_read, code_grep)
        for final judgment on whether content is truly stale/current.
      - Do NOT treat a single heuristic miss as authoritative when
        surrounding evidence indicates the skill is still accurate.

      Read two pre-computed inputs from vault_state:
        - key: skill-evolve-inventory (merge/narrow candidates)
        - key: skill-evolve-drift (mechanical drift + growth reports)

      Candidate metadata is triage input, not source-of-truth.
      If deferred or dismissed candidates overlap an active skill, use
      that as a signal that the skill's boundary may need expansion.
      Do not rewrite a skill based solely on candidate metadata; verify
      against spores, sessions, plans, or code before classifying STALE,
      MERGE, or NARROW.

      There are FOUR sources of skills to assess:

      **A. Skills with new knowledge** — listed in the instruction
      with descriptions and new spore IDs (full content is NOT in
      the instruction — read it on-demand). For each:
      1. Read new spores via vault_spores. Understand what changed.
      2. Only if the new spores suggest a procedural change, read
         the skill's full content via vault_skill_records (action:
         get, id: "<name>") and verify 2-3 code references via
         vault_search_fts. Skip content reads for skills where
         the new spores are clearly unrelated.
      3. Check the inventory AND drift analyses: is this skill also
         flagged for merge, narrowness, or codebase drift?

      **B. Inventory-flagged skills** — merge_candidates and
      narrow_candidates from the inventory analysis. These may NOT
      appear in the instruction (they may have no new knowledge).
      For each flagged skill not already covered above:
      1. Read its content via vault_skill_records (action: get).
      2. Verify the inventory's merge/narrow recommendation by
         reading both skills' content.

      **C. Drift-flagged skills** — reports from the mechanical pass with
      severity of `minor`, `major`, or `critical`. These may NOT appear
      in the instruction (no new spores) but need attention because
      their content no longer matches the codebase. For each drift
      report not already covered above:
      1. Read the skill's content via vault_skill_records (action: get).
      2. Trust `load_bearing_misses` as the STALE detail set.
         Re-check with fs_read/code_grep ONLY if confidence is low
         OR a claim is inconclusive.
      2b. If a mechanical miss appears to be a heuristic artifact
          (generic token, path-shape ambiguity, parser limitation),
          classify conservatively and explain the uncertainty.
      3. Major/critical severity with confidence high/medium should
         classify as STALE (or DEPRECATED if the entire subsystem
         described is gone). Minor severity may stay CURRENT unless
         combined with new-spore evidence.
      4. **fabrication_suspects** (symbols inside the skill's ```code```
         examples that are NOT found anywhere in the codebase) are NOT
         cosmetic. The mechanical scan cannot see inside fences, so these
         are the one signal for invented APIs. For each suspect, run one
         code_grep to confirm. If a suspect symbol genuinely does not
         exist (and is not obviously illustrative pseudo-code), classify
         the skill STALE — the example is fabricated and must be removed
         or corrected. Do NOT wave these away as a heuristic artifact the
         way you might a single path miss; a confidently-wrong code
         example is exactly the corruption this pipeline exists to catch.

      ## Drift classification threshold tuning

      For drift-only skills (no meaningful new-spore evidence), use a
      two-signal rule before STALE:
      - Signal A: high-confidence mechanical miss
        (major/critical severity with confidence high/medium), OR
      - Signal B: targeted exploration confirms the miss affects a
        load-bearing step in the current skill procedure.

      Classification policy:
      - STALE when A+B are both true, OR when there are 2+ independent
        load-bearing misses in different parts of the procedure.
      - CURRENT when only one weak/unconfirmed drift signal exists.
      - INCONCLUSIVE behavior: when evidence is mixed, prefer CURRENT
        with explicit "watch" details over forcing STALE.

      **D. Growth-flagged skills** — reports with non-empty `growth`
      where referenced TS files gained new exports since the skill's
      stored fingerprint baseline. For each growth report not already
      covered above:
      1. Read the skill's content via vault_skill_records (action: get).
      2. For each growth claim, run at most one targeted fs_read or
         code_grep call to decide if the new export is relevant to the
         skill's domain.
      3. If relevant, classify STALE and include details. If not
         relevant, keep CURRENT and explain why.

      ## Per-run scope cap

      Assess at most {{max_skills_per_run}} unique skills per run total across A/B/C/D.
      Prioritize in this order:
      1) Skills with new knowledge + high-confidence drift
      2) Skills with new knowledge only
      3) Drift-only skills with major/critical severity
      4) Remaining drift/growth-only skills
      Any remaining candidates must be deferred and listed in
      vault_report details under `deferred_skills`.

      For ALL skills from all sources, classify with one of:
         - CURRENT — still accurate, no changes needed.
         - STALE — new knowledge OR drift report changes specific
           steps, paths, or gotchas. Note exactly WHAT is new or
           wrong (cite the drift report's load_bearing_misses if
           that's the driver).
         - DEPRECATED — key code references are gone or the
           procedure is no longer relevant. Note what's missing.
           Drift severity=critical is the strongest signal here.
         - MERGE — overlaps significantly with another skill
           (from inventory analysis). Note the TARGET skill to
           merge into.
         - NARROW — too specific for standalone status (from
           inventory analysis). Note the BROADER skill to absorb
           into.

         Bias toward CURRENT for cosmetic issues. A skill that is 90%
         accurate is better left alone than rewritten with risk of
         losing detail. Do NOT bias toward CURRENT when a drift report
         flags load-bearing misses with high confidence — that's
         exactly the refactor-drift case this pipeline exists to catch.
         For drift-only cases with weak evidence, bias toward CURRENT
         and carry forward actionable watch notes.

      5. Update the skill's properties with the new watermark:
         vault_skill_records (action: update, id: <skill_id>,
         properties: '{"last_assessed_at": <now>,
         "knowledge_watermark": <now>,
         "last_classification": "<classification>",
         "last_assessed_generation": <skill's current generation>,
         "file_fingerprints": {...latest_report.current_fingerprints...}}')
         Set `last_assessed_generation` to the generation you read from the
         skill record. The selector uses it to tell whether act actually
         rewrote the skill (generation only advances on a real write): a
         skill left STALE/MERGE/NARROW whose generation has not advanced past
         this value is re-surfaced on a later run until the write lands.

      6. Store classifications via vault_set_state
         with key: skill-evolve-classifications as JSON:
         {
           "run_id": "{{run_id}}",
           "classifications": [
             { "skill_id": "skill-a", "name": "skill-a",
               "classification": "CURRENT", "target_skill": null,
               "details": "still accurate" }
           ]
         }

      Report via vault_report with action: "assess" and details:
      {
        "run_id": "{{run_id}}",
        "classifications": [
          { "skill_id": "skill-a", "name": "skill-a", "classification": "CURRENT",
            "target_skill": null, "details": "still accurate" }
        ],
        "deferred_skills": ["skill-b"]
      }
      The `classifications` array must contain the same assessed skills and
      classifications written to skill-evolve-classifications.

      ## Budget discipline

      Total budget for this phase: {{max_turns}} turns.
      Tools available for this phase: {{phase_tools}}.
      Spread budget across all flagged skills from A/B/C/D.
      Plan per-skill budget roughly as `{{max_turns}} / skills_selected`
      where skills_selected is the number of unique skills surfaced by
      the pre-computed reports.

      Hard limits:
      - At most 2 tool calls per inconclusive or growth claim.
      - Do not rerun broad exploration if a targeted check already
        answers the classification decision.
      - Mechanical triage should narrow search scope, not replace
        repository exploration when a real decision is required.

      Per-skill stop conditions:
      - For drift-only skills, perform at most 1 targeted re-check
        unless evidence directly conflicts.
      - If classification reaches confidence threshold, stop tool calls
        for that skill immediately.
      - If still ambiguous after the allowed check, classify CURRENT
        with explicit watch notes (do not continue probing).

      ## Output discipline

      Keep responses terse. No long prose or per-skill essays.
      Store details in vault_set_state payloads, not in narrative text.
      Final phase summary must be <= 6 lines.
      Required output shape for this phase:
      1. One `vault_set_state` write containing the complete
         `skill-evolve-classifications` payload for all assessed skills.
      2. One `vault_report` call with aggregate counts and any deferred/watch
         notes.
      3. Final assistant text <= 4 lines, no narrative walkthrough.
    purpose: >-
      Writes classification updates (CURRENT, STALE, MERGE, or NARROW — every
      assessed skill gets one, healthy skills included) to vault_skill_records
      properties (last_assessed_at, knowledge_watermark, last_classification,
      last_assessed_generation, file_fingerprints) for assessed skills.
      vault_skill_candidates is read-only triage input in this phase — it is
      consulted for merge/narrow signals but never created, updated, or
      deleted here.
    tools:
      - vault_spores
      - vault_search_fts
      - vault_skill_candidates
      - vault_skill_records
      - vault_set_state
      - vault_report
      - fs_read
      - code_grep
    maxTurns: 14
    required: true
    postCondition: skill-evolve-assess
    # fs_read/code_grep give this phase final-judgment access to the actual
    # codebase — on a scheduled run for a registered project with no working
    # tree (Team Host) that surface doesn't exist. Skip rather than error; a
    # skip here does not fail the run (infra omission, not a content
    # failure). `act` already carries this stamp and depends on `assess`, so
    # the downstream write phase was already skipping — this closes the gap
    # for `assess` itself.
    requiresProjectTree: true
    dependsOn:
      - inventory

  - name: act
    # Skill-writing is synthesis: it rewrites and merges SKILL.md content
    # that every agent loads as authoritative procedure. On the cheap tier
    # this phase fabricated code symbols (invented functions/env vars) into
    # a skill — the same judgment-on-cheap-tier failure that hurt spore
    # extraction, but worse because skills are trusted. Runs on `default`.
    reasoningLevel: default
    prompt: |
      Read classifications from vault_state
      (key: skill-evolve-classifications). Parse the JSON.

      For each classified skill, take the appropriate action:

      ## CURRENT — No action. Skip.

      ## STALE — Targeted update

      1. Read the current skill content from vault_skill_records
         (action: get).
      2. Express the change as minimal `vault_edit_skill` edits
         (`old_string`→`new_string`) against the current content —
         do NOT regenerate the whole file. The tool validates the
         full reconstructed skill on apply (rejects any hard/warn
         contamination, fabricated refs, length/floor, protected-
         frontmatter change) and returns batched issues; fix exactly
         those and re-edit. Use `vault_write_skill` only for creates
         and MERGE/NARROW.
         Anchor-selection: Pick an `old_string` that occurs exactly
         once (include a surrounding line or two for uniqueness);
         never empty; use `replace_all` for a token that repeats;
         insert by anchoring on a nearby heading.
         Protected frontmatter rules (enforced by vault_edit_skill):
         - user-invocable: cannot be changed via edit (rejected)
         - allowed-tools: cannot be changed via edit (rejected)
         - description: do not shorten (>10% reduction is rejected)
      3. vault_edit_skill returns batched issues on any validation
         failure; fix exactly the reported items and re-edit.
         Hard limit: at most 2 re-edits per skill.
      4. Preserve the existing skill `source_ids`. `vault_edit_skill`
         records a lineage row (generation bump, content snapshot) on
         every successful edit. If (and only if) the update is based on
         NEW source evidence, pass `source_ids` to `vault_edit_skill` as
         the UNION of the skill's existing source_ids plus the new source
         IDs — the tool persists them and records `source_ids_added` in
         lineage. Otherwise omit `source_ids` to keep the stored set
         unchanged. Do NOT do a separate vault_skill_records update for
         source_ids — it bumps no generation and writes no lineage row.

      ## DEPRECATED — Retire the skill

      1. vault_skill_records (action: update, status: retired)
      2. vault_skill_records (action: delete)

      ## MERGE — Absorb into target skill

      1. Read BOTH skills' full content from vault_skill_records
         (action: get) — the source and the target.
      2. Write MERGED content to the TARGET skill via
         vault_write_skill. The merged skill should:
         - Keep the target skill's name and frontmatter
         - Incorporate the source skill's procedures as new sections
         - Preserve all concrete file paths, code patterns, and
           gotchas from both skills
         - Have a coherent structure (not just concatenation)
         Protected frontmatter rules apply to the target.
         Pass source_ids as the union of the target and source
         skill source_ids so lineage survives the merge.
      3. Rationale should explain: "Merged <source> into <target>:
         <what was added>."
      4. Delete the SOURCE skill: vault_skill_records (action: delete)
         This cascades (lineage, usage, linked candidates).

      ## NARROW — Absorb into broader skill

      Same as MERGE: read both, write merged content to the broader
      skill, delete the narrow one. The narrow skill becomes a section
      within the broader skill.

      ## Verify before you write — the gate IS the guarantee (critical)

      You are EVOLVING existing skills, not authoring from imagination.
      For STALE: `vault_edit_skill` is the validation gate — it runs
      fabrication detection, contamination, length/floor, and frontmatter
      checks on the full reconstructed content on apply. Do NOT also
      manually grep every claim — that is what made earlier runs cost
      32 searches per skill.

      After vault_edit_skill applies:
      - **Issues reported** → look up the correct value with at most 1
        targeted `fs_read` or `code_grep` per flagged item, fix it, re-edit.
      - **No issues** → done immediately. Zero manual lookups needed.

      Hard limit: **at most 2 manual lookups per skill** (only to resolve
      tool-flagged items). An accurate, shorter skill beats a padded one.

      ## Edit surgically — minimal diff

      Evolution means targeted edits, not rewrites. Start from the
      existing content verbatim and change ONLY what the classification
      requires. Do NOT add large speculative sections or code examples
      the classification didn't call for — that is how fabrication and
      runaway output happen. If a skill needs broad new authored content,
      that is a survey/generate concern, not evolve.

      ## Budget discipline (hard)

      Total budget: {{max_turns}} turns across ALL selected skills. Plan
      roughly `{{max_turns}} / skills_selected` turns per skill (~4–5 typical for an edit; the formula gives the per-skill ceiling):
      read skill → vault_edit_skill edits → fix reported issues (≤2
      re-edits if needed) → done. If you are running past your share
      for a skill, STOP, make the safe minimal edit with what you have
      confirmed (omit unverified claims), re-edit, and move on. NEVER
      let one skill consume the budget — a clean partial pass beats
      capping out.
      If you approach the total budget, call `vault_report` with what you
      completed and which skills you deferred, then finish.

      ## Important

      - Process MERGE/NARROW actions AFTER STALE updates, so you're
        merging already-refreshed content.
      - Cost/quality guardrail: process at most {{max_skills_per_run}} STALE updates per run.
        If more than {{max_skills_per_run}} are classified STALE, process the top {{max_skills_per_run}} by impact
        (critical drift > major drift > both drift+new knowledge > new knowledge only),
        report deferred skill names via vault_report, and leave their
        classifications in state for a future run.
      - If vault_write_skill rejects a merge (e.g., dedup gate trips),
        check the error and adjust content. If truly blocked, skip
        and report the issue.
      - Do not update skill candidates from skill-evolve. Candidate
        quality metadata belongs to survey/generate; evolution should
        preserve skill record lineage and report issues via vault_report.

      Report all actions via vault_report.

      ## Output discipline

      Keep responses terse. Avoid narrative writeups.
      Final phase summary must be <= 5 lines plus deferred-skill list.
      Required output shape:
      - One `vault_report` with executed/deferred counts.
      - Final assistant text <= 3 lines.
    purpose: >-
      Applies classified merges, narrowing, and content updates by writing
      to vault_skill_records — status transitions to retired/deleted for
      DEPRECATED and merged-away skills, and lineage-bearing content changes
      via vault_edit_skill/vault_write_skill, which carry no destructiveHint
      of their own.
    tools:
      - vault_edit_skill
      - vault_write_skill
      - vault_scan_skill_contamination
      - vault_skill_records
      - vault_search_fts
      - fs_read
      - code_grep
      - vault_report
    deferredTools:
      - vault_scan_skill_contamination
    # This is a CEILING, not a target. The workflow is now edit-driven:
    # read → vault_edit_skill edits → fix reported issues (≤2 re-edits)
    # → done per skill, ~4–5 turns. With 6 skills that's ~24–30 turns;
    # 36 gives headroom for MERGE/NARROW full-writes and edge cases.
    # Earlier ceilings of 24 and 40 were overrun because prose limits
    # were ignored — the edit tool's built-in gate removes the unbounded
    # search loop that caused the overruns. The maxTurns enforcement is
    # SDK-delegated (soft cap; effective cap may run a few turns past this
    # value). If max_skills_per_run changes, scale this ~5–6× per skill.
    maxTurns: 36
    required: true
    # vault_edit_skill/vault_write_skill publish through writePublishedSkillFile,
    # which mkdirSync(..., {recursive:true})s the destination — on a scheduled
    # run for a registered project with no working tree (Team Host) that would
    # silently create a phantom directory tree at the member's projectRoot path
    # instead of erroring. Skip rather than write; a skip here does not fail
    # the run (infra omission, not a content failure — same contract as a
    # map-phase provider-outage skip on a required phase).
    requiresProjectTree: true
    dependsOn:
      - assess
