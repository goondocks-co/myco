# =============================================================================
# Built-in Task: Cortex Instructions
# =============================================================================

name: cortex-instructions
displayName: Cortex Instructions
description: >
  Author compact session-start instructions that teach downstream agents how
  to use Myco tool behavior correctly, especially retrieval and plan persistence.
agent: myco-agent
isDefault: false
reasoningLevel: default
maxTurns: 12
timeoutSeconds: 180
schedule:
  enabled: true
  intervalSeconds: 14400
  runIn:
    - idle
    - sleep

prompt: |
  You are producing session-start instructions for another coding agent
  working in this project. The final artifact is written in the `author`
  phase via `vault_report` with action "cortex_instructions". The `research`
  phase does NOT draft markdown — it produces a compact situation brief
  that the author phase shapes into prose.

  You will receive:
  - current context configuration and capability summary
  - tool guidance that must be encoded in the final instructions
  - a digest excerpt plus recent sessions, spores (wisdom, decision, discovery),
    and active plans
  - authoring requirements that constrain the final output

  Do not restate AGENTS.md, installation details, or generic Myco boilerplate.
  Do not invent unavailable tools. Do not tell the downstream agent to call
  `myco_skills` — project and Myco skills are registered separately.
  Do not mention retired tool names, even as gotchas or historical context.
  If recent vault context mentions an obsolete name, translate it to the
  current owning tool from the tool guidance instead.

phases:
  - name: research
    prompt: |
      Produce a compact situation brief. DO NOT write the final markdown
      — that is the author phase's job.

      Output exactly this structure as your phase summary:

      ## Hotspots (2-3)
      - <named workstream, plan, or branch> — <one sentence on why a new
        agent working in this repo should know about it>

      ## Recent signal
      - <recent session title or spore worth citing> — <why it matters>

      ## Tool-use hint
      - <one concrete hint a new agent would benefit from, grounded in
        the recent activity above — e.g. "check active plans before
        proposing X because plan Y already covers it">

      Use the pre-assembled input (digest, recent sessions, spores,
      active plans) as your starting point. Use `vault_search_fts`,
      `vault_spores`, `vault_session_summary_material`, and
      `vault_sessions` only to confirm a hotspot is current or to
      disambiguate. Prefer active plans and the last 3 settled sessions
      as anchors. If the input names a hotspot, verify it's still live
      before keeping it — stale hotspots (work that has shipped and
      moved on) are worse than no hotspot. Use release state to distinguish
      shipped guidance from active unreleased work; unknown evidence can still
      be mentioned when it is the best current signal.

      If you cannot identify 2-3 genuine hotspots, emit fewer — never
      pad with boilerplate.
    tools:
      - vault_read_digest
      - vault_sessions
      - vault_session_summary_material
      - vault_spores
      - vault_search_fts
      - vault_search_semantic
      - vault_release_state
    maxTurns: 10
    required: true
    readOnly: true

  - name: author
    dependsOn: [research]
    prompt: |
      Write the final session-start markdown from the research brief.

      Required structure (emit sections in EXACTLY this order — the
      ordering is load-bearing, last-section primacy is intentional):

      1. `## Myco-Enabled Project` heading, then one sentence
         explaining that Myco provides project memory, prior decisions,
         plans, and retrieval tools for this repository.

      2. A skill-reference sentence telling the agent to use the `myco`
         skill as the fuller workflow reference for design decisions,
         non-obvious debugging, prior-project context, plan work,
         durable knowledge capture, and delegation; the explicit tool
         guidance in these instructions is the compact always-on version
         of that workflow. Do not tell the agent to call `myco_skills`.

      3. A retrieval paragraph structured as two short workflow-framed
         sentences, in this order:

         (a) Canopy Map opener — if and only if the tool guidance
             flags `myco_cortex` op `"canopy_map"` as a default opener,
             lead with a single MCP-form sentence such as
             "Call `myco_cortex({"op":"canopy_map"})` first when you
             need project layout — finding a feature, locating the right
             file before editing, or orienting in this codebase." Use
             exactly one invocation form (MCP). Do NOT also list the
             `node .agents/myco-cli.cjs tool call ...` CLI form in this
             paragraph; the dual-form phrasing reads as two redundant
             steps and is the reason agents skip the tool. Frame it as a
             default first move, never as a condition the agent
             self-evaluates ("when you need to explore unfamiliar code",
             "if you're new to the project"). Do NOT enumerate other
             `myco_cortex` ops here — `digest` and `canopy_entry` do not
             belong in the opener sentence.

         (b) Search sentence — describe `myco_search` by the workflow
             moment that triggers it, not by listing tool args: prior
             decisions, bug fixes, why-was-this-built questions, or
             locating source by what it does. Explain that every result
             includes a stable ID and a `retrieve` hint pointing to the
             owning entity tool (`myco_sessions`, `myco_plans`,
             `myco_spores`, etc.). Mention `myco_cortex` op
             `"canopy_entry"` only here, as the follow-up move for a
             canopy search result — not as a sibling of `canopy_map`.

         The two sentences MUST be a single paragraph (no list, no
         sub-bullets) so the reading flow is "default first move →
         situational lookup."

      4. A planning-context paragraph naming `myco_plans` with
         op `"list"`, `"get"`, and `"save"`. Trigger `op:"list"`
         around planning, not around every implementation edit: say
         that before creating a new plan or spec, or when existing
         plans may already cover the work, the agent should check for
         existing plans. Also teach `myco_cortex` op `"digest"` as the
         explicit, optional high-fidelity memory pull for large refactors,
         large features, broad planning, or unfamiliar cross-system
         changes; recommend tier 5000 by default and tier 10000 only when
         the agent has budget and needs deeper historical background. Say
         not to pull the digest for narrow edits. Do not say "before
         implementing anything."

      5. A delegation sentence telling the agent that when composing a
         child-agent, subagent, teammate, worker session, or other spawned
         process prompt, and Myco has not already injected subagent-start
         Cortex context, it should refresh the current project instructions
         with `myco_cortex({"op":"instructions"})` and include the returned
         instructions verbatim in that agent's prompt, along with the
         task-specific instructions. Include this CLI fallback in the same
         sentence for hosts without MCP:
         `node .agents/myco-cli.cjs tool call myco_cortex --json --input '{"op":"instructions"}'`.
         Do not assume the returned instructions have any particular
         heading or section name.

      6. A `### Recent workstreams` section that MUST cite at least
         one active plan or recent session BY TITLE from the research
         brief. Frame these as background context — work the project
         has on file, not a task list for the incoming session. The
         new agent is launching to do something else; this section
         helps it avoid duplicating effort or contradicting in-flight
         work when its actual task happens to overlap. If the research
         brief suggests a tool invocation that is not already present
         in the required retrieval, plan-persistence, delegation, or
         spore-save guidance, omit that invocation; recent-workstream
         prose must not invent additional tool operations or new
         `myco_cortex` ops. If the research
         brief contains zero hotspots, write "No recent workstreams
         worth flagging right now." verbatim — do not invent, recycle,
         or pad with stale items.

      7. A closing paragraph on `myco_spores` op `"save"` for saving
         discoveries during this session. Name 2-3 concrete moments
         that trigger a save — for example, after fixing a non-obvious
         bug, after making a design decision with non-obvious reasoning,
         after discovering a gotcha, or after learning something
         surprising about how a component actually behaves. Mirror the
         workflow-trigger framing of the plan-persistence paragraph
         ("when you do X, call op:save") rather than a passive "as you
         work, capture what you discover." This is the call-to-action —
         it lands last on purpose so the freshest impression is a
         directive to save, not the background plan list. Remind the
         agent to prefer specific over vague: name the file, function,
         or component, and explain the *why*.

      Keep the output compact and ready for direct injection. Do not
      restate AGENTS.md. Do not mention `myco_skills`. Do not reorder
      the seven required items. Do not mention retired tool names, even as
      warnings, migration notes, or historical gotchas.

      Report the final markdown via `vault_report` with:
      - action: "cortex_instructions"
      - summary: what the instructions emphasize
      - details.content: the final markdown
    tools:
      - vault_report
    maxTurns: 4
    required: true
