# =============================================================================
# Built-in Task: Title & Summary
# =============================================================================
# Lightweight task triggered by batch threshold or session stop, or dispatched
# for one named session (a Deployment names the target on every dispatch).
# Only generates titles and summaries — no extraction or graph work.
# =============================================================================

name: title-summary
displayName: Title & Summary
description: >
  Generate titles and summaries for sessions that lack them. Reviews
  prompt batches and activities within each session to produce a concise
  title and informative summary.
agent: myco-agent
isDefault: false
reasoningLevel: low
maxTurns: 15
timeoutSeconds: 300

prompt: |
  Generate or update session titles and summaries. Budget: ~12 turns.

  Target session: {{session_id}}

  If the target session field above is empty, scan all recent sessions.

  ## Phase 1 — Find Sessions to Process (budget: 3 turns)

  **If a target session ID is specified above:**
  Always process it — the user explicitly requested regeneration.
  Call `vault_session_summary_material` with `session_id: <target session>`
  to get the current title/summary plus the compact ordered prompt-batch arc.
  Do NOT skip even if there are no new unprocessed batches.

  **If no target session specified (a local automatic run; a dispatched run
  always names its target):**
  Call `vault_unprocessed` with `include_active: true, grouping_only: true` —
  titles are needed mid-flight, not just after a session completes, and the
  content-free listing means this step never mixes two sessions' content
  into one context. Group the returned ids by session_id — each session
  with unprocessed batches needs its summary updated. Do NOT read session
  content here; content comes only from the per-session
  `vault_session_summary_material` call in Phase 2, one session at a time.
  If no sessions have unprocessed batches, skip straight to Phase 3 and
  report a zero-update summary.

  ## Phase 2 — Update Each Session (budget: 8 turns)

  For each session to process:
  1. Read the EXISTING title and summary — context from prior runs.
  2. Read the session's compact prompt-batch arc — user_prompt +
     response_summary. This is your PRIMARY source — read through the full
     set to understand the complete arc of work.
  3. Generate a title and summary from the full session content.
  4. Call `vault_update_session` with BOTH title and summary.

  ## Title Rules (CRITICAL)

  The title describes WHAT WAS ACCOMPLISHED, not what was asked.

  - Under 80 characters, sentence case
  - Synthesize from the full arc of prompt batches, not just the first one
  - NEVER use file paths, directory names, or working directory as the title
  - NEVER copy the user's first message as the title
  - NEVER use truncated prompts ending in "..."
  - Good: "Wave-based parallel executor and per-task provider config"
  - Good: "SQLite migration with FTS5 search and vector embeddings"
  - Bad: "/git-worktree" (directory path, not a title)
  - Bad: "Help me fix the bug in..." (user's prompt)
  - Bad: "Working on code" (too vague)

  ## Summary Rules

  2-4 sentences. Rich in detail — session summaries are embedded and used
  for semantic search. Include: what was built/fixed, key files touched,
  tools used, and outcomes. Cover the FULL session arc, not just one prompt.

  ## Phase 3 — Report (budget: 1 turn)

  Always call `vault_report` with action "summary" — even when there was
  nothing to do. Set `details` to a structured object:
  - `run_id`: leave empty string; the report is recorded against the current run
  - `updated`: number of sessions you called `vault_update_session` for
  - `skipped`: number of sessions left as-is (already current)

  In the summary text, name each skipped session and the reason. A run
  with zero unprocessed sessions still reports `updated: 0` — that is a
  normal, successful outcome, not a failure.

toolOverrides:
  - vault_unprocessed
  - vault_session_summary_material
  - vault_update_session
  - vault_report
