# =============================================================================
# Built-in Task: Supersession Sweep
# =============================================================================
# Scan active spores for duplicates, contradictions, and outdated
# observations. Supersede, consolidate, or obsolete as appropriate.
# =============================================================================

name: supersession-sweep
displayName: Supersession Sweep
description: >
  Scan active spores for duplicates, contradictions, and outdated
  observations. Supersede, consolidate, or obsolete spores as appropriate.
  Records resolution events for audit trail.
agent: myco-agent
isDefault: false
reasoningLevel: low
maxTurns: 30
timeoutSeconds: 300

prompt: |
  Review active spores for supersession opportunities. Budget: ~25 turns.

  ## Phase 1 — Inventory (budget: 4 turns)

  1. Call `vault_spores` with status "active" to list spores as previews —
     id, observation type, importance, created time, and the first 200
     characters of each body. Note the `total`: that is how many active
     spores exist, and the page you were given may be smaller.
  2. If `total` is larger than the page, call `vault_spores` again with
     `offset` advanced by the page size until you have covered the total or
     spent this phase's budget. Previews are the whole inventory — never try
     to read every body.

  ## Phase 2 — Candidate clusters (budget: 8 turns)

  1. Group the previews by observation_type (gotcha, decision, discovery,
     trade_off, bug_fix, wisdom, pattern, architecture). Within a type, look
     for previews naming the same component, file, error, or decision.
  2. A group of previews that look like the same topic is a candidate
     cluster. A preview with no neighbour is not a candidate — leave it.
  3. Only for a candidate cluster, call `vault_spore` with each member's id
     to read the full body, its lineage, and its context. The run holds 12
     full reads; past that `vault_spore` answers that the budget is spent
     and the rest must be judged by their previews. Spend the reads on the
     clusters most likely to resolve, and prefer clusters of 3+ over pairs.
     A body longer than 8000 characters arrives cut, flagged `truncated`.

  ## Phase 3 — Resolution and Wisdom Creation (budget: 10 turns)

  Decision tree for each cluster, judged on the FULL bodies you read:
  - 3+ related active spores on same topic → create wisdom, consolidate all
  - Exactly 2 related spores → keep the better one, supersede the other
  - 1 spore (no duplicates) → no action

  **If 3 or more related active spores cover the same topic:**
  1. Create a wisdom spore via `vault_create_spore`:
     - observation_type: "wisdom"
     - properties: '{"consolidated_from": ["id-1", "id-2", "id-3"]}'
     - Content MUST preserve ALL specific details from the sources —
       file paths, error messages, concrete values. Wisdom is a
       comprehensive reference, not a vague summary.
  2. Resolve EACH source via `vault_resolve_spore` with action
     "consolidate", `spore_id` the source and `new_spore_id` the wisdom
     spore you just created, so they are removed from search results and
     context injection.

  **If 2 related spores cover the same topic (pair):**
  1. Determine which spore has the best content (most complete, most accurate)
  2. Call `vault_resolve_spore` with action "supersede" on the inferior spore:
     - spore_id: the inferior spore's ID
     - new_spore_id: the kept spore's ID
     - reason: specific explanation (not just "duplicate")

  **For truly outdated spores (no longer relevant, with no replacement —
  e.g. a dropped feature):**
  - Call `vault_resolve_spore` with action "obsolete"
  - spore_id: the outdated spore's ID
  - reason: explain what changed (required)

  Only supersede or consolidate when the new information genuinely replaces
  the old. When in doubt, keep both.

  ## Phase 4 — Report (budget: 2 turns)

  Call `vault_report` with action "supersession". Set `details` to a
  structured object with the counts:
  - `reviewed`: how many spores you inventoried in Phase 1
  - `superseded`: how many spores you superseded
  - `consolidated`: how many spores you consolidated
  - `obsoleted`: how many spores you obsoleted

  In the summary text, name each resolution and its reason. A run that
  found nothing to resolve still reports, with
  `reviewed: N, superseded: 0, consolidated: 0, obsoleted: 0` — that is a
  normal, successful outcome, not a failure.

toolOverrides:
  - vault_spores
  - vault_spore
  - vault_create_spore
  - vault_resolve_spore
  - vault_report
