name: okf-maintain
displayName: OKF Maintain
description: >-
  Maintain the repository Open Knowledge Format bundle from Myco project intelligence.
agent: myco-agent
prompt: >-
  You maintain this project's Open Knowledge Format bundle. Deterministic spore and
  Canopy concepts are regenerated automatically; your judgment applies only to
  agent-maintained concepts under concepts/ — creating, updating, or superseding
  cross-source project concepts grounded in cited evidence.
isDefault: false
reasoningLevel: low
maxTurns: 24
timeoutSeconds: 1800
schedule:
  enabled: true
  intervalSeconds: 21600
  runIn:
    - idle
    - sleep
  preCondition: okf-maintain-due
  maxRunsPerDay: 4
phases:
  - name: gather
    prompt: |
      Review the change brief. Call okf_list_changes to see which source concepts
      changed since the last inputs hash. Emit agent_work_due=true via
      phase_emit_metadata only when agent-maintained concepts under concepts/ are
      invalidated or improvable; otherwise emit agent_work_due=false. Then call
      okf_report to record the maintenance summary. Do not write concepts in this
      phase.
    tools:
      - okf_read_bundle
      - okf_list_changes
      - phase_emit_metadata
      - okf_report
    maxTurns: 6
    required: true
    readOnly: true
  - name: render
    prompt: |
      Update agent-maintained concepts under concepts/ that are invalidated or
      improvable given the changed sources. Every claim must cite source concepts
      (source_concepts frontmatter or in-bundle links). Prefer updating existing
      concepts over creating near-duplicates. When done, call okf_report with your
      final summary. Publication happens automatically after the run succeeds.
    tools:
      - okf_read_bundle
      - okf_write_concept
      - okf_report
    maxTurns: 16
    required: false
    dependsOn:
      - gather
    gateOnPriorMetadata:
      phase: gather
      key: agent_work_due
      equals: true
