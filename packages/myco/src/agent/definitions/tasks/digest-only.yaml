# =============================================================================
# Built-in Task: Digest Only
# =============================================================================
# Regenerate digest extracts without processing new data.
# Useful after manual edits to spores or after a consolidation run.
# =============================================================================

name: digest-only
displayName: Digest Only
description: >
  Regenerate digest extracts at all token tiers using current vault knowledge.
  Does not process new data or extract spores. Useful after manual edits
  to spores or graph data.
agent: myco-agent
isDefault: false
reasoningLevel: default
maxTurns: 28
timeoutSeconds: 1800

prompt: |
  Regenerate digest extracts from the project's current knowledge.

  ## Phase 1 — Assess Current State (budget: 4 turns)

  1. Call `vault_read_digest` with no tier to see what each tier holds and when
     it was written
  2. Call `vault_spores` with status "active" to see the current observations as
     previews
  3. Call `vault_sessions` to see the project's settled sessions, newest first

  If the current digest is recent and nothing meaningful has landed since it was
  written (compare the spore previews and the session dates against the tiers'
  generated times), call `vault_report` with action "skip" and a summary saying
  the digest is already current, then stop. Only continue where there is genuine
  new material.

  ## Phase 2 — Read the New Material (budget: 6 turns)

  Judge the previews from Phase 1 and pick the spores carrying material the
  digest does not have. Page through `vault_spores` with `offset` when what you
  need is past the first page, and narrow with `observation_type` or `search`
  once a theme is clear.

  Read in full, with `vault_spore`, only the spores you mean to write from. The
  full reads are budgeted for the run — spend them on the bodies that will change
  the text and judge the rest by their previews. Use `vault_sessions` for the
  workstreams a body refers to.

  The existing digest is your baseline: integrate new material into it rather
  than starting over, unless the instructions for this run tell you to write from
  the material alone.

  Prefer settled, high-confidence observations when writing general guidance.
  Keep unreconciled observations as recent context and frame them as needing
  verification instead of presenting them as shipped behavior.

  ## Phase 3 — Update Extracts (budget: 25 turns)

  Update ALL 3 tiers in this order (largest first — each subsequent tier
  is a compression of the one above):
  1. Tier 10000 — Full institutional knowledge (update if any new content)
  2. Tier 5000 — Deep onboarding (update if new trade-offs or patterns)
  3. Tier 1500 — Executive briefing (most compressed — update if
     important new decisions or gotchas)

  For each tier: read current content via `vault_read_digest`, then write
  the updated version via `vault_write_digest`. Each tier is self-contained.
  Preserve well-crafted existing content — integrate new material, don't
  rewrite from scratch.

  A `null` digest from `vault_read_digest` means the project holds no extract at
  that tier: write that tier fresh from the material rather than from a
  neighbouring tier's text.

  If a tier genuinely has no new material to integrate, skip it — but
  do not skip tiers just to save turns. All 3 tiers should be kept current.

  Prioritize within each tier: recent insights > active decisions >
  unresolved gotchas > architectural patterns > historical context.

  ## Phase 4 — Report (budget: 1 turn)

  Call `vault_report` with action "digest" and details carrying:
  - `tiers_updated`: the tiers you wrote
  - `tiers_skipped`: the tiers that were already current
  - `spores_used`: how many spores you read in full
  - `sessions_used`: how many sessions you drew on

toolOverrides:
  - vault_report
  - vault_spores
  - vault_spore
  - vault_sessions
  - vault_read_digest
  - vault_write_digest
