# =============================================================================
# Built-in Task: Vault Evolve (Phased)
# =============================================================================
# Default task for: myco-agent
#
# Complete intelligence pipeline using phased execution. Each phase is a
# separate query() call with scoped tools and turn limits. The executor
# controls the loop — the LLM cannot skip phases.
# =============================================================================

name: vault-evolve
displayName: Vault Evolve
description: >
  Complete intelligence pass over all unprocessed session data. Extracts
  observations as spores, updates session summaries, consolidates related
  spores into wisdom, and regenerates digest extracts. Runs automatically
  on a schedule once sessions have settled.
agent: myco-agent
isDefault: true
maxTurns: 150
timeoutSeconds: 1800
reasoningLevel: default

schedule:
  enabled: true
  intervalSeconds: 21600
  runIn:
    - idle
    - sleep
  preCondition: has-unprocessed-batches
  # Each unprocessed batch is ~30–60s of multi-stage LLM work, but the
  # batch count is now `origin = 'human'` only (env_context, task
  # notifications, and other harness-injected `system` batches are
  # excluded — they carry no user intent and shouldn't trip the
  # accelerator). Thresholds sized so a single user-day of human
  # prompts (~50–150) stays at steady tier; only sustained backlogs
  # from heavy multi-day workloads trip accelerated.
  accelerator:
    name: unprocessed-settled-batches
    thresholds:
      steady: 25
      accelerated: 100
  # Hard 24h ceiling. The accelerator decides cadence within the day;
  # this caps the day. Six runs/24h × ~$1.40/run ≈ $8.40/day worst case
  # for vault-evolve. Without the ceiling, accelerated mode on a heavy
  # machine can produce 20+ runs/day before the queue drains.
  maxRunsPerDay: 6

orchestrator:
  enabled: true
  reasoningLevel: default
  maxTurns: 3

contextQueries:
  pre-planning:
    - tool: vault_unprocessed
      queryTemplate: ""
      limit: 5
      purpose: "Check if there are unprocessed batches"
      required: false
    - tool: vault_state
      queryTemplate: ""
      limit: 10
      purpose: "Get agent cursor state"
      required: false
    - tool: vault_spores
      queryTemplate: ""
      limit: 20
      purpose: "Review recent spores for consolidation candidates"
      required: false

prompt: >
  You are executing one phase of a multi-phase intelligence pipeline.
  Each phase has its own scoped tools — only use the tools available to you.
  Do NOT report on tools or work outside your current phase.
  Focus on quality over quantity — one precise observation is worth more
  than ten vague ones. Use release state as conservative context:
  released/high-confidence knowledge is strongest for general guidance,
  while unknown, unreconciled, or unreleased knowledge can still be useful
  in-flight evidence.

phases:
  - name: read-state
    reasoningLevel: low
    # Root phase — no dependsOn
    prompt: |
      Read the current vault state to determine what needs processing.

      1. Call `vault_state` to get your cursor (`last_processed_batch_id`)
      2. Call `vault_unprocessed` with `after_id` set to your cursor

      If no unprocessed batches exist, report via `vault_report` with
      action "skip" and reason "no unprocessed batches".
    tools:
      - vault_state
      - vault_unprocessed
      - vault_spores
      - vault_release_state
      - vault_report
    maxTurns: 20
    required: true
    readOnly: true

  - name: extract
    reasoningLevel: low
    dependsOn: [read-state]
    prompt: |
      Extract observations from unprocessed batches as spores.
      CRITICAL: the vault must stay sharp, not bloated. Supersede, don't duplicate.

      If the prior phase reported no unprocessed batches, call `vault_report`
      with action "skip" and reason "no unprocessed batches" and finish.

      ## Step 1: Read batches and identify observations (budget: ~10 turns)

      PASS 1: Read all batches via `vault_unprocessed`. For each, note candidate
      insights as a mental list. Focus on genuine insights, not activity logs.

      PASS 2: Group similar insights into topics. Batches often repeat the same
      theme — group before searching to minimize tool calls.

      ## Step 2: Search and create/supersede (budget: ~20 turns)

      For each TOPIC you identified (not each batch — group first):
      1. Call `vault_search_semantic` with the topic to check existing coverage
      2. If a similar spore exists:
         - If your observation adds meaningful new detail: create the new
           spore, then supersede the old via `vault_resolve_spore`
           action "supersede" with new_spore_id
         - If your observation adds nothing new: skip it entirely
      3. If no similar spore exists: create it as new
      4. Mark the source batches as processed via `vault_mark_processed`

      ## Step 3: Update cursor (budget: 1 turn)

      Call `vault_set_state` to update `last_processed_batch_id`.

      ## Quality rules
      - One observation per spore — specific, not vague
      - Include session_id, prompt_batch_id, importance 1-10, tags
      - Supersede rather than duplicate — the vault gets sharper, not bigger
      - Group batches by topic to minimize search calls
      - If approaching the turn budget, stop and move on
    tools:
      - vault_unprocessed
      - vault_spores
      - vault_search_fts
      - vault_search_semantic
      - vault_release_state
      - vault_create_spore
      - vault_resolve_spore
      - vault_mark_processed
      - vault_set_state
      - vault_report
    maxTurns: 35
    required: true

  - name: summarize
    reasoningLevel: low
    dependsOn: [read-state]
    prompt: |
      Update session titles and summaries for sessions touched during extraction.

      ## Step 1: Find sessions with new activity (budget: 2 turns)

      1. Call `vault_unprocessed` — group batches by session_id. Each session
         with unprocessed batches needs its summary updated.
      2. Call `vault_sessions` to get existing titles/summaries for those sessions.

      If no sessions have new activity, report "skip" and finish.

      ## Step 2: Update each session (budget: 5 turns)

      For each session with new batches:
      1. Read the EXISTING title and summary — context from prior runs.
      2. Read the NEW prompt batches (from Step 1) — user_prompt + response_summary.
         This is your PRIMARY source. Understand the full arc of new work.
      3. Generate an UPDATED title and summary incorporating both existing
         context and new activity.

      ## Step 3: Write updates (budget: 2 turns)

      Call `vault_update_session` with BOTH title and summary.

      ### Title Rules (CRITICAL)

      The title describes WHAT WAS ACCOMPLISHED, not what was asked.
      - Under 80 chars, sentence case
      - Synthesize from the full arc of prompt batches, not just the first one
      - NEVER use file paths, directory names, or working directory
      - NEVER copy the user's first message as the title
      - Good: "Wave-based parallel executor and per-task provider config"
      - Bad: "/git-worktree" (directory path, not a title)

      ### Summary Rules

      2-4 sentences. Rich in detail — session summaries are embedded and used
      for semantic search. Include: what was built/fixed, key files touched,
      tools used, outcomes. Focus on what was accomplished across the FULL
      session, not just the first or last prompt.

      Report via `vault_report` with action "summary" for each update.
      If no updates needed, report action "skip" with reason.
    tools:
      - vault_sessions
      - vault_unprocessed
      - vault_spores
      - vault_release_state
      - vault_update_session
      - vault_report
    maxTurns: 10
    required: false

  # ---- Consolidate: cheap shortlist (haiku) → expensive write (sonnet) ----
  # Splitting the original 25-turn sonnet phase saves ~50% of consolidate
  # cost. The shortlist is search-heavy retrieval work that doesn't need
  # judgment — haiku does it for ~5× less per token. Only the wisdom
  # synthesis itself runs on sonnet.

  - name: consolidate-shortlist
    reasoningLevel: low
    dependsOn: [extract]
    readOnly: true
    # Mechanical gate: skip entirely if no recent spore activity. The
    # consolidate phases exist to merge/supersede related spores, which
    # is impossible without at least 3 active spores in the recent
    # window. The check is project-scoped SQL, runs in zero LLM turns.
    preCondition: has-recent-spore-activity
    prompt: |
      Find consolidation candidates. This is the cheap retrieval pass —
      a later phase (`consolidate-write`) does any actual wisdom creation
      or supersession based on your shortlist.

      Stay focused on recent or high-signal active spores; do not perform
      an exhaustive crawl if the first few targeted searches show no action.

      ## Step 1: Search for clusters (budget: 6 turns)

      1. Run targeted `vault_search_semantic` queries for themes touched by
         the current extract phase and other likely consolidation targets.
      2. For any candidate you need to inspect in full, call `vault_spores`
         with `ids: [...]` — never bulk-read an entire high-volume type.
      3. Skip spores with status "consolidated" or "superseded" to prevent
         cycles.

      ## Step 2: Emit a STRUCTURED shortlist (budget: 2 turns)

      Your final message MUST be parseable by the next phase. Use this
      exact format. If no clusters meet the bar, emit only the SKIP line
      and call `vault_report` with action "skip".

      ```
      SHORTLIST v1
      cluster: <one-line topic name>
        action: wisdom           # 3+ related active spores on same topic
        source_ids: [id1, id2, id3, ...]
        rationale: <why these belong together — 1 line>

      cluster: <topic>
        action: supersede        # exactly 2 spores; the newer/richer wins
        keep_id: <id of winner>
        old_id: <id to supersede>
        rationale: <1 line>
      ```

      Hard cap: emit at most 2 clusters per run. The downstream write
      phase has a small budget; over-feeding it produces nothing extra.
      Pick the highest-signal candidates first.

      If `vault_search_semantic` returns no results (embedding unavailable),
      report action "skip" and finish.

      Final summary MUST be ≤ 25 lines (the shortlist block plus a brief
      header). No prose recap of what you searched.
    tools:
      - vault_spores
      - vault_search_semantic
      - vault_release_state
      - vault_report
    maxTurns: 18
    required: false

  - name: consolidate-write
    reasoningLevel: default
    dependsOn: [consolidate-shortlist]
    # Same gate as the shortlist — when there's no recent activity, neither
    # phase should spawn (otherwise this phase pays sonnet rates to discover
    # nothing in the empty shortlist).
    preCondition: has-recent-spore-activity
    prompt: |
      Execute the shortlist from `consolidate-shortlist`. The judgment
      work — content synthesis, preserving specific details — needs the
      default tier; cheap retrieval already happened upstream.

      If the shortlist was empty or marked SKIP, call `vault_report` with
      action "skip" and finish immediately.

      ## Budget discipline

      The shortlist may contain up to 2 clusters. Each cluster needs
      roughly 4-6 turns (1 optional read + 1 create + 1-3 resolves).
      Process clusters in order. If you're past turn 11 and still have
      a cluster pending, STOP — call `vault_report` summarizing what
      you completed and which clusters you skipped, then finish. A clean
      partial result beats a failed full run.

      ## For each `action: wisdom` cluster

      1. (Optional, 1 turn) Re-read the source spores in full via
         `vault_spores(ids: [...])` if the shortlist didn't include enough
         body text to synthesize from. Skip if you already have what you need.
      2. Create a wisdom spore via `vault_create_spore`:
         - observation_type: "wisdom"
         - properties: '{"consolidated_from": [<source_ids>]}'
         - Content MUST preserve ALL specific details from sources —
           file paths, error messages, concrete values. Wisdom is a
           comprehensive reference, not a vague summary.
      3. Resolve EACH source via `vault_resolve_spore` action "consolidate"
         — this removes them from search and context injection.

      ## For each `action: supersede` cluster

      1. (Required) Read the keep spore in full via `vault_spores(ids: [<keep_id>])`
         to confirm it actually subsumes the old one. Never supersede on
         the shortlist's word alone.
      2. Call `vault_resolve_spore` action "supersede" with new_spore_id =
         keep_id and old_spore_id = old_id.

      Final summary MUST be ≤ 5 lines: how many wisdom spores created, how
      many supersedes applied, anything skipped. No retelling of the shortlist.
    tools:
      - vault_spores
      - vault_release_state
      - vault_create_spore
      - vault_resolve_spore
      - vault_report
    maxTurns: 15
    required: false

  # ---- Digest: assess + 3 parallel tier writes ----
  # The assess phase gathers context, then each tier runs independently
  # in the same wave via Promise.allSettled().

  - name: digest-assess
    reasoningLevel: default
    dependsOn: [consolidate-write]
    prompt: |
      Gather material for AT MOST ONE digest tier update per run. The
      rotation decision is made by the `vault_read_digest` tool, not
      by you — the tool returns which tier needs attention (or tells
      you to skip). Over 3 runs every tier gets one deep pass.

      Total budget: {{max_turns}} turns.

      ## Step 1: Get the rotation decision (1 turn)

      Call `vault_read_digest` with:
        pick: "rotate_oldest"
        min_staleness_seconds: 1800

      The tool returns one of two shapes:

      **Skip shape** — `{mode:"rotate_oldest", skip:true, reason, all_tiers}`.
      Every tier was generated within the last 30 minutes. Call
      `vault_report` with action "skip" passing the reason through.
      STOP — do not run steps 2-3.

      **Rotate shape** — `{mode:"rotate_oldest", selected_tier,
      selected_generated_at, selected_content, rotation_reason, all_tiers}`.
      Proceed to step 2, scoped to `selected_tier`.

      ## Step 2: Gather material for `selected_tier` (budget: half
      of remaining)

      Scope the search to what belongs at the selected tier:
      - **1500 (executive briefing):** only critical decisions,
        reversals, state-of-system changes.
      - **5000 (deep onboarding):** trade-offs, patterns, active
        decisions, unresolved gotchas.
      - **10000 (full archive):** any new content worth preserving.

      Use `vault_search_semantic` for themes from new/superseded spores,
      `vault_spores` for specific content, `vault_sessions` for recent
      session context. Make each call count — do not repeatedly search
      for variations of the same theme. Accept "good enough" findings
      and move on.

      ## Step 3: Produce findings

      Your final response is the per-tier phases' primary context
      (they cannot call vault_spores or vault_sessions). Structure it:

      **Chosen tier for this run: <selected_tier>**
      Include the rotation_reason verbatim from the tool so readers
      can audit the decision.

      **New material to integrate (scoped to the chosen tier):**
      - List each insight with enough detail that the tier writer can
        incorporate it without re-searching
      - Include specific spore content, not just spore counts

      **Themes and connections** relevant to the chosen tier.

      **Per-tier directives** — mark exactly the `selected_tier` as
      UPDATE, the other two as SKIP, and include the tool's
      rotation_reason in the UPDATE line:
      - 10000: UPDATE or SKIP + one-line reason
      - 5000: UPDATE or SKIP + one-line reason
      - 1500: UPDATE or SKIP + one-line reason

      Tools available: {{phase_tools}}.
    tools:
      - vault_spores
      - vault_sessions
      - vault_search_semantic
      - vault_release_state
      - vault_read_digest
      - vault_report
    maxTurns: 12
    required: true

  - name: digest-10000
    reasoningLevel: low
    dependsOn: [digest-assess]
    prompt: |
      Update digest tier 10000 — Full institutional knowledge.
      Budget: 7 turns (1 read + 1-2 search + 1 write + buffer).

      If the digest-assess phase said this tier should SKIP or reported
      "no new intelligence material this run", call `vault_report` with
      action "skip" for tier 10000 and finish immediately.

      This is the largest tier (~10,000 tokens). Update if any new content
      was found. The digest-assess phase summary in your context contains
      the material to integrate and per-tier guidance.

      1. Call `vault_read_digest` with tier 10000 to get current content
      2. Call `vault_search_semantic` for themes identified in the assess
         findings — gather specific details to weave in
      3. Integrate new material into the existing digest
      4. Call `vault_write_digest` with the updated content

      The existing digest is your baseline — integrate new material, don't
      rewrite from scratch. Preserve well-crafted existing content.

      Prioritize: recent insights > active decisions > unresolved gotchas >
      architectural patterns > historical context.

      If this tier genuinely has no new material to integrate, call
      `vault_report` with action "skip" for this tier.
    tools:
      - vault_search_semantic
      - vault_release_state
      - vault_read_digest
      - vault_write_digest
      - vault_report
    maxTurns: 9
    required: false

  - name: digest-5000
    reasoningLevel: low
    dependsOn: [digest-assess]
    prompt: |
      Update digest tier 5000 — Deep onboarding.
      Budget: 5 turns (1 read + 1 search + 1 write + buffer).

      If the digest-assess phase said this tier should SKIP or reported
      "no new intelligence material this run", call `vault_report` with
      action "skip" for tier 5000 and finish immediately.

      This tier (~5,000 tokens) focuses on trade-offs and patterns. The
      digest-assess phase summary in your context contains the material
      to integrate and per-tier guidance.

      1. Call `vault_read_digest` with tier 5000 to get current content
      2. Optionally call `vault_search_semantic` for additional context
      3. Integrate new material from the assess findings
      4. Call `vault_write_digest` with the updated content

      The existing digest is your baseline — integrate new material, don't
      rewrite from scratch. Preserve well-crafted existing content.

      Prioritize: recent insights > active decisions > unresolved gotchas >
      architectural patterns > historical context.

      If this tier genuinely has no new material to integrate, call
      `vault_report` with action "skip" for this tier.
    tools:
      - vault_search_semantic
      - vault_release_state
      - vault_read_digest
      - vault_write_digest
      - vault_report
    maxTurns: 7
    required: false

  - name: digest-1500
    reasoningLevel: low
    dependsOn: [digest-assess]
    prompt: |
      Update digest tier 1500 — Executive briefing.
      Budget: 3 turns (1 read + 1 write + buffer).

      If the digest-assess phase said this tier should SKIP or reported
      "no new intelligence material this run", call `vault_report` with
      action "skip" for tier 1500 and finish immediately.

      This is the most compressed tier (~1,500 tokens). Only update if
      important new decisions, gotchas, or critical changes were found.
      The digest-assess phase summary in your context contains the material
      to integrate and per-tier guidance.

      1. Call `vault_read_digest` with tier 1500 to get current content
      2. Integrate new material from the assess findings — be very selective,
         only critical changes belong at this tier
      3. Call `vault_write_digest` with the updated content

      The existing digest is your baseline — integrate new material, don't
      rewrite from scratch. Preserve well-crafted existing content.

      Prioritize: recent insights > active decisions > unresolved gotchas >
      architectural patterns > historical context.

      If this tier genuinely has no new material to integrate, call
      `vault_report` with action "skip" for this tier.
    tools:
      - vault_read_digest
      - vault_write_digest
      - vault_report
    maxTurns: 5
    required: false

  - name: report
    reasoningLevel: low
    dependsOn: [extract, summarize, consolidate-shortlist, consolidate-write, digest-assess, digest-10000, digest-5000, digest-1500]
    prompt: |
      Summarize what was done across all phases.

      Call `vault_report` with action "complete" and these details:
      - Batches processed: N
      - Spores created: N (by type)
      - Sessions updated: N
      - Wisdom created: N
      - Digest tiers written: N

      This report MUST be the last tool call of the run.
    tools:
      - vault_report
    maxTurns: 3
    required: true
