# =============================================================================
# Built-in Task: OKF Synthesize
# =============================================================================
# Publishes the project intelligence Myco has ALREADY computed — the digest,
# the Canopy map and per-file summaries, spores (decisions/gotchas/wisdom),
# skills, and session/plan history — into the portable OKF wiki at okf/,
# through three phases:
#
#   explore  → read-only survey that CONSUMES Myco's intelligence: the digest
#              for orientation, the Canopy map (via okf_read_sources) for the
#              code's structure, spores/skills/sessions for decisions and
#              procedures, Canopy search for module-level truth, with
#              fs_read/code_grep for targeted spot-verification only; emits a
#              synthesis brief naming the pages the wiki should hold.
#   plan     → turns that brief into a capped, auditable page-plan and persists
#              it via okf_write_plan (.myco/okf/state/plan.json).
#   synthesize (map) → one page per planned entry. The map SOURCE reads the
#              persisted plan back (okf_list_planned_pages); the map SINK stages
#              each page (okf_write_page) into ONE staged generation. The item
#              surface carries the same intelligence + spot-verification tools,
#              okf_list_planned_pages (sibling awareness, for cross-links) and
#              okf_read_page (read-current-before-refine).
#
# THE PLAN→MAP HANDOFF: a map-phase source is called by harness code with only
# {params} — it cannot receive the plan phase's in-memory output. The plan
# reaches synthesize ONLY because okf_write_plan persisted it and
# okf_list_planned_pages reads it back (the canopy-describe persisted-state
# pattern). The whole run's staged pages publish atomically ONCE, in the
# executor's finalizeOkfSynthesize success hook, under a single lock.
#
# REFINE-NOT-CLOBBER (Task 3.2): okf_write_page never touches a page that's
# currently published but not in Myco's ownership manifest (human-authored) —
# the write is rejected. A page Myco owns but a human has since hand-edited is
# augmented, not overwritten — the tool keeps the human's current content
# either because the model's refine already carries it forward, or (fallback)
# by appending it verbatim. See okf/ownership.ts's isHandEdited.
#
# COST SHAPE: this task consumes pre-computed intelligence instead of
# re-exploring the repo, so its budgets are deliberately tight (default
# reasoning, explore 10 turns, 6 turns/page). The hard cost ceiling is
# structural: run/phase/per-item turn caps × the MAX_PLANNED_PAGES page cap.
# Widening any of these is a cost decision, not a tuning knob.
#
# Schedule is opt-in (enabled: false); flip per project via myco.yaml under
# `agent.tasks['okf-synthesize'].schedule.enabled`. The okf capability gates it.
# =============================================================================

name: okf-synthesize
displayName: OKF Synthesize
description: >-
  Publish the project intelligence Myco has already computed (digest, Canopy,
  spores, skills) as the project's Open Knowledge Format wiki: survey that
  intelligence, plan a capped page set, then write one page per plan entry and
  publish the bundle atomically.
agent: myco-agent
isDefault: false
reasoningLevel: default
maxTurns: 30
# 1h wall clock for the whole run — a backstop, not a cost driver (cost is
# capped by turns × pages). The synthesize map phase runs its pages
# SEQUENTIALLY at up to perItemTimeoutSeconds each, so the run budget has to
# cover explore + plan + N page items without the run-level abort cutting the
# map phase short mid-plan.
timeoutSeconds: 3600
schedule:
  enabled: false
  # 6h. The okf-synthesize-due precondition is the real gate on whether a run
  # does any work, so the interval only bounds how often that gate is checked.
  intervalSeconds: 21600
  runIn:
    - idle
    - sleep
  preCondition: okf-synthesize-due
prompt: >-
  You publish the project intelligence Myco has ALREADY computed as an OKF
  v0.1-compliant knowledge wiki OF THIS codebase, in the `okf/` bundle. Myco
  has already done the expensive understanding: the digest is the project
  orientation, the Canopy map and per-file summaries are the code's structure,
  spores hold the decisions/gotchas/trade-offs behind it, skill records hold
  the repeatable procedures, sessions/plans hold recent work. Your job is to
  SYNTHESIZE and TRANSLATE that intelligence into a portable wiki — not to
  re-investigate the codebase from scratch. Use `fs_read`/`code_grep` only to
  spot-verify concrete claims (a file exists, a module does what a summary
  says), never to survey. Ground your output format in the spec: call
  `okf_read_spec` once and follow it exactly — if that fetch fails, the
  essential OKF rules are restated in your phase prompts. Plan a focused,
  code-grounded page set; synthesize or refine each page to be genuinely
  useful. Publication is automatic once the run succeeds — never try to
  publish by hand.
phases:
  - name: explore
    dependsOn: []
    maxTurns: 10
    required: true
    readOnly: true
    purpose: >-
      Read-only survey of Myco's pre-computed project intelligence and the
      already-published pages to decide what the wiki should cover this run.
    tools:
      - okf_read_sources
      - okf_read_spec
      - okf_list_pages
      - okf_read_page
      - vault_read_digest
      - vault_spores
      - vault_sessions
      - vault_search_canopy
      - vault_search_semantic
      - vault_search_fts
      - fs_read
      - code_grep
    prompt: |
      Survey THIS project so you can plan a wiki that helps a new engineer or
      agent understand it fast: its architecture, how the code is organized,
      what the major subsystems do and how they fit together, the execution
      flow, and the domain concepts and decisions behind them. This is a
      CODE-GROUNDED wiki OF THE PROJECT — not a glossary of ideas and not a
      restatement of docs that already exist.

      CONSUME MYCO'S INTELLIGENCE — DO NOT RE-EXPLORE THE REPO. Myco has
      already computed the project understanding; gather the smallest set of
      it that lets you plan the wiki. Avoid exhaustive searching.

      1. ORIENT WITH THE DIGEST. Call `vault_read_digest` (tier 5000) for the
         computed project orientation: what this project is, its major
         workstreams, and its architecture as Myco already understands it.
      2. GET THE CODE'S STRUCTURE FROM THE CANOPY MAP. Call `okf_read_sources`
         — its orientation leads with the Canopy map (the code-intelligence
         structural guide) plus a top-level repo-tree summary, git change
         context, and a capped sample of citable vault refs. The map tells you
         the major modules/packages, where things live, and what is worth a
         page. For module-level truth, `vault_search_canopy` returns per-file
         summaries — use it to flesh out each subsystem you plan to cover.
      3. PULL THE WHY FROM THE VAULT. `vault_spores` and
         `vault_search_semantic`/`vault_search_fts` surface the decisions,
         gotchas, trade-offs, and wisdom behind the code; the orientation's
         `vault.skills` lists the repeatable procedures (guide material —
         `fs_read` a skill's path when you need the full procedure);
         `vault_sessions` shows recent work (what is actively changing and
         worth documenting well). Weave these INTO code-grounded pages; do NOT
         build the wiki out of them and do NOT write a page per spore.
      4. SPOT-VERIFY, DON'T SURVEY. Use `fs_read`/`code_grep` only to confirm
         a concrete claim you are about to build a page on — never to walk the
         tree or read the codebase file by file.

      GROUND YOUR FORMAT IN THE OKF SPEC. Call `okf_read_spec` once so the
      pages you plan fit the format (frontmatter, folder indexes, cross-links,
      log, citations). If that fetch fails, follow the essential OKF rules
      restated in the synthesize step — do not block on it.

      Read the currently-published pages (`okf_list_pages` / `okf_read_page`)
      and note what the repo already documents (README, docs/, AGENTS.md). Do
      NOT duplicate existing docs — give the synthesized, code-grounded
      structural view they lack, and complement them.

      Emit a compact synthesis brief as your phase summary:

      ## Pages the wiki should hold
      - <bundle-relative slug-safe path> (<type>) — <one sentence: what this
        page covers and why it belongs>

      Plan a small, durable, PROJECT-DERIVED set of pages from a palette like:
      `overview` (what the project is and how it is built), `architecture/*`
      (modules, runtime shape, execution flow), `subsystems/*` or `<area>/*`
      (one per major subsystem/area of the codebase), `concepts/*` (domain
      concepts the code embodies), `decisions/*` (notable architectural
      decisions and their rationale), `guides/*` (operational how-tos),
      `reference/*` (glossary, key config). Let the ACTUAL project shape the
      taxonomy. Prefer depth on the load-bearing parts of the system over
      breadth; never one page per file, never a bare concept glossary. Never
      plan a page named `index` or `log` (any folder) — those files are
      generated. Note which already-published pages should be refreshed versus
      left as-is. If nothing meaningful has changed since the last synthesis,
      say so plainly and list no pages.

  - name: plan
    dependsOn: [explore]
    maxTurns: 6
    required: true
    purpose: >-
      Turn the explore brief into a capped, auditable page-plan and persist it
      via okf_write_plan so the map-synthesize phase can read it back.
    tools:
      - okf_read_sources
      - okf_list_pages
      - okf_read_page
      - okf_write_plan
    prompt: |
      Turn the explore brief into the run's page-plan and persist it.

      Call `okf_write_plan` exactly once with the full set of pages to write
      this run. For each page provide:
        - path: bundle-relative, slug-safe (no leading slash, no traversal) —
          group under the section that fits, e.g. `architecture/…`,
          `subsystems/…`, `concepts/…`, `decisions/…`, `guides/…`,
          `reference/…`. Never a reserved basename: no `index` or `log` page
          anywhere — those files are generated, and such a plan is rejected.
        - type: a descriptive, project-appropriate OKF document type from the
          palette (e.g. overview, architecture, subsystem, concept, decision,
          guide, reference) — capitalized types like `Architecture` are fine
        - title
        - rationale: why this page belongs (auditable) — for code-grounded
          pages, name the modules/subsystems it covers
        - sourceRefs: the stable ids this page draws on — Canopy
          code-intelligence ids for architecture/subsystem pages, spore ids
          for decision pages, skill ids for guide pages
        - openQuestions: gaps to flag for this page; omit when there are none

      The plan is the ONLY channel to the synthesis phase — a page not in the
      plan is never written. Keep the plan focused and within the page cap; a
      runaway plan is rejected and nothing is written. If okf_write_plan
      returns validation errors, fix them and call it again. If the explore
      brief found nothing worth writing, write an empty plan (an empty pages
      array) so the synthesis phase becomes a no-op and the previously
      published bundle is left untouched.

  - name: synthesize
    dependsOn: [plan]
    mode: map
    reasoningLevel: default
    # skip (not abort): one page that fails to synthesize should not sink the
    # rest of the plan; item failures aren't necessarily systemic.
    onItemError: skip
    # 8: the page author consumes the plan's sourceRefs (Canopy summaries,
    # spores, skills) plus a couple of spot-verification reads before the
    # single okf_write_page — a fresh-bundle page needs headroom for the
    # orientation read and sibling check on top of that.
    perItemMaxTurns: 8
    perItemTimeoutSeconds: 180
    required: true
    # maxTurns/tools/prompt are required by PhaseDefinitionSchema but unused
    # under mode: map (per-item budgets and source/item/sink replace them).
    maxTurns: 1
    tools: []
    prompt: ""
    purpose: >-
      Synthesize one OKF page per planned entry and stage it into the run's
      single staged generation.

    source:
      tool: okf_list_planned_pages
      itemsPath: pages

    item:
      readTools:
        - okf_read_sources
        - okf_read_spec
        - okf_read_page
        - okf_list_pages
        - okf_list_planned_pages
        - vault_spores
        - vault_search_canopy
        - vault_search_semantic
        - vault_search_fts
        - fs_read
        - code_grep
      prompt: |
        Synthesize this one OKF wiki page and stage it by calling
        `okf_write_page`. The harness pins path, type, and title from the plan —
        you supply `description` (a one-line summary) and `body` (the full page
        markdown, no frontmatter). You MUST emit the tool call; a text-only
        response is discarded.

        GROUND THE FORMAT IN THE OKF SPEC. Call `okf_read_spec` for the
        authoritative OKF v0.1 rules. If that fetch fails, follow these
        ESSENTIAL OKF v0.1 rules instead: (1) frontmatter is a four-key floor —
        `type`, `title`, `description`, `timestamp` in that canonical order
        (the harness writes the frontmatter from the plan + your `description`,
        so just supply a clean one-line description and a body with NO
        frontmatter); (2) every per-folder `index.md` is headerless and groups
        entries by type (generated for you — do not author index pages); (3)
        cross-links are ABSOLUTE bundle-relative (leading slash); (4) the bundle
        carries a `log.md` (generated for you); (5) end the body with a
        `# Citations` section. Write valid, readable OKF markdown for the body.

        CONSUME THE INTELLIGENCE THIS PAGE IS PLANNED FROM. The plan's source
        refs point at what Myco already knows: read the Canopy per-file
        summaries for the modules this page covers (`vault_search_canopy`),
        the spores behind its decisions (`vault_spores`,
        `vault_search_semantic`/`vault_search_fts`), and for a guide page the
        skill bodies listed in the vault orientation's skills slice (`fs_read`
        their paths). If you need the code's structural map, call
        `okf_read_sources` with kind "map" — the cheap Canopy-map slice; the
        full orientation is for the explore phase, not per-page work. Then
        SPOT-VERIFY the concrete
        claims you make — `fs_read` the key module or `code_grep` the pattern
        you are about to name — but do NOT re-explore the codebase; a couple
        of verification reads is the ceiling. Name the concrete files and
        describe the real structure and flow the intelligence shows — do NOT
        invent files or structure the sources don't show, and do NOT just
        restate what existing docs already say.

        If a page already exists at this path, call `okf_read_page` FIRST and
        write a REFINED body that carries its current content forward — never
        one that silently drops what's there. (`okf_write_page` preserves a
        hand-edited page's current content even if your refine misses it, but
        write the refinement properly rather than relying on that fallback.) If
        this path isn't one Myco published, the write may be rejected — that's
        expected, not an error to retry.

        Cross-link this page to its siblings so a reader can move between
        related concepts. Call `okf_list_planned_pages` to see EVERY page this
        run will produce — that is the full sibling set to link against.
        (`okf_list_pages` shows only ALREADY-published pages, which is empty on
        a first run, so don't rely on it for the sibling list.) Weave in a
        handful — aim for two to four — inline links to the pages most related
        to this one, wherever the prose naturally references another concept.
        Use ABSOLUTE bundle-relative link targets — a leading slash rooted at
        the bundle, e.g. `[Lineage edges](/concepts/lineage-edges.md)` — and
        link ONLY to paths that appear in `okf_list_planned_pages` (or
        `okf_list_pages`); do not invent links to concepts that aren't planned.
        Link targets are normalized deterministically after this phase
        (relative links are rewritten to absolute, and any link whose page
        didn't end up in the bundle is dropped to plain text), so link freely
        among the planned pages without stalling to confirm each one.

        Ground the page in the ACTUAL code. For an architecture or subsystem
        page, describe the real structure — the concrete modules/files it
        covers, what each does, how they connect, and the execution flow — as
        the Canopy summaries and your spot-verification reads show it, not
        generic hand-waving. Enrich with the vault's *why* and *pitfalls*
        (decisions, gotchas, trade-offs) where they explain the code. Write
        clear, accurate prose grounded in what you read; do not invent facts,
        files, or structure the sources don't show.

        End the body with a `# Citations` section listing the sources this page
        draws on — the concrete files you read or verified (`fs_read`/
        `vault_search_canopy` paths) and the vault ids (spores, decisions,
        skills) that ground it — so a reader can trace the synthesis. Cite only
        sources you actually used.

        Page: {{ item.title }}
        Path: {{ item.path }}
        Type: {{ item.type }}
        Rationale: {{ item.rationale }}
        Source refs: {{ item.sourceRefs }}
        Open questions: {{ item.openQuestions }}

    sink:
      tool: okf_write_page
      argMap:
        path: "{{ item.path }}"
        type: "{{ item.type }}"
        title: "{{ item.title }}"
