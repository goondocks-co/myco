# =============================================================================
# Built-in Task: OKF Synthesize
# =============================================================================
# Synthesizes the project's Open Knowledge Format wiki from source material
# (repo tree, git diff context, and vault knowledge) through three phases:
#
#   explore  → read-only survey that EXPLORES the repo like a coding agent:
#              okf_read_sources gives a bounded orientation (Canopy map +
#              top-level tree + capped vault refs), then fs_tree/fs_list/fs_read
#              + code_grep + vault_search_canopy/semantic/fts read the real code
#              and the decisions behind it; emits a synthesis brief naming the
#              pages the wiki should hold.
#   plan     → turns that brief into a capped, auditable page-plan and persists
#              it via okf_write_plan (.myco/okf/state/plan.json).
#   synthesize (map) → one page per planned entry. The map SOURCE reads the
#              persisted plan back (okf_list_planned_pages); the map SINK stages
#              each page (okf_write_page) into ONE staged generation. The item
#              surface also carries the same code/vault exploration tools (so a
#              page author reads the REAL modules it covers), okf_list_pages
#              (sibling awareness, for cross-links) and okf_read_page
#              (read-current-before-refine).
#
# THE PLAN→MAP HANDOFF: a map-phase source is called by harness code with only
# {params} — it cannot receive the plan phase's in-memory output. The plan
# reaches synthesize ONLY because okf_write_plan persisted it and
# okf_list_planned_pages reads it back (the canopy-describe persisted-state
# pattern). The whole run's staged pages publish atomically ONCE, in the
# executor's finalizeOkfSynthesize success hook, under a single lock.
#
# REFINE-NOT-CLOBBER (Task 3.2): okf_write_page never touches a page that's
# currently published but not in Myco's ownership manifest (human-authored) —
# the write is rejected. A page Myco owns but a human has since hand-edited is
# augmented, not overwritten — the tool keeps the human's current content
# either because the model's refine already carries it forward, or (fallback)
# by appending it verbatim. See okf/ownership.ts's isHandEdited.
#
# Schedule is opt-in (enabled: false); flip per project via myco.yaml under
# `agent.tasks['okf-synthesize'].schedule.enabled`. The okf capability gates it.
# =============================================================================

name: okf-synthesize
displayName: OKF Synthesize
description: >-
  Synthesize the project's Open Knowledge Format wiki from repo, git, and vault
  source material: survey sources, plan a capped page set, then write one page
  per plan entry and publish the bundle atomically.
agent: myco-agent
isDefault: false
reasoningLevel: default
maxTurns: 30
# 1h wall clock for the whole run. The synthesize map phase runs its pages
# SEQUENTIALLY at up to perItemTimeoutSeconds each (now 240s, since each page
# author does real code/vault exploration), so the run budget has to cover
# explore + plan + N page items without the run-level abort cutting the map
# phase short mid-plan.
timeoutSeconds: 3600
schedule:
  enabled: false
  # 6h. Synthesis is expensive (cloud reasoning over the whole source corpus);
  # the okf-synthesize-due precondition is the real gate on whether a run does
  # any work, so the interval only bounds how often that gate is checked.
  intervalSeconds: 21600
  runIn:
    - idle
    - sleep
  preCondition: okf-synthesize-due
prompt: >-
  Synthesize this project's OKF knowledge wiki. Survey the source material and
  the already-published pages, plan a focused set of pages, then write each one.
  Publication is automatic once the run succeeds — never try to publish by hand.
phases:
  - name: explore
    dependsOn: []
    reasoningLevel: high
    maxTurns: 20
    required: true
    readOnly: true
    purpose: >-
      Read-only survey of OKF source material and already-published pages to
      decide what the wiki should cover this run.
    tools:
      - okf_read_sources
      - okf_list_pages
      - okf_read_page
      - fs_tree
      - fs_list
      - fs_read
      - code_grep
      - vault_search_canopy
      - vault_search_semantic
      - vault_search_fts
    prompt: |
      Survey THIS project so you can plan a wiki that helps a new engineer or
      agent understand it fast: its architecture, how the code is organized,
      what the major subsystems do and how they fit together, the execution
      flow, and the domain concepts and decisions behind them. This is a
      CODE-GROUNDED wiki OF THE PROJECT — not a glossary of ideas and not a
      restatement of docs that already exist.

      EXPLORE THIS REPO LIKE A CODING AGENT. `okf_read_sources` gives you a
      bounded ORIENTATION (the Canopy map, a top-level repo-tree summary, git
      diff context, and a capped sample of citable vault refs) — it is your
      starting point, not the whole codebase. Do NOT expect the code inline:
      read the orientation, then go read the real code and vault yourself.

      1. START AT THE CANOPY MAP. Call `okf_read_sources` for the structural
         guide and the top-level repo shape. This tells you the major
         modules/packages and where things live — your map of the codebase.
      2. DRILL INTO THE REAL CODE (primary). From the map, walk the actual
         structure with `fs_tree`/`fs_list`, find code by behavior with
         `vault_search_canopy` (file-level summaries) and by pattern with
         `code_grep`, and read the real source of the load-bearing modules with
         `fs_read`. Work out the main entry points, the major subsystems/areas,
         how they connect, and the runtime/execution flow — from the code, not
         from guesswork. This is the backbone of the wiki; most pages should be
         grounded in real modules/files and name them.
      3. Git change context (from `okf_read_sources`) — what is actively
         changing points at the load-bearing parts worth documenting well.
      4. VAULT KNOWLEDGE as ENRICHMENT, not the base. Use `vault_search_semantic`
         and `vault_search_fts` (and the orientation's spore/decision refs) to
         find the *why* and the *pitfalls* behind the code — rationale, gotchas,
         trade-offs. Weave them INTO the code-grounded pages; do NOT build the
         wiki out of them and do NOT write a page per spore.

      Read the currently-published pages (`okf_list_pages` / `okf_read_page`)
      and note what the repo already documents (README, docs/, AGENTS.md — read
      them with `fs_read`). Do NOT duplicate existing docs — give the
      synthesized, code-grounded structural view they lack, and complement them.

      Emit a compact synthesis brief as your phase summary:

      ## Pages the wiki should hold
      - <bundle-relative slug-safe path> (<type>) — <one sentence: what this
        page covers and why it belongs>

      Plan a small, durable, PROJECT-DERIVED set of pages from a palette like:
      `overview` (what the project is and how it is built), `architecture/*`
      (modules, runtime shape, execution flow), `subsystems/*` or `<area>/*`
      (one per major subsystem/area of the codebase), `concepts/*` (domain
      concepts the code embodies), `decisions/*` (notable architectural
      decisions and their rationale), `guides/*` (operational how-tos),
      `reference/*` (glossary, key config). Let the ACTUAL project shape the
      taxonomy. Prefer depth on the load-bearing parts of the system over
      breadth; never one page per file, never a bare concept glossary. Note
      which already-published pages should be refreshed versus left as-is. If
      nothing meaningful has changed since the last synthesis, say so plainly
      and list no pages.

  - name: plan
    dependsOn: [explore]
    reasoningLevel: high
    maxTurns: 10
    required: true
    purpose: >-
      Turn the explore brief into a capped, auditable page-plan and persist it
      via okf_write_plan so the map-synthesize phase can read it back.
    tools:
      - okf_read_sources
      - okf_list_pages
      - okf_read_page
      - okf_write_plan
    prompt: |
      Turn the explore brief into the run's page-plan and persist it.

      Call `okf_write_plan` exactly once with the full set of pages to write
      this run. For each page provide:
        - path: bundle-relative, slug-safe (no leading slash, no traversal) —
          group under the section that fits, e.g. `architecture/…`,
          `subsystems/…`, `concepts/…`, `decisions/…`, `guides/…`, `reference/…`
        - type: a descriptive, project-appropriate OKF document type from the
          palette (e.g. overview, architecture, subsystem, concept, decision,
          guide, reference) — capitalized types like `Architecture` are fine
        - title
        - rationale: why this page belongs (auditable) — for code-grounded
          pages, name the modules/subsystems it covers
        - sourceRefs: the stable ids from okf_read_sources this page draws on
          (favor the Canopy code-intelligence ids for architecture/subsystem
          pages, not just spores)
        - openQuestions: gaps to flag for this page; omit when there are none

      The plan is the ONLY channel to the synthesis phase — a page not in the
      plan is never written. Keep the plan focused and within the page cap; a
      runaway plan is rejected and nothing is written. If okf_write_plan returns
      validation errors, fix them and call it again. If the explore brief found
      nothing worth writing, write an empty plan (an empty pages array) so the
      synthesis phase becomes a no-op and the previously published bundle is
      left untouched.

  - name: synthesize
    dependsOn: [plan]
    mode: map
    reasoningLevel: default
    # skip (not abort): one page that fails to synthesize should not sink the
    # rest of the plan; item failures aren't necessarily systemic.
    onItemError: skip
    # 12: the page author no longer reads a source dump — it EXPLORES the code
    # and vault for the page it's writing (fs_read/code_grep/vault_search_* plus
    # the okf read tools), which is several tool calls before the single
    # okf_write_page. 5 turns starved that mid-exploration.
    perItemMaxTurns: 12
    # 240s/item: real per-page exploration (reading the actual modules a page
    # covers, searching Canopy/vault) then writing the body takes materially
    # longer than reading a pre-reduced projection did.
    perItemTimeoutSeconds: 240
    required: true
    # maxTurns/tools/prompt are required by PhaseDefinitionSchema but unused
    # under mode: map (per-item budgets and source/item/sink replace them).
    maxTurns: 1
    tools: []
    prompt: ""
    purpose: >-
      Synthesize one OKF page per planned entry and stage it into the run's
      single staged generation.

    source:
      tool: okf_list_planned_pages
      itemsPath: pages

    item:
      readTools:
        - okf_read_sources
        - okf_read_page
        - okf_list_pages
        - okf_list_planned_pages
        - fs_tree
        - fs_list
        - fs_read
        - code_grep
        - vault_search_canopy
        - vault_search_semantic
        - vault_search_fts
      prompt: |
        Synthesize this one OKF wiki page and stage it by calling
        `okf_write_page`. The harness pins path, type, and title from the plan —
        you supply `description` (a one-line summary) and `body` (the full page
        markdown, no frontmatter). You MUST emit the tool call; a text-only
        response is discarded.

        READ THE REAL CODE THIS PAGE COVERS BEFORE YOU WRITE IT. `okf_read_sources`
        gives you the bounded orientation + citable ids, not the code inline.
        To write THIS page, go read what it's about: use `vault_search_canopy`
        and `code_grep` to find the modules/files in scope, `fs_read` to read
        their actual source, and `fs_tree`/`fs_list` to see how they're
        organized. Then enrich with the *why* and *pitfalls* using
        `vault_search_semantic`/`vault_search_fts` (decisions, gotchas,
        trade-offs behind that code). Name the concrete files and describe the
        real structure and flow you observed — do NOT invent files or structure
        you didn't read, and do NOT just restate what existing docs already say.

        If a page already exists at this path, call `okf_read_page` FIRST and
        write a REFINED body that carries its current content forward — never
        one that silently drops what's there. (`okf_write_page` preserves a
        hand-edited page's current content even if your refine misses it, but
        write the refinement properly rather than relying on that fallback.) If
        this path isn't one Myco published, the write may be rejected — that's
        expected, not an error to retry.

        Cross-link this page to its siblings so a reader can move between
        related concepts. Call `okf_list_planned_pages` to see EVERY page this
        run will produce — that is the full sibling set to link against.
        (`okf_list_pages` shows only ALREADY-published pages, which is empty on
        a first run, so don't rely on it for the sibling list.) Weave in a
        handful — aim for two to four — inline links to the pages most related
        to this one, wherever the prose naturally references another concept.
        Use ABSOLUTE bundle-relative link targets — a leading slash rooted at
        the bundle, e.g. `[Lineage edges](/concepts/lineage-edges.md)` — and
        link ONLY to paths that appear in `okf_list_planned_pages` (or
        `okf_list_pages`); do not invent links to concepts that aren't planned.
        Link targets are normalized deterministically after this phase
        (relative links are rewritten to absolute, and any link whose page
        didn't end up in the bundle is dropped to plain text), so link freely
        among the planned pages without stalling to confirm each one.

        Ground the page in the ACTUAL code. For an architecture or subsystem
        page, describe the real structure — the concrete modules/files it
        covers (the ones you read with fs_read / found via vault_search_canopy),
        what each does, how they connect, and the execution flow — not generic
        hand-waving. Enrich with the vault's *why* and *pitfalls* (decisions,
        gotchas, trade-offs) where they explain the code. Write clear, accurate
        prose grounded in what you read; do not invent facts, files, or
        structure the sources don't show.

        End the body with a `# Citations` section listing the sources this page
        draws on — the concrete files you read (`fs_read`/`vault_search_canopy`
        paths) and the vault ids (spores, decisions) that ground it — so a
        reader can trace the synthesis. Cite only sources you actually used.

        Page: {{ item.title }}
        Path: {{ item.path }}
        Type: {{ item.type }}
        Rationale: {{ item.rationale }}
        Source refs: {{ item.sourceRefs }}
        Open questions: {{ item.openQuestions }}

    sink:
      tool: okf_write_page
      argMap:
        path: "{{ item.path }}"
        type: "{{ item.type }}"
        title: "{{ item.title }}"
