name: skill-generate
displayName: Skill Generation
description: >-
  Synthesize a project skill from a vault knowledge candidate.
  Stages SKILL.md under .myco/staging/skills/, validates it, then
  promotes it to .agents/skills/ via vault_finalize_skill.
agent: myco-agent
prompt: >-
  Generate ONE project-specific skill from the next approved candidate.
  The instruction contains the candidate metadata and pre-assembled
  source material. Stage the skill, validate it, then finalize it.
isDefault: false
reasoningLevel: default
maxTurns: 32
timeoutSeconds: 900
schedule:
  enabled: false
  intervalSeconds: 600
  runIn:
    - idle
    - sleep
  preCondition: has-approved-candidates
phases:
  - name: draft
    prompt: |
      Write a SKILL.md from the source material in the instruction.
      The instruction contains the candidate ID, topic, rationale,
      candidate quality metadata, and the full text of each renderable
      source spore and session. Do NOT call any search or read tools —
      the material is already here.

      ## SKILL.md Format

      ```markdown
      ---
      name: myco:kebab-case-name
      description: |
        One paragraph serving as the PRIMARY triggering mechanism.
        Cover the full procedural domain — mention all the major
        procedures this skill covers. Be explicit about when this
        activates. Include "even if the user doesn't explicitly
        ask for [topic]" language when appropriate.
      managed_by: myco
      user-invocable: true
      allowed-tools: Read, Edit, Write, Bash, Grep, Glob
      ---

      # Domain Title

      Brief context paragraph (2-3 sentences) explaining the
      procedural domain and when you'd use this skill.

      ## Prerequisites

      What must be true before starting any procedure in this domain.

      ## Procedure A: [Name]

      Steps for the first major procedure in this domain.

      ## Procedure B: [Name]

      Steps for the second major procedure.

      ## Procedure C: [Name]

      Steps for the third major procedure.

      ## Cross-Cutting Gotchas

      Pitfalls that span multiple procedures in this domain.
      ```

      ## Frontmatter Fields

      - **user-invocable: true** — makes the skill available as a slash
        command (e.g., `/add-symbiont`). Set this for all procedural skills.
      - **description formatting** — keep the description YAML-safe.
        Prefer the block-scalar form shown above (`description: |` or
        `description: >-`) instead of a long plain scalar, because colons
        inside an unquoted single-line value can produce invalid YAML.
      - **description length** — keep the fully rendered description at or
        under 1024 characters. Longer descriptions are rejected by Codex and
        other skill loaders even if the rest of the file is valid.
      - **allowed-tools** — comma-separated list of **Claude Code tool
        names** that the skill needs. These skills run in developer
        Claude Code sessions, NOT in the agent pipeline. NEVER use
        vault_* tool names (vault_search_fts, vault_spores, etc.) —
        those are internal agent tools, not available in Claude Code.
        Valid tool names: Read, Edit, Write, Bash, Grep, Glob.
        Most procedural skills need: Read, Edit, Write, Bash, Grep, Glob.
        Narrow this if the skill only needs read access (e.g., audit
        skills: Read, Bash, Grep, Glob).

      ## Writing Principles

      - **This candidate represents a procedural domain** — a family
        of related tasks that share prerequisite knowledge. The skill
        should cover the full domain, not just a single procedure.
      - **Honor the evidence metadata.** Treat `evidence_bundle_id`,
        `quality_score`, `coverage_matches`, and `source_ids` in the
        instruction as the approval record for this candidate. Use the
        source material to ground the skill; do not broaden the skill
        beyond what the approved evidence supports.
      - **Distill, do not transcribe.** Source evidence may contain
        Myco release versions, PR/issue refs, dates, branch names,
        session/spore IDs, or one-time decision state. Those facts live
        in Myco evidence, not live skill prose. Convert them into
        durable procedure, reference Myco when the state matters, or
        move genuine history into `## Old patterns` /
        `## Historical context`.
      - **Enforce the evidence contract before staging.** If
        `evidence_bundle_id` is missing, `quality_failures` is not `[]`,
        or `source_ids` is empty/malformed, report failure via
        vault_report and do not call vault_stage_skill. Approval is a
        human decision, not permission to ignore broken provenance.
      - **Respect overlap metadata.** If `coverage_matches` shows
        overlap with an active skill or prior candidate, preserve the
        distinct boundary or supersession rationale in the generated
        skill. Do not erase that boundary in broad prose.
      - **A well-scoped skill has 3-6 major sections**, each describing
        a distinct procedure within the domain. If the candidate maps
        to fewer than 2 sections, note this in the rationale — it may
        be too narrow.
      - **Explain reasoning, not rigid rules.** "Because X, do Y"
        is better than "ALWAYS do Y." The agent using this skill
        understands WHY.
      - **Stay under 800 lines.** Be concise but complete.
      - **Use concrete file paths** from this project.
      - **Include code patterns** where they help (inline code blocks).
      - **Include examples** — show input/output or before/after where
        it makes the procedure clearer.
      - **Reference gotchas inline** where the developer would
        encounter them, not in a separate section.
      - **The description is the trigger.** An agent reading just the
        description should know whether this skill applies.
      - **Be general enough to survive change.** The skill should teach
        the pattern, not just document the current state.

      ## Tool Call

      Call `vault_stage_skill` — NOT `vault_write_skill`. Pass:

      - candidate_id: the candidate ID from the instruction (required)
      - name: kebab-case directory name (NO colon — directory-safe name).
        The myco: prefix goes ONLY in the SKILL.md frontmatter name field.
      - display_name: human-readable title
      - description: the frontmatter description text
      - content: the full SKILL.md including frontmatter
      - source_ids: the exact JSON array from the instruction's
        `source_ids` quality metadata
      - rationale: "Initial generation from candidate survey"

      **Important:** the skill is NOT live after vault_stage_skill.
      The file is written to .myco/staging/skills/<candidate_id>/SKILL.md
      and a manifest.json is written alongside. The validate phase will
      read the staged content, run quality checks, and promote to the
      live .agents/skills/ directory via vault_finalize_skill. Until
      that happens, nothing user-visible has changed.

      If vault_stage_skill returns an error (validation, dedup), address
      the issue and re-call vault_stage_skill with corrected content.
      The staging file will be overwritten.
    tools:
      - vault_stage_skill
    maxTurns: 10
    required: true

  - name: validate
    prompt: |
      Review the skill you just staged. The staged content is at
      .myco/staging/skills/<candidate_id>/SKILL.md — read it back
      directly from disk via the Read tool, or look it up by
      candidate_id.

      Check against these criteria:

      1. **Triggering clarity:** Would an agent reading only the
         description know when to use this skill? Test: describe
         a task that SHOULD trigger it and one that SHOULD NOT.

      2. **Procedural content:** Does every section describe steps
         to take? Remove any definitional content ("X is...").

      3. **Concreteness:** Does it reference real file paths,
         function names, and code patterns from this project?
         Generic advice ("add a config file") is not enough.

      4. **Length:** Under 800 lines?
      4a. **Frontmatter validity:** Does the YAML frontmatter parse cleanly,
          and is the rendered description still <= 1024 characters?

      5. **Domain scope:** Does this skill cover a procedural domain
         (multiple related procedures as sections) or just a single
         procedure? If single, flag as potentially too narrow. Count
         the ## headings — expect 3-6 for a well-scoped domain skill.

      6. **Conflicts:** Does it overlap with existing skills?
         Use vault_skill_records (action: list) to check. The
         staging path's dedup gate already ran on your description;
         this is a sanity check on the procedural content itself.

      7. **Accuracy (codebase-grounded):** Identify the 3-5 most
         LOAD-BEARING concrete claims — paths, function/class names,
         patterns the procedure depends on — and verify each against
         the actual source:
         - **Path claim** → `fs_read` (narrow window). ENOENT or
           unrelated content = FAIL.
         - **Identifier claim** → `code_grep` with a path+glob filter.
           Zero hits in the expected location = FAIL.
         - **Behavior claim** → `code_grep` for signature patterns
           that would implement it. Zero hits = FAIL.
         Budget 1-2 tool calls per claim.

         If any load-bearing claim FAILS, treat as a criterion failure
         and re-stage with corrected content. Do not finalize a skill
         whose load-bearing paths can't be verified against the
         current codebase — that's how hallucinated paths ship.

      8. **Content hygiene:** Does live procedural prose avoid Myco
         release versions, PR/issue refs, dates, branch names,
         session/spore IDs, and one-time decision state? The staging
         and finalize tools run this gate too; if either rejects, clean
         the matched spans and re-stage. Keep genuine history only in
         `## Old patterns` / `## Historical context`.

      9. **Evidence contract:** source_ids resolve, evidence_bundle_id
         is present, quality_failures is empty, and coverage_matches are
         reflected by a clear skill boundary or supersession rationale.
         If this fails, report failure and do not finalize.

      ## If criteria fail — decline to finalize

      Do NOT call vault_finalize_skill. Instead, report the decline via
      `vault_report` as described below, and re-stage only if you have
      corrected content ready (`vault_stage_skill` again with the
      candidate_id — this overwrites the staging file and the dedup
      gate runs again). A phase that ends without the mandated report
      below has not completed, no matter how much re-staging happened.

      ## If all criteria pass — finalize

      Call `vault_finalize_skill` with the candidate_id. This
      atomically promotes the staged skill to `.agents/skills/<name>/`,
      inserts the skill_records row + lineage, transitions the
      candidate to 'generated', creates the symbiont symlinks, and
      cleans up the staging directory. The preserved approved_at on
      the candidate is carried through unchanged.

      The skill is ONLY considered complete after vault_finalize_skill
      returns success. If this phase fails (criterion failure or turn
      budget exhausted), the task executor cleans up the staging
      directory so the candidate stays in 'approved' state for the
      next generate cycle.

      ## Report — mandatory on BOTH outcomes

      This phase is not done until you call `vault_report` with
      action `skill_generate_validate`. This applies whether you
      finalized or declined — there is no other way to end this phase.
      Pass `details` as exactly:
      {
        "run_id": "{{run_id}}",
        "candidate_id": "<candidate id>",
        "finalized": true|false,
        "decline_reason": "<why>"
      }
      - `run_id` — always `{{run_id}}`, verbatim.
      - `candidate_id` — the candidate ID from the instruction.
      - `finalized` — `true` only if vault_finalize_skill returned
        success in this phase; `false` on any decline (criterion
        failure, unresolved re-stage, or budget exhaustion).
      - `decline_reason` — required whenever `finalized` is `false`;
        state which criterion(s) failed and why. Omit when
        `finalized` is `true`.
      Also include in the same report (or in `summary`/other detail
      fields, not in place of the fields above):
      - Skill name and path
      - Each criterion: pass/fail with brief note
      - Any re-stages performed
    purpose: >-
      Finalizes the staged skill via vault_finalize_skill, which atomically
      inserts the vault_skill_records row plus lineage and transitions the
      source candidate to 'generated' — no separate vault_skill_candidates
      write call is made in this phase.
    tools:
      - vault_stage_skill
      - vault_finalize_skill
      - vault_skill_records
      - vault_skill_candidates
      - vault_spores
      - vault_report
      - fs_read
      - code_grep
    maxTurns: 18
    required: true
    postCondition: skill-generate-validate
    dependsOn:
      - draft
