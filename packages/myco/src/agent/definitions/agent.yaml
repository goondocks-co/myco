# Built-in Myco agent definition.
# Loaded at startup and registered in the agents table as source: 'built-in'.

name: myco-agent
displayName: Myco Agent
description: >
  Default intelligence agent that processes captured session data, extracts
  observations (spores), manages spore lifecycle, and synthesizes digest
  extracts.
model: claude-sonnet-4-20250514
maxTurns: 30
timeoutSeconds: 300
systemPromptPath: ../prompts/agent.md

tools:
  # Read tools
  - vault_unprocessed
  - vault_session_summary_material
  - vault_spores
  - vault_sessions
  - vault_search_fts
  - vault_search_semantic
  - vault_state
  - vault_edges
  - vault_skill_candidates
  - vault_skill_records
  # Write tools
  - vault_create_spore
  - vault_resolve_spore
  - vault_update_session
  - vault_mark_processed
  - vault_read_digest
  - vault_write_digest
  - vault_set_state
  - vault_report
