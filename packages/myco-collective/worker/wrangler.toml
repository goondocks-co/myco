name = "myco-collective"
main = "src/index.ts"
compatibility_date = "2025-03-27"
compatibility_flags = [ "nodejs_compat", "global_fetch_strictly_public" ]

[[d1_databases]]
binding = "MYCO_COLLECTIVE_DB"
database_name = "myco-collective"
database_id = "<YOUR_D1_DATABASE_ID>"

[[kv_namespaces]]
binding = "MYCO_SECRETS"
id = "<YOUR_KV_NAMESPACE_ID>"

[vars]
COLLECTIVE_NAME = "Myco Collective"

[assets]
directory = "./ui"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/health"]
