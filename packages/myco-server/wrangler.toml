name = "myco-server"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = [ "global_fetch_strictly_public" ]

[observability]
enabled = true

[observability.logs]
invocation_logs = false

# Workers Paid CPU allowance, with headroom over a 15 s transcript pass and
# the rest of its tick. The deploy renderer omits this table after the account
# refuses code 100328. Workers Free allows 10 ms of CPU per invocation (requests and scheduled ticks).
[limits]
cpu_ms = 60_000

[[d1_databases]]
binding = "MYCO_DB"
database_name = "myco-server"
database_id = "<YOUR_D1_DATABASE_ID>"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "myco-server-blobs"

[[ratelimits]]
name = "SOURCE_LIMIT"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "TOKEN_LIMIT"
namespace_id = "1002"
simple = { limit = 300, period = 60 }

# The key Deployment-held secrets are sealed under. Declared here so a deploy that
# omits it is visible in configuration rather than at the first attempt to store a
# credential. Optional: a Deployment that never stores one serves
# every other route without it, and the failure belongs at the first seal.
#
# myco server create --target cloudflare ensures the account's store and wrapping secret.
# myco doctor identifies the selected tool for operator inspection.
# Rotating the wrapping key requires re-entering the credentials sealed under it.
# [[secrets_store_secrets]]
# binding = "SECRET_WRAP_KEY"
# store_id = "<STORE-ID>"
# secret_name = "myco-secret-wrap-key"

# The dashboard: static build output served from the edge store before the
# Worker runs. `run_worker_first` names every path the Worker owns — live routes,
# retired prefixes and reserved protocol paths — and is held equal to
# `ownedPathPatterns()` in src/routes.ts by tests/myco-server/gates.test.ts.
# No binding: the Worker never fetches an asset itself.
[assets]
directory = "ui/dist"
not_found_handling = "single-page-application"
run_worker_first = [ "/.well-known/*", "/api/*", "/auth/*", "/blobs/*", "/context/*", "/events", "/events/*", "/health", "/import/*", "/mcp", "/members/*", "/register", "/routed-capture/*", "/runners/*", "/runs/*", "/sessions/*", "/spores/*", "/tokens/*", "/v1/*", "/worker/*" ]

[triggers]
crons = [ "*/15 * * * *" ]

[[durable_objects.bindings]]
name = "CLOCK"
class_name = "DeploymentClock"

# The recovery producer's checkpoint. It holds no alarm: the clock continues it.
[[durable_objects.bindings]]
name = "RECOVERY"
class_name = "RecoveryProducer"

# Where a recovery staging is written. Never the Deployment's own object store:
# a recovery that shares the store it recovers from is no recovery.
[[r2_buckets]]
binding = "RECOVERY_BUCKET"
bucket_name = "myco-server-recovery"

# The retired harness class. Its creating entry stays: the list is an ordered
# ledger applied from the instance's recorded tag, so a delete of a class the
# history never created is refused, and a fresh instance would never start.
[[migrations]]
tag = "v1-harness"
new_sqlite_classes = [ "HarnessContainer" ]

[[migrations]]
tag = "v2-clock"
new_sqlite_classes = [ "DeploymentClock" ]

[[migrations]]
tag = "v3-harness-retired"
deleted_classes = [ "HarnessContainer" ]

[[migrations]]
tag = "v4-recovery"
new_sqlite_classes = [ "RecoveryProducer" ]
