version: 3
config_version: 7
embedding:
  provider: ollama
  model: bge-m3:latest
  run_in_deep_sleep: true
daemon:
  port: 21039
  log_level: info
  log_retention_days: 30
  stale_session_threshold_ms: 3600000
hub:
  url: http://127.0.0.1:21000
capture:
  transcript_paths: []
  plan_dirs:
    - docs/superpowers/specs/
    - docs/superpowers/plans/
    - docs/design/
  ignore_plan_dirs_in_git: true
  artifact_extensions:
    - .md
  buffer_max_events: 500
agent:
  summary_batch_interval: 5
  scheduled_tasks_enabled: true
  event_tasks_enabled: true
  provider:
    type: anthropic
    model: claude-sonnet-4-6
  tasks:
    title-summary-custom:
      provider:
        type: ollama
        base_url: http://localhost:11434
        model: glm-4.7-flash:latest
    review-session:
      provider:
        type: anthropic
        model: claude-sonnet-4-6
    skill-survey:
      provider:
        runtime: claude-sdk
        type: anthropic
      runtime: claude-sdk
      schedule:
        enabled: true
        runIn:
          - idle
    skill-generate:
      provider:
        runtime: claude-sdk
        type: anthropic
      runtime: claude-sdk
      phases:
        validate:
          maxTurns: 30
      schedule:
        enabled: true
        runIn:
          - idle
    skill-evolve:
      provider:
        runtime: claude-sdk
        type: anthropic
      runtime: claude-sdk
      phases:
        assess:
          maxTurns: 30
      schedule:
        enabled: true
        intervalSeconds: 3200
    canopy-describe:
      provider:
        runtime: openai-agents
        type: lmstudio
        base_url: http://localhost:1234
        model: google/gemma-4-26b-a4b
        reasoning_map:
          low: openai/gpt-oss-20b
          default: google/gemma-4-26b-a4b
          high: google/gemma-4-31b
        context_length: 16384
      runtime: openai-agents
      schedule:
        enabled: true
      params:
        batch_size: 10
    canopy-map:
      provider:
        runtime: claude-sdk
        type: anthropic
        model: claude-haiku-4-5-20251001
        reasoning_map:
          low: claude-haiku-4-5-20251001
          default: claude-sonnet-4-6
          high: claude-opus-4-6
      runtime: claude-sdk
      schedule:
        enabled: true
context:
  digest_tier: 5000
  session_start_digest_enabled: false
  cortex_enabled: true
  prompt_search: true
  prompt_max_spores: 3
backup:
  dir: ~/myco_backups/myco
maintenance:
  auto_optimize: true
  auto_optimize_interval_hours: 24
update:
  channel: stable
team:
  enabled: true
  worker_url: https://myco-team-974bc350.goondocks.workers.dev
  interval_minutes: 15
skills:
  confidence_threshold: 0.7
  usage_stale_days: 30
notifications:
  enabled: true
  system_notifications: true
  default_mode: summary
  domains:
    skills:
      enabled: true
      mode: banner
    sessions:
      enabled: false
    mycelium:
      enabled: true
    settings:
      enabled: true
      mode: banner
canopy:
  refresh:
    background_enabled: true
    background_period_minutes: 60
  exclude:
    default_patterns:
      - .git
      - .DS_Store
      - node_modules
      - __pycache__
      - .venv
      - venv
      - env
      - ENV
      - .pytest_cache
      - .ruff_cache
      - .mypy_cache
      - .tox
      - dist
      - build
      - target
      - .gradle
      - .cache
      - .next
      - .nuxt
      - .turbo
      - .svelte-kit
      - "**/*.lock"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
    patterns: []
cortex:
  canopy:
    injection:
      enabled: true
      size_threshold: 800
appearance:
  theme: sage
  mode: dark
  font: default
  density: normal
symbionts:
  claude-code:
    enabled: true
  codex:
    enabled: true
  cursor:
    enabled: true
  gemini:
    enabled: true
  opencode:
    enabled: true
  pi:
    enabled: true
  vscode-copilot:
    enabled: true
  windsurf:
    enabled: true
