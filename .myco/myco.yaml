version: 3
config_version: 6
embedding:
  provider: ollama
  model: bge-m3:latest
daemon:
  port: 21039
  log_level: info
  log_retention_days: 30
  stale_session_threshold_ms: 3600000
capture:
  transcript_paths: []
  plan_dirs:
    - docs/superpowers/specs/
    - docs/superpowers/plans/
    - docs/design/
  ignore_plan_dirs_in_git: true
  artifact_extensions:
    - .md
  buffer_max_events: 500
agent:
  summary_batch_interval: 5
  scheduled_tasks_enabled: true
  event_tasks_enabled: true
  provider:
    type: anthropic
    model: claude-sonnet-4-6
  tasks:
    title-summary-custom:
      provider:
        type: ollama
        base_url: http://localhost:11434
        model: glm-4.7-flash:latest
    review-session:
      provider:
        type: anthropic
        model: claude-sonnet-4-6
    skill-survey:
      provider:
        runtime: claude-sdk
        type: anthropic
      runtime: claude-sdk
      schedule:
        enabled: true
        runIn:
          - idle
    skill-generate:
      provider:
        runtime: claude-sdk
        type: anthropic
      runtime: claude-sdk
      phases:
        validate:
          maxTurns: 30
      schedule:
        enabled: true
        runIn:
          - idle
    skill-evolve:
      provider:
        runtime: claude-sdk
        type: anthropic
      runtime: claude-sdk
      phases:
        assess:
          maxTurns: 30
      schedule:
        enabled: true
        intervalSeconds: 1800
    title-summary:
      provider:
        runtime: openai-agents
        type: lmstudio
        base_url: http://localhost:1234
        model: google/gemma-4-26b-a4b
        reasoning_map:
          low: google/gemma-4-26b-a4b
          default: google/gemma-4-26b-a4b
          high: openai/gpt-oss-120b
      runtime: openai-agents
      maxTurns: 50
      timeoutSeconds: 600
context:
  digest_tier: 5000
  session_start_digest_enabled: false
  cortex_enabled: true
  prompt_search: true
  prompt_max_spores: 3
backup:
  dir: ~/myco_backups/myco
maintenance:
  auto_optimize: true
  auto_optimize_interval_hours: 24
team:
  enabled: true
  worker_url: https://myco-team-974bc350.goondocks.workers.dev
  interval_minutes: 15
skills:
  confidence_threshold: 0.7
  usage_stale_days: 30
notifications:
  enabled: true
  system_notifications: true
  default_mode: summary
  domains:
    skills:
      enabled: true
      mode: banner
    sessions:
      enabled: false
    mycelium:
      enabled: true
    settings:
      enabled: true
      mode: banner
appearance:
  theme: sage
  mode: dark
  font: default
  density: normal
symbionts:
  claude-code:
    enabled: true
  codex:
    enabled: true
  cursor:
    enabled: true
  gemini:
    enabled: true
  opencode:
    enabled: true
  pi:
    enabled: true
  vscode-copilot:
    enabled: true
  windsurf:
    enabled: true
