version: 3
config_version: 9
embedding:
  provider: ollama
  model: bge-m3:latest
capture:
  transcript_paths: []
  plan_dirs:
    - docs/superpowers/specs/
    - docs/superpowers/plans/
    - docs/design/
  ignore_plan_dirs_in_git: true
  artifact_extensions:
    - .md
  buffer_max_events: 500
agent:
  summary_batch_interval: 5
  scheduled_tasks_enabled: true
  event_tasks_enabled: true
  cold_project_threshold_days: 14
  provider:
    type: anthropic
    model: claude-sonnet-4-6
  harness: claude-sdk
  tasks:
    title-summary-custom:
      provider:
        type: ollama
        base_url: http://localhost:11434
        model: glm-4.7-flash:latest
    review-session:
      provider:
        type: anthropic
        model: claude-sonnet-4-6
    skill-survey:
      provider:
        type: anthropic
      harness: claude-sdk
      schedule:
        enabled: true
        runIn:
          - idle
    skill-generate:
      provider:
        type: anthropic
      harness: claude-sdk
      phases:
        validate:
          maxTurns: 30
      schedule:
        enabled: true
        runIn:
          - idle
    skill-evolve:
      provider:
        type: anthropic
      harness: claude-sdk
      phases:
        assess:
          maxTurns: 30
      schedule:
        enabled: true
        intervalSeconds: 3200
    canopy-describe:
      provider:
        type: lmstudio
        base_url: http://localhost:1234
        model: google/gemma-4-26b-a4b
        reasoning_map:
          low: openai/gpt-oss-20b
          default: google/gemma-4-26b-a4b
          high: google/gemma-4-31b
        context_length: 16384
      harness: openai-agents
      schedule:
        enabled: true
      params:
        batch_size: 10
    canopy-map:
      provider:
        type: anthropic
        model: claude-haiku-4-5-20251001
        reasoning_map:
          low: claude-haiku-4-5-20251001
          default: claude-sonnet-4-6
          high: claude-opus-4-6
      harness: claude-sdk
      schedule:
        enabled: true
skills:
  confidence_threshold: 0.7
  usage_stale_days: 30
notifications:
  enabled: true
  system_notifications: true
  default_mode: summary
  domains:
    skills:
      enabled: true
      mode: banner
    sessions:
      enabled: false
    mycelium:
      enabled: true
    settings:
      enabled: true
      mode: banner
cortex:
  enabled: true
  instructions:
    inject_on_session_start: true
  digest:
    tier: 5000
    inject_on_session_start: false
  spores:
    inject_on_prompt_submit: true
    max_per_prompt: 3
  canopy:
    refresh:
      background_enabled: true
      background_period_minutes: 60
    exclude:
      default_patterns:
        - .git
        - .DS_Store
        - node_modules
        - __pycache__
        - .venv
        - venv
        - env
        - ENV
        - .pytest_cache
        - .ruff_cache
        - .mypy_cache
        - .tox
        - dist
        - build
        - target
        - .gradle
        - .cache
        - .next
        - .nuxt
        - .turbo
        - .svelte-kit
        - "**/*.lock"
        - "**/package-lock.json"
        - "**/pnpm-lock.yaml"
        - "**/yarn.lock"
      patterns: []
    inject_on_pre_tool_use: true
    min_file_bytes: 800
appearance:
  theme: sage
  mode: dark
  font: default
  density: normal
symbionts:
  claude-code:
    enabled: true
  codex:
    enabled: true
  cursor:
    enabled: true
  gemini:
    enabled: true
  opencode:
    enabled: true
  pi:
    enabled: true
  vscode-copilot:
    enabled: true
  windsurf:
    enabled: true
