version: 3
config_version: 3
embedding:
  provider: ollama
  model: bge-m3:latest
daemon:
  port: 21039
  log_level: debug
  log_retention_days: 30
capture:
  transcript_paths: []
  plan_dirs:
    - docs/superpowers/specs/
    - docs/superpowers/plans/
  artifact_extensions:
    - .md
  buffer_max_events: 500
agent:
  summary_batch_interval: 5
  provider:
    type: cloud
  tasks:
    full-intelligence:
      provider:
        type: cloud
        model: claude-sonnet-4-6
      schedule:
        enabled: true
        intervalSeconds: 1800
    title-summary:
      provider:
        type: cloud
        model: claude-haiku-4-5-20251001
    title-summary-custom:
      provider:
        type: ollama
        base_url: http://localhost:11434
        model: glm-4.7-flash:latest
    review-session:
      provider:
        type: cloud
        model: claude-sonnet-4-6
    skill-survey:
      provider:
        type: cloud
      schedule:
        enabled: true
        runIn:
          - idle
    skill-generate:
      provider:
        type: cloud
      schedule:
        enabled: true
        runIn:
          - idle
    skill-evolve:
      provider:
        type: cloud
      schedule:
        enabled: true
        intervalSeconds: 1800
context:
  digest_tier: 5000
  prompt_search: true
  prompt_max_spores: 3
backup:
  dir: ~/myco_backups/myco
team:
  enabled: true
  worker_url: https://myco-team-974bc350.goondocks.workers.dev
  interval_minutes: 15
skills:
  confidence_threshold: 0.7
  usage_stale_days: 30
notifications:
  enabled: true
  system_notifications: true
  default_mode: summary
  domains:
    skills:
      enabled: true
      mode: banner
