version: 3
config_version: 4
embedding:
  provider: ollama
  model: bge-m3:latest
daemon:
  port: 21039
  log_level: debug
  log_retention_days: 30
capture:
  transcript_paths: []
  plan_dirs:
    - docs/superpowers/specs/
    - docs/superpowers/plans/
  artifact_extensions:
    - .md
  buffer_max_events: 500
agent:
  summary_batch_interval: 5
  scheduled_tasks_enabled: true
  event_tasks_enabled: true
  provider:
    type: anthropic
    model: claude-sonnet-4-6
  tasks:
    full-intelligence:
      provider:
        type: anthropic
        model: claude-sonnet-4-6
      phases:
        read-state:
          maxTurns: 20
        extract:
          maxTurns: 35
      schedule:
        enabled: true
        intervalSeconds: 1800
    title-summary:
      provider:
        type: anthropic
        model: claude-sonnet-4-6
      timeoutSeconds: 180
    title-summary-custom:
      provider:
        type: ollama
        base_url: http://localhost:11434
        model: glm-4.7-flash:latest
    review-session:
      provider:
        type: anthropic
        model: claude-sonnet-4-6
    skill-survey:
      provider:
        type: anthropic
      schedule:
        enabled: true
        runIn:
          - idle
    skill-generate:
      provider:
        type: anthropic
      schedule:
        enabled: true
        runIn:
          - idle
    skill-evolve:
      provider:
        type: anthropic
      phases:
        assess:
          maxTurns: 30
      schedule:
        enabled: true
        intervalSeconds: 1800
context:
  digest_tier: 5000
  prompt_search: true
  prompt_max_spores: 3
backup:
  dir: ~/myco_backups/myco
maintenance:
  auto_optimize: true
  auto_optimize_interval_hours: 24
team:
  enabled: true
  worker_url: https://myco-team-974bc350.goondocks.workers.dev
  interval_minutes: 15
  deployed_worker_version: 0.17.2
skills:
  confidence_threshold: 0.7
  usage_stale_days: 30
notifications:
  enabled: true
  system_notifications: true
  default_mode: summary
  domains:
    skills:
      enabled: true
      mode: banner
    sessions:
      enabled: false
    mycelium:
      enabled: false
symbionts:
  claude-code:
    enabled: true
  codex:
    enabled: true
  cursor:
    enabled: true
  gemini:
    enabled: true
  opencode:
    enabled: true
  vscode-copilot:
    enabled: true
  windsurf:
    enabled: true
