version: 3
config_version: 9
capture:
  transcript_paths: []
  plan_dirs:
    - docs/superpowers/specs/
    - docs/superpowers/plans/
    - docs/design/
    - docs/plans
    - docs/superpowers/handoffs
  ignore_plan_dirs_in_git: true
  artifact_extensions:
    - .md
  buffer_max_events: 500
release_provenance:
  enabled: true
  production_refs:
    - refs/tags/myco/v*
    - refs/tags/myco-team/v*
    - refs/tags/myco-collective/v*
    - refs/tags/myco-shared/v*
  integration_refs:
    - origin/main
  reconcile_interval_minutes: 15
  production_debug_include_unknown: true
  github:
    repo: goondocks-co/myco
    token_env: GITHUB_TOKEN
    max_lookups_per_run: 20
  package_map:
    - path_glob: packages/myco/
      tag_pattern: refs/tags/myco/v*
    - path_glob: packages/myco-team/
      tag_pattern: refs/tags/myco-team/v*
    - path_glob: packages/myco-collective/
      tag_pattern: refs/tags/myco-collective/v*
    - path_glob: packages/myco-shared/
      tag_pattern: refs/tags/myco-shared/v*
skills:
  confidence_threshold: 0.7
  usage_stale_days: 30
notifications:
  enabled: true
  system_notifications: true
  default_mode: summary
  domains:
    skills:
      enabled: true
      mode: banner
    sessions:
      enabled: false
    mycelium:
      enabled: true
    settings:
      enabled: true
      mode: banner
cortex:
  enabled: true
  instructions:
    inject_on_session_start: true
  digest:
    tier: 1500
    inject_on_session_start: false
  spores:
    inject_on_prompt_submit: true
    max_per_prompt: 3
  canopy:
    refresh:
      background_enabled: true
      background_period_minutes: 60
    exclude:
      default_patterns:
        - .git
        - .DS_Store
        - node_modules
        - __pycache__
        - .venv
        - venv
        - env
        - ENV
        - .pytest_cache
        - .ruff_cache
        - .mypy_cache
        - .tox
        - dist
        - build
        - target
        - .gradle
        - .cache
        - .next
        - .nuxt
        - .turbo
        - .svelte-kit
        - "**/*.lock"
        - "**/package-lock.json"
        - "**/pnpm-lock.yaml"
        - "**/yarn.lock"
      patterns: []
    inject_on_pre_tool_use: true
    min_file_bytes: 800
