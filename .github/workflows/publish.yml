name: Release

on:
  push:
    tags:
      - 'myco/v*.*.*'
      - 'myco/v*.*.*-*'
      - 'myco-team/v*.*.*'
      - 'myco-team/v*.*.*-*'
      - 'myco-collective/v*.*.*'
      - 'myco-collective/v*.*.*-*'

permissions:
  contents: write
  id-token: write

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.extract.outputs.tag_name }}
      tag_prefix: ${{ steps.extract.outputs.tag_prefix }}
      version: ${{ steps.extract.outputs.version }}
      is_prerelease: ${{ steps.extract.outputs.is_prerelease }}
      npm_tag: ${{ steps.extract.outputs.npm_tag }}
      package_name: ${{ steps.extract.outputs.package_name }}
      package_dir: ${{ steps.extract.outputs.package_dir }}
      tarball_prefix: ${{ steps.extract.outputs.tarball_prefix }}
    steps:
      - name: Extract package and version from tag
        id: extract
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_PREFIX="${TAG_NAME%%/v*}"
          VERSION="${TAG_NAME#${TAG_PREFIX}/v}"

          case "$TAG_PREFIX" in
            myco)
              PACKAGE_NAME="@goondocks/myco"
              PACKAGE_DIR="packages/myco"
              TARBALL_PREFIX="goondocks-myco"
              ;;
            myco-team)
              PACKAGE_NAME="@goondocks/myco-team"
              PACKAGE_DIR="packages/myco-team"
              TARBALL_PREFIX="goondocks-myco-team"
              ;;
            myco-collective)
              PACKAGE_NAME="@goondocks/myco-collective"
              PACKAGE_DIR="packages/myco-collective"
              TARBALL_PREFIX="goondocks-myco-collective"
              ;;
            *)
              echo "Unsupported release tag: $TAG_NAME" >&2
              exit 1
              ;;
          esac

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=$TAG_PREFIX" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "tarball_prefix=$TARBALL_PREFIX" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ -alpha\. ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -beta\. ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -rc\. ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm ci

      - name: Sync target package versions from tag
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TAG_PREFIX: ${{ needs.validate-tag.outputs.tag_prefix }}
        run: |
          case "$TAG_PREFIX" in
            myco) export MYCO_VERSION="$VERSION" ;;
            myco-team) export MYCO_TEAM_VERSION="$VERSION" ;;
            myco-collective) export MYCO_COLLECTIVE_VERSION="$VERSION" ;;
          esac
          node scripts/sync-package-versions.mjs

      - name: Build and test target package
        env:
          PACKAGE_NAME: ${{ needs.validate-tag.outputs.package_name }}
        run: |
          npm run lint
          npm run test
          npm run build -w "$PACKAGE_NAME"

      - name: Pack npm tarball
        working-directory: ${{ needs.validate-tag.outputs.package_dir }}
        run: npm pack

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ needs.validate-tag.outputs.package_dir }}/${{ needs.validate-tag.outputs.tarball_prefix }}-*.tgz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-tag, build]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: release-files

      - name: Generate release notes
        id: notes
        env:
          TAG_NAME: ${{ needs.validate-tag.outputs.tag_name }}
          TAG_PREFIX: ${{ needs.validate-tag.outputs.tag_prefix }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          PACKAGE_NAME: ${{ needs.validate-tag.outputs.package_name }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.is_prerelease }}
        run: |
          PREVIOUS_TAG=$(git tag --list "${TAG_PREFIX}/v*" --sort=-version:refname | grep -Fxv "$TAG_NAME" | head -1 || true)
          if [ -z "$PREVIOUS_TAG" ] && [ "$TAG_PREFIX" = "myco" ]; then
            PREVIOUS_TAG=$(git tag --list "v*.*.*" --sort=-version:refname | head -1 || true)
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s" --no-merges | head -50)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            cat > release-notes.md <<NOTES_EOF
          ## Pre-release

          This is a pre-release for \`${PACKAGE_NAME}\` and may contain bugs or incomplete features.

          ## What's Changed

          ${COMMITS}
          NOTES_EOF
          else
            cat > release-notes.md <<NOTES_EOF
          ## Package

          - \`${PACKAGE_NAME}\`
          - Version \`${VERSION}\`

          ## What's Changed

          ${COMMITS}
          NOTES_EOF
          fi

          sed -i 's/^          //' release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          name: ${{ needs.validate-tag.outputs.tag_name }}
          body_path: release-notes.md
          files: release-files/*
          draft: false
          prerelease: ${{ needs.validate-tag.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npmjs.org
    runs-on: ubuntu-latest
    needs: [validate-tag, create-release]
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Sync target package versions from tag
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TAG_PREFIX: ${{ needs.validate-tag.outputs.tag_prefix }}
        run: |
          case "$TAG_PREFIX" in
            myco) export MYCO_VERSION="$VERSION" ;;
            myco-team) export MYCO_TEAM_VERSION="$VERSION" ;;
            myco-collective) export MYCO_COLLECTIVE_VERSION="$VERSION" ;;
          esac
          node scripts/sync-package-versions.mjs

      - name: Build target package
        env:
          PACKAGE_NAME: ${{ needs.validate-tag.outputs.package_name }}
        run: npm run build -w "$PACKAGE_NAME"

      - name: Publish package
        working-directory: ${{ needs.validate-tag.outputs.package_dir }}
        env:
          NPM_TAG: ${{ needs.validate-tag.outputs.npm_tag }}
        run: npx npm@latest publish --tag "$NPM_TAG" --provenance --access public

      - name: Publish summary
        env:
          TAG_NAME: ${{ needs.validate-tag.outputs.tag_name }}
          PACKAGE_NAME: ${{ needs.validate-tag.outputs.package_name }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.is_prerelease }}
          NPM_TAG: ${{ needs.validate-tag.outputs.npm_tag }}
        run: |
          echo "## Published to npmjs.org" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** $TAG_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Package:** $PACKAGE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "**npm tag:** $NPM_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "**Pre-release:** $IS_PRERELEASE" >> "$GITHUB_STEP_SUMMARY"
