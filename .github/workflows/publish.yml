name: Release

# Tag pushes publish; pull requests and manual dispatches verify the release recipe.
on:
  push:
    tags:
      - 'myco/v*.*.*'
      - 'myco/v*.*.*-*'
      - 'myco-shared/v*.*.*'
      - 'myco-shared/v*.*.*-*'

  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'scripts/**'
      - 'packages/myco/scripts/**'
      - 'packages/myco/plugin-version.json'
      - 'plugins/myco/**'
      - '.claude-plugin/marketplace.json'
      - '**/package.json'
      - '**/package-lock.json'
      - '.bun-version'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing
        required: true
        default: '2.0.0-alpha.1'
        type: string
      package:
        description: Package family to verify
        default: myco
        type: choice
        options: [myco, myco-shared]

permissions:
  actions: read
  contents: read

jobs:
  require-ci:
    name: Require CI for tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Require the canonical CI aggregate on main
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/require-release-ci.mjs
      - name: Dry-run admission
        if: github.event_name != 'push'
        run: echo 'Dry run verifies release artifacts; publication requires the exact-SHA main CI aggregate.'

  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.extract.outputs.dry_run }}
      publication_allowed: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && steps.extract.outputs.dry_run == 'false' }}
      tag_name: ${{ steps.extract.outputs.tag_name }}
      tag_prefix: ${{ steps.extract.outputs.tag_prefix }}
      version: ${{ steps.extract.outputs.version }}
      is_prerelease: ${{ steps.extract.outputs.is_prerelease }}
      npm_tag: ${{ steps.extract.outputs.npm_tag }}
      package_name: ${{ steps.extract.outputs.package_name }}
      package_dir: ${{ steps.extract.outputs.package_dir }}
      tarball_prefix: ${{ steps.extract.outputs.tarball_prefix }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract package and version from tag
        id: extract
        env:
          TAG_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_VERSION: ${{ inputs.version || '2.0.0-alpha.1' }}
          DRY_RUN_PACKAGE: ${{ inputs.package || 'myco' }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            DRY_RUN=false
          else
            TAG_NAME="${DRY_RUN_PACKAGE}/v${DRY_RUN_VERSION}"
            DRY_RUN=true
          fi
          TAG_PREFIX="${TAG_NAME%%/v*}"
          VERSION="${TAG_NAME#"${TAG_PREFIX}/v"}"

          case "$TAG_PREFIX" in
            myco)
              PACKAGE_NAME="@goondocks/myco"
              PACKAGE_DIR="packages/myco"
              TARBALL_PREFIX="goondocks-myco"
              ;;
            myco-shared)
              PACKAGE_NAME="@goondocks/myco-shared"
              PACKAGE_DIR="packages/myco-shared"
              TARBALL_PREFIX="goondocks-myco-shared"
              ;;
            *)
              echo "Unsupported release tag: $TAG_NAME" >&2
              exit 1
              ;;
          esac

          # A version is <major>.<minor>.<patch>, or that with a -alpha.N,
          # -beta.N or -rc.N prerelease. Every hyphenated version is a
          # prerelease under its own npm dist-tag, never latest; any other
          # shape fails here, before anything is built or published.
          if ! VERSION="$VERSION" node --input-type=module -e 'import { releaseKey } from "./packages/myco/scripts/release-policy.mjs"; if (!releaseKey(process.env.VERSION)) process.exit(1)'; then
            echo "Malformed version in release tag: $TAG_NAME" >&2
            exit 1
          fi
          case "$VERSION" in
            *-alpha.*) IS_PRERELEASE=true; NPM_TAG=alpha ;;
            *-beta.*)  IS_PRERELEASE=true; NPM_TAG=beta ;;
            *-rc.*)    IS_PRERELEASE=true; NPM_TAG=next ;;
            *-*)
              echo "Unsupported prerelease in release tag: $TAG_NAME (use -alpha.N, -beta.N or -rc.N)" >&2
              exit 1
              ;;
            *) IS_PRERELEASE=false; NPM_TAG=latest ;;
          esac
          printf '%s\n' "dry_run=$DRY_RUN" "tag_name=$TAG_NAME" \
            "tag_prefix=$TAG_PREFIX" "version=$VERSION" \
            "package_name=$PACKAGE_NAME" "package_dir=$PACKAGE_DIR" \
            "tarball_prefix=$TARBALL_PREFIX" "is_prerelease=$IS_PRERELEASE" \
            "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: Require the committed Git plugin release version
        if: github.event_name == 'push' && steps.extract.outputs.tag_prefix == 'myco'
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { version } = JSON.parse(fs.readFileSync("packages/myco/plugin-version.json", "utf8"));
            if (version !== process.env.VERSION) throw new Error("Commit the matching Git plugin bundle with scripts/prepare-plugin-release.mjs before tagging");
          '

  # Per-target libsqlite3 compile, gated on myco tags only.
  # Runner OS per target:
  #   darwin-*  → macos-latest (host-compile both archs with clang -arch)
  #   linux-x64 → ubuntu-latest (host-compile)
  #   linux-arm64, windows-x64 → ubuntu-latest with cross toolchain installed
  # We intentionally avoid osxcross for darwin targets.
  compile-libsqlite3:
    name: Compile libsqlite3 (${{ matrix.target }})
    needs: validate-tag
    if: needs.validate-tag.outputs.tag_prefix == 'myco'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            os: macos-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: windows-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cross toolchain (linux-arm64)
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross toolchain (windows-x64)
        if: matrix.target == 'windows-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64

      - name: Build libsqlite3
        env:
          TARGET: ${{ matrix.target }}
        run: bash packages/myco/scripts/build-libsqlite3-target.sh "$TARGET"

      - name: Upload libsqlite3 artifact
        uses: actions/upload-artifact@v7
        with:
          name: libsqlite3-${{ matrix.target }}
          path: packages/myco/vendor-src/libsqlite3/${{ matrix.target }}/
          if-no-files-found: error

  # Per-target myco binary compile via `bun build --compile`. Each matrix job
  # stages the target's sqlite-vec + ripgrep native binaries and downloads
  # the matching libsqlite3 artifact before compiling.
  cross-compile:
    name: Cross-compile myco (${{ matrix.target }})
    needs: [validate-tag, compile-libsqlite3]
    if: needs.validate-tag.outputs.tag_prefix == 'myco'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64, windows-x64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Cross-compile does not use host postinstall side effects: we stage the
      # target sqlite-vec package and ripgrep binary explicitly below. Skipping
      # scripts avoids flaky host-only GitHub downloads from @vscode/ripgrep.
      - run: npm ci --ignore-scripts

      - name: Sync target package versions from tag
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TAG_PREFIX: ${{ needs.validate-tag.outputs.tag_prefix }}
        run: node scripts/sync-package-versions.mjs --target "$TAG_PREFIX" --version "$VERSION"

      # The target's sqlite-vec native extension must be present in
      # node_modules for the per-target entry's import to resolve. npm ci on
      # the host only pulls the host optional subpackage, so force-install
      # the target's subpackage at the same pinned version.
      - name: Install sqlite-vec target subpackage
        env:
          TARGET: ${{ matrix.target }}
        run: |
          SQLITE_VEC_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./node_modules/sqlite-vec/package.json', 'utf8')).version")"
          npm install "sqlite-vec-${TARGET}@${SQLITE_VEC_VERSION}" --no-save --ignore-scripts --force

      # @vscode/ripgrep 1.18+ ships the binary inside platform-specific
      # subpackages (declared as optionalDependencies on the umbrella
      # `@vscode/ripgrep`). npm ci on a single host only resolves the
      # host-matching subpackage, so force-install the target's subpackage
      # at the same pinned version. Mirrors the sqlite-vec step above.
      # Safe: TARGET is bound from matrix.target, not user input; the
      # case/esac restricts RG_PLATFORM to a known set before use.
      - name: Install @vscode/ripgrep target subpackage
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            windows-x64)  RG_PLATFORM="win32-x64" ;;
            darwin-arm64|darwin-x64|linux-x64|linux-arm64) RG_PLATFORM="$TARGET" ;;
            *) echo "unknown target: $TARGET" >&2; exit 1 ;;
          esac
          RG_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./node_modules/@vscode/ripgrep/package.json', 'utf8')).version")"
          npm install "@vscode/ripgrep-${RG_PLATFORM}@${RG_VERSION}" --no-save --ignore-scripts --force
          ls -lh "node_modules/@vscode/ripgrep-${RG_PLATFORM}/bin/"

      - name: Download libsqlite3 artifact
        uses: actions/download-artifact@v8
        with:
          name: libsqlite3-${{ matrix.target }}
          path: packages/myco/vendor-src/libsqlite3/${{ matrix.target }}/

      # Build the Deployment dashboard before codegen embeds it in the binary.
      - run: npm run build:ui -w @goondocks/myco

      - run: npm run codegen -w @goondocks/myco

      - name: Compile myco binary
        env:
          TARGET: ${{ matrix.target }}
        run: TARGET="$TARGET" npm run build:binary -w @goondocks/myco

      - name: Upload myco binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: myco-binary-${{ matrix.target }}
          # build-single-target.mjs writes the binary into the per-platform
          # npm package's bin/ directory. Upload just that — the build job
          # downloads back into the same path so the per-platform npm pack
          # picks it up.
          path: packages/myco-${{ matrix.target }}/bin/
          if-no-files-found: error

  sign-darwin:
    name: Sign macOS binary (${{ matrix.target }})
    needs: [validate-tag, cross-compile]
    if: needs.validate-tag.outputs.tag_prefix == 'myco'
    runs-on: macos-14
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: myco-binary-${{ matrix.target }}
          path: binary/
      - name: Sign macOS executable
        run: bash scripts/sign-darwin-binary.sh binary/myco
      - name: Replace binary artifact with signed bytes
        uses: actions/upload-artifact@v7
        with:
          name: myco-binary-${{ matrix.target }}
          path: binary/
          overwrite: true
          if-no-files-found: error

  build:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    needs: [validate-tag, cross-compile, sign-darwin]
    # cross-compile is skipped for myco-shared tags, which would
    # normally cascade-skip this job. Force it to run in that case.
    if: |
      always() &&
      needs.validate-tag.result == 'success' &&
      (needs.cross-compile.result == 'success' || needs.cross-compile.result == 'skipped') &&
      (needs.sign-darwin.result == 'success' ||
       (needs.validate-tag.outputs.tag_prefix != 'myco' && needs.sign-darwin.result == 'skipped'))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - run: npm ci
      - name: Sync target package versions from tag
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TAG_PREFIX: ${{ needs.validate-tag.outputs.tag_prefix }}
        run: node scripts/sync-package-versions.mjs --target "$TAG_PREFIX" --version "$VERSION"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Verify committed plugin bundle
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        run: |
          node --import tsx packages/myco/scripts/gen-plugin-bundle.ts --check

      # For myco-shared tags, run the normal build (bun build). For
      # myco tags, the binaries arrive from the cross-compile matrix —
      # downloaded in the next step. Run only the UI build locally.
      - name: Build target package (myco-shared)
        if: needs.validate-tag.outputs.tag_prefix != 'myco'
        env:
          PACKAGE_NAME: ${{ needs.validate-tag.outputs.package_name }}
        run: npm run build -w "$PACKAGE_NAME"

      # Stage the pre-built per-target binaries back into their platform
      # packages. download-artifact with `pattern` places each artifact in a
      # subdirectory named after the artifact; we move each binary into the
      # matching `packages/myco-<target>/bin/`. Only runs for myco tags.
      - name: Download cross-compiled myco binaries
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        uses: actions/download-artifact@v8
        with:
          pattern: myco-binary-*
          path: artifacts-staging/

      - name: Stage platform binaries
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        run: |
          set -euo pipefail
          STAGING="artifacts-staging"
          for dir in "$STAGING"/myco-binary-*; do
            [ -d "$dir" ] || continue
            target="${dir##*/myco-binary-}"
            destdir="packages/myco-${target}/bin"
            mkdir -p "$destdir"
            cp -R "$dir"/. "$destdir/"
          done
          rm -rf "$STAGING"

      # Verify every platform binary landed before packing.
      - name: Verify platform binaries
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            ext=""
            [ "$target" = "windows-x64" ] && ext=".exe"
            binary="packages/myco-${target}/bin/myco${ext}"
            if [ ! -f "$binary" ]; then
              echo "missing binary: $binary" >&2
              exit 1
            fi
            chmod +x "$binary"
          done

      - name: Verify release binary version
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        run: npm run build:verify -w @goondocks/myco

      - name: Smoke release binary database and HTTP server
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: node scripts/verify-release-binary.mjs packages/myco-linux-x64/bin/myco "$VERSION"

      # Stage raw binaries into a flat directory with canonical asset names so
      # upload-artifact has a single directory to root from, eliminating the
      # least-common-ancestor prefix stripping that would occur when uploading
      # multiple paths spanning packages/myco-<target>/bin/myco[.exe].
      - name: Stage raw binaries into flat release-binaries/ dir (myco)
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        run: |
          set -euo pipefail
          mkdir -p release-binaries
          cp packages/myco-darwin-arm64/bin/myco    release-binaries/myco-darwin-arm64
          cp packages/myco-darwin-x64/bin/myco      release-binaries/myco-darwin-x64
          cp packages/myco-linux-x64/bin/myco       release-binaries/myco-linux-x64
          cp packages/myco-linux-arm64/bin/myco     release-binaries/myco-linux-arm64
          cp packages/myco-windows-x64/bin/myco.exe release-binaries/myco-windows-x64.exe

      # Upload the flat release-binaries/ dir as a single artifact. Because the
      # path is a single directory, upload-artifact roots the artifact there and
      # stores bare canonical filenames (myco-darwin-arm64, myco-linux-x64, etc.)
      # with no nested prefix — the create-release job receives them flat.
      - name: Upload raw binaries artifact (myco)
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        uses: actions/upload-artifact@v7
        with:
          name: myco-raw-binaries
          path: release-binaries/
          if-no-files-found: error

      # For myco tags, pack the 5 platform packages first (each injects
      # os/cpu metadata just before pack so the published tarball carries
      # the constraint while source-tree workspaces stay platform-neutral).
      - name: Pack platform packages (myco)
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            node scripts/inject-platform-metadata.mjs "$target"
            (cd "packages/myco-${target}" && npm pack --json > npm-pack.json)
          done

      - name: Pack npm tarball
        working-directory: ${{ needs.validate-tag.outputs.package_dir }}
        run: |
          PACK_JSON="$(npm pack --json)"
          printf '%s\n' "$PACK_JSON" > npm-pack.json

      - name: Verify packed package version
        working-directory: ${{ needs.validate-tag.outputs.package_dir }}
        env:
          PACKAGE_NAME: ${{ needs.validate-tag.outputs.package_name }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const expectedName = process.env.PACKAGE_NAME;
          const expectedVersion = process.env.VERSION;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
          const pack = JSON.parse(fs.readFileSync('npm-pack.json', 'utf-8'))[0];

          if (pkg.name !== expectedName) {
            throw new Error(`package.json name ${pkg.name} did not match ${expectedName}`);
          }

          if (pkg.version !== expectedVersion) {
            throw new Error(`package.json version ${pkg.version} did not match ${expectedVersion}`);
          }

          if (pack.name !== expectedName) {
            throw new Error(`packed name ${pack.name} did not match ${expectedName}`);
          }

          if (pack.version !== expectedVersion) {
            throw new Error(`packed version ${pack.version} did not match ${expectedVersion}`);
          }
          NODE

      - name: Verify packed package size
        working-directory: ${{ needs.validate-tag.outputs.package_dir }}
        env:
          TAG_PREFIX: ${{ needs.validate-tag.outputs.tag_prefix }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          // Core @goondocks/myco no longer bundles platform binaries — each
          // ships in its own @goondocks/myco-<arch> package. Core should
          // stay well under the old 210 MB ceiling. Per-platform packages
          // are verified separately below.
          const tagPrefix = process.env.TAG_PREFIX;
          const maxBytes = tagPrefix === 'myco' ? 50_000_000 : 210_000_000;
          const pack = JSON.parse(fs.readFileSync('npm-pack.json', 'utf-8'))[0];

          if (pack.size > maxBytes) {
            const sizeMb = (pack.size / 1_000_000).toFixed(1);
            const maxMb = (maxBytes / 1_000_000).toFixed(1);
            throw new Error(`packed tarball is ${sizeMb} MB, above npm publish guardrail ${maxMb} MB`);
          }
          NODE

      - name: Verify packed platform-package sizes (myco)
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          // Each per-platform package ships one Bun-compiled binary,
          // typically ~30 MB packed. Guard the upper end to catch a
          // regression that re-bundles unintended payloads.
          const maxBytes = 60_000_000;
          const targets = ['darwin-arm64', 'darwin-x64', 'linux-x64', 'linux-arm64', 'windows-x64'];
          for (const target of targets) {
            const pack = JSON.parse(fs.readFileSync(`packages/myco-${target}/npm-pack.json`, 'utf-8'))[0];
            if (pack.size > maxBytes) {
              const sizeMb = (pack.size / 1_000_000).toFixed(1);
              const maxMb = (maxBytes / 1_000_000).toFixed(1);
              throw new Error(`@goondocks/myco-${target}: packed tarball is ${sizeMb} MB, above guardrail ${maxMb} MB`);
            }
          }
          NODE

      - name: Upload build artifact
        if: needs.validate-tag.outputs.tag_prefix != 'myco'
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ needs.validate-tag.outputs.package_dir }}/${{ needs.validate-tag.outputs.tarball_prefix }}-*.tgz

      # For myco tags we upload core + 5 per-platform tarballs as one artifact
      # bundle. download-artifact preserves the directory layout, so the
      # publish step recovers `packages/myco/*.tgz` and
      # `packages/myco-<target>/*.tgz`.
      - name: Upload build artifact (myco)
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: |
            packages/myco/goondocks-myco-*.tgz
            packages/myco-darwin-arm64/goondocks-myco-darwin-arm64-*.tgz
            packages/myco-darwin-x64/goondocks-myco-darwin-x64-*.tgz
            packages/myco-linux-x64/goondocks-myco-linux-x64-*.tgz
            packages/myco-linux-arm64/goondocks-myco-linux-arm64-*.tgz
            packages/myco-windows-x64/goondocks-myco-windows-x64-*.tgz
          if-no-files-found: error

  verify-darwin:
    name: Verify staged macOS distributions
    needs: [validate-tag, build]
    if: needs.validate-tag.outputs.tag_prefix == 'myco'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: myco-raw-binaries
          path: raw-binaries/
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: npm-packages/
      - name: Verify exact release assets and npm binaries
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64; do
            tarballs=("npm-packages/myco-${target}/goondocks-myco-${target}-"*.tgz)
            if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
              echo "Expected one packed npm tarball for $target" >&2
              exit 1
            fi
            mode=native
            if [ "$target" = darwin-x64 ]; then
              mode=signature-only
              echo "darwin-x64 execution skipped: Bun x64 raises SIGILL under macos-14 Rosetta; both signatures and byte identity are required."
            fi
            bash scripts/verify-darwin-distribution.sh "$VERSION" "raw-binaries/myco-${target}" "${tarballs[0]}" "$mode"
          done

  create-release:
    name: Create GitHub Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [validate-tag, build, require-ci, verify-darwin]
    # build runs for all tag prefixes via its always() gate; this gate
    # carries that override forward. myco-shared is internal — we skip
    # the GitHub Release UI for it but still let publish run.
    if: |
      always() &&
      needs.validate-tag.outputs.publication_allowed == 'true' &&
      needs.validate-tag.result == 'success' &&
      needs.build.result == 'success' &&
      needs.require-ci.result == 'success' &&
      (needs.verify-darwin.result == 'success' ||
       (needs.validate-tag.outputs.tag_prefix != 'myco' && needs.verify-darwin.result == 'skipped')) &&
      needs.validate-tag.outputs.tag_prefix != 'myco-shared'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: release-files

      - name: Generate release notes
        id: notes
        env:
          TAG_NAME: ${{ needs.validate-tag.outputs.tag_name }}
          TAG_PREFIX: ${{ needs.validate-tag.outputs.tag_prefix }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          PACKAGE_NAME: ${{ needs.validate-tag.outputs.package_name }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.is_prerelease }}
        run: |
          set -euo pipefail

          # Semver-aware tag sort: bare versions rank above prerelease variants.
          # Without these -c flags, git treats `v0.22.0-beta.5` as higher than
          # bare `v0.22.0`, which is the opposite of semver.
          SORT_FLAGS=(-c versionsort.suffix=-alpha -c versionsort.suffix=-beta
                      -c versionsort.suffix=-rc    -c versionsort.suffix=-pre)

          # Pick the right "previous" tag for the changelog range.
          # - Stable releases compare against the last STABLE tag only, so
          #   0.22.0's notes cover everything since 0.21.2 (not since
          #   0.22.0-beta.5).
          # - Prereleases compare against the most recent tag of any kind,
          #   matching the iterative beta workflow.
          if [ "$IS_PRERELEASE" = "true" ]; then
            PREVIOUS_TAG=$(git "${SORT_FLAGS[@]}" tag --list "${TAG_PREFIX}/v*" \
              --sort=-version:refname \
              | grep -Fxv "$TAG_NAME" | head -1 || true)
          else
            PREVIOUS_TAG=$(git "${SORT_FLAGS[@]}" tag --list "${TAG_PREFIX}/v*" \
              --sort=-version:refname \
              | grep -Fxv "$TAG_NAME" \
              | grep -Ev -- '-(alpha|beta|rc|pre)' \
              | head -1 || true)
          fi

          # Legacy fallback for the core package: pre-monorepo tags used `v*.*.*`
          # with no prefix. Only applies when there is no prefixed ancestor.
          if [ -z "$PREVIOUS_TAG" ] && [ "$TAG_PREFIX" = "myco" ]; then
            PREVIOUS_TAG=$(git "${SORT_FLAGS[@]}" tag --list 'v*.*.*' \
              --sort=-version:refname | head -1 || true)
          fi

          # Use git log's own -n limit instead of `| head -N`. With
          # `set -euo pipefail`, head closing the pipe causes git to exit
          # SIGPIPE (141) and the whole step fails — first-time releases for
          # a new prefix hit this because the fallback `git log` walks the
          # entire repo history.
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log -n 50 "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
            COMMIT_COUNT=$(git log "${PREVIOUS_TAG}..HEAD" --oneline --no-merges | wc -l | tr -d ' ')
            RANGE_BLURB="${COMMIT_COUNT} commits since ${PREVIOUS_TAG}"
          else
            COMMITS=$(git log -n 20 --pretty=format:"- %s" --no-merges)
            RANGE_BLURB="initial release"
          fi

          # Friendly display name keyed on the tag prefix.
          case "$TAG_PREFIX" in
            myco)            DISPLAY_NAME="Myco" ;;
            myco-shared)     DISPLAY_NAME="Myco Shared" ;;
            *)               DISPLAY_NAME="$PACKAGE_NAME" ;;
          esac

          if [ "$TAG_PREFIX" = "myco" ]; then
            if [ "$IS_PRERELEASE" = "true" ]; then
              INSTALL_BLOCK='```bash
          curl --proto '"'"'=https'"'"' --tlsv1.2 -fsSL https://myco.sh/install.sh | MYCO_CHANNEL=${{ needs.validate-tag.outputs.npm_tag }} sh
          myco login <your-myco-address>
          ```

          Moving a machine from Myco 1.4: see [Upgrading from 1.4](https://github.com/goondocks-co/myco/blob/main/docs/upgrade.md#upgrading-from-myco-14).'
              if [ '${{ needs.validate-tag.outputs.npm_tag }}' = 'next' ]; then
                INSTALL_BLOCK='RC builds are outside the automatic release channels. Download the binary and SHA256SUMS from this release for manual evaluation.'
              fi
            else
              INSTALL_BLOCK='```bash
          curl --proto '"'"'=https'"'"' --tlsv1.2 -fsSL https://myco.sh/install.sh | sh
          myco login <your-myco-address>
          ```

          Moving a machine from Myco 1.4: see [Upgrading from 1.4](https://github.com/goondocks-co/myco/blob/main/docs/upgrade.md#upgrading-from-myco-14).'
            fi
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              INSTALL_BLOCK='```bash
          npm install -g '"${PACKAGE_NAME}"'@beta
          ```'
            else
              INSTALL_BLOCK='```bash
          npm install -g '"${PACKAGE_NAME}"'        # fresh install
          npm update  -g '"${PACKAGE_NAME}"'        # upgrade existing
          ```'
            fi
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            RELEASE_TITLE="${DISPLAY_NAME} ${VERSION} · Pre-release"
            cat > release-notes.md <<NOTES_EOF
          \`${PACKAGE_NAME}\` · ${RANGE_BLURB} · **Pre-release**

          > Pre-release. May contain bugs or incomplete features. Install alpha with \`MYCO_CHANNEL=alpha\`, or beta with \`MYCO_CHANNEL=beta\`. Fresh default installs choose 2.x stable, then beta, then alpha, never 1.4. Explicit stable selects releases only. Existing 1.4 machines keep 1.x updates until --replace-1.4. Alpha admits alpha, beta and stable; beta admits beta and stable. Updates stay within the recorded channel and never downgrade. Cut the stable/next tag first; delete old prerelease tags only after its release is published.

          ## Install

          ${INSTALL_BLOCK}

          ## What's Changed

          ${COMMITS}
          NOTES_EOF
          else
            RELEASE_TITLE="${DISPLAY_NAME} ${VERSION}"
            cat > release-notes.md <<NOTES_EOF
          \`${PACKAGE_NAME}\` · ${RANGE_BLURB}

          Cut the stable/next tag first; delete old prerelease tags only after its release is published. Installed machines never downgrade when a channel target is older.

          ## Install / Upgrade

          ${INSTALL_BLOCK}

          ## What's Changed

          ${COMMITS}
          NOTES_EOF
          fi

          sed -i 's/^          //' release-notes.md

          # Export the title for the next step.
          echo "title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      # Collect every .tgz under release-files/ (multi-directory for myco
      # tags, single file for myco-shared) into a flat list. Using
      # `find` keeps the gh-release invocation directory-structure-agnostic.
      - name: Collect release assets
        id: assets
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-files -type f -name '*.tgz' | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no .tgz files found in release-files/" >&2
            exit 1
          fi
          printf '%s\n' "${assets[@]}" > release-assets.txt
          cat release-assets.txt

      # The release is created as a draft, and made public only by the last step
      # below, once every asset is attached: an installer reading the releases
      # list never sees a release whose binaries or SHA256SUMS are still missing.
      - name: Create or update GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.validate-tag.outputs.tag_name }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.is_prerelease }}
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
        run: |
          set -euo pipefail

          mapfile -t assets < release-assets.txt

          if existing_draft="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            case "$existing_draft" in
              false) echo "published=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              true) ;;
              *) echo "Invalid release draft status" >&2; exit 1 ;;
            esac
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file release-notes.md
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            create_args=(
              "$TAG_NAME"
              "${assets[@]}"
              --verify-tag
              --draft
              --title "$RELEASE_TITLE"
              --notes-file release-notes.md
            )
            if [ "$IS_PRERELEASE" = "true" ]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

      # Download the raw binaries artifact (uploaded by the build job for myco
      # tags) and attach them to the GitHub Release under canonical asset names.
      # Additive: the .tgz upload above is untouched.
      - name: Download raw binaries artifact (myco)
        if: needs.validate-tag.outputs.tag_prefix == 'myco' && steps.release.outputs.published != 'true'
        uses: actions/download-artifact@v8
        with:
          name: myco-raw-binaries
          path: raw-binaries-staging/

      - name: Stage and upload raw binaries + SHA256SUMS (myco)
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.validate-tag.outputs.tag_name }}
          RELEASE_PUBLISHED: ${{ steps.release.outputs.published }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_PUBLISHED:-false}" = "true" ]; then exit 0; fi

          # The artifact was uploaded as a flat release-binaries/ dir in the build
          # job, so download-artifact roots extraction at raw-binaries-staging/ and
          # files land flat: raw-binaries-staging/myco-darwin-arm64, …, no prefix.

          # Generate SHA256SUMS in canonical two-space format (<sha>  <name>).
          # Run sha256sum from inside the dir so names are bare (no path prefix);
          # later install scripts parse $2 == <assetname>. Enumerate the five
          # names explicitly — `sha256sum *` would include SHA256SUMS itself
          # (shell creates the file before the glob expands), producing a bogus
          # self-referential entry that breaks `sha256sum -c SHA256SUMS`.
          ( cd raw-binaries-staging && sha256sum myco-darwin-arm64 myco-darwin-x64 myco-linux-x64 myco-linux-arm64 myco-windows-x64.exe > SHA256SUMS )

          gh release upload "$TAG_NAME" raw-binaries-staging/* --clobber

      # Every asset is attached: only now does the release become public. A
      # prerelease never becomes the repository's latest release.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.validate-tag.outputs.tag_name }}
          RELEASE_PUBLISHED: ${{ steps.release.outputs.published }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if [ "${RELEASE_PUBLISHED:-false}" = "true" ]; then exit 0; fi
          publish_args=("$TAG_NAME" --draft=false)
          if [ "$IS_PRERELEASE" = "true" ]; then
            publish_args+=(--prerelease --latest=false)
          fi
          gh release edit "${publish_args[@]}"

  publish:
    name: Publish to npmjs.org
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: [validate-tag, build, create-release, require-ci, verify-darwin]
    environment: npm-publish
    # Build supplies the npm tarballs. Internal packages skip the GitHub Release.
    if: |
      always() &&
      needs.validate-tag.outputs.publication_allowed == 'true' &&
      needs.validate-tag.result == 'success' &&
      needs.build.result == 'success' &&
      needs.require-ci.result == 'success' &&
      (needs.verify-darwin.result == 'success' ||
       (needs.validate-tag.outputs.tag_prefix != 'myco' && needs.verify-darwin.result == 'skipped')) &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download packaged artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: publish-files

      - name: Publish package
        env:
          NPM_TAG: ${{ needs.validate-tag.outputs.npm_tag }}
          TAG_PREFIX: ${{ needs.validate-tag.outputs.tag_prefix }}
        run: |
          set -euo pipefail

          # Publish a tarball idempotently. npm versions are immutable, so a
          # job that fails partway (e.g. a transient Sigstore/Rekor provenance
          # outage after some packages already shipped) cannot be recovered by
          # re-running: the first already-published package returns "cannot
          # publish over the previously published versions" and aborts the loop
          # before reaching the packages that never shipped. Skipping versions
          # already present on the registry makes the whole job safely
          # re-runnable — a re-run finishes whatever the previous attempt left
          # behind instead of wedging on the first survivor.
          #
          # Resolve to an absolute path first. If the arg looks like
          # `foo/bar.tgz` (one slash, no leading ./ or /), npm interprets it as
          # a GitHub shorthand specifier and tries to `git ls-remote` it —
          # exit 128 with "Permission denied (publickey)". `realpath`
          # guarantees an absolute path so npm always treats it as a local
          # tarball file.
          publish_tarball() {
            local tgz name version
            tgz="$(realpath "$1")"
            name="$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0,"utf8")).name')"
            version="$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("node:fs").readFileSync(0,"utf8")).version')"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version} — already published"
              return 0
            fi
            echo "Publishing ${name}@${version} from ${tgz}"
            npx npm@latest publish "$tgz" --tag "$NPM_TAG" --provenance --access public
          }

          if [ "$TAG_PREFIX" = "myco" ]; then
            # Publish each platform package first so core's
            # optionalDependencies pin resolves on the registry by the time
            # users install core. Then publish core last.
            for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
              # download-artifact preserves directory structure relative to
              # the upload root, so platform tarballs land at
              # publish-files/packages/myco-<target>/*.tgz.
              tgz="$(find publish-files -type f -name "goondocks-myco-${target}-*.tgz" -print -quit)"
              if [ -z "$tgz" ]; then
                echo "missing platform tarball: ${target}" >&2
                exit 1
              fi
              publish_tarball "$tgz"
            done
            tgz="$(find publish-files -type f -regex '.*/goondocks-myco-[0-9].*\.tgz$' -print -quit)"
            if [ -z "$tgz" ]; then
              echo "missing core tarball" >&2
              exit 1
            fi
            publish_tarball "$tgz"
          else
            tgz="$(find publish-files -maxdepth 2 -type f -name '*.tgz' -print -quit)"
            if [ -z "$tgz" ]; then
              echo "no tarball found in publish-files/" >&2
              exit 1
            fi
            publish_tarball "$tgz"
          fi

      - name: Publish summary
        env:
          TAG_NAME: ${{ needs.validate-tag.outputs.tag_name }}
          PACKAGE_NAME: ${{ needs.validate-tag.outputs.package_name }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.is_prerelease }}
          NPM_TAG: ${{ needs.validate-tag.outputs.npm_tag }}
        run: |
          echo "## Published to npmjs.org" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** $TAG_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Package:** $PACKAGE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "**npm tag:** $NPM_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "**Pre-release:** $IS_PRERELEASE" >> "$GITHUB_STEP_SUMMARY"
