name: Release

on:
  push:
    tags:
      - 'myco/v*.*.*'
      - 'myco/v*.*.*-*'
      - 'myco-team/v*.*.*'
      - 'myco-team/v*.*.*-*'
      - 'myco-collective/v*.*.*'
      - 'myco-collective/v*.*.*-*'

permissions:
  contents: write
  id-token: write

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.extract.outputs.tag_name }}
      tag_prefix: ${{ steps.extract.outputs.tag_prefix }}
      version: ${{ steps.extract.outputs.version }}
      is_prerelease: ${{ steps.extract.outputs.is_prerelease }}
      npm_tag: ${{ steps.extract.outputs.npm_tag }}
      package_name: ${{ steps.extract.outputs.package_name }}
      package_dir: ${{ steps.extract.outputs.package_dir }}
      tarball_prefix: ${{ steps.extract.outputs.tarball_prefix }}
    steps:
      - name: Extract package and version from tag
        id: extract
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_PREFIX="${TAG_NAME%%/v*}"
          VERSION="${TAG_NAME#${TAG_PREFIX}/v}"

          case "$TAG_PREFIX" in
            myco)
              PACKAGE_NAME="@goondocks/myco"
              PACKAGE_DIR="packages/myco"
              TARBALL_PREFIX="goondocks-myco"
              ;;
            myco-team)
              PACKAGE_NAME="@goondocks/myco-team"
              PACKAGE_DIR="packages/myco-team"
              TARBALL_PREFIX="goondocks-myco-team"
              ;;
            myco-collective)
              PACKAGE_NAME="@goondocks/myco-collective"
              PACKAGE_DIR="packages/myco-collective"
              TARBALL_PREFIX="goondocks-myco-collective"
              ;;
            *)
              echo "Unsupported release tag: $TAG_NAME" >&2
              exit 1
              ;;
          esac

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=$TAG_PREFIX" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_dir=$PACKAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "tarball_prefix=$TARBALL_PREFIX" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ -alpha\. ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -beta\. ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ -rc\. ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  # Per-target libsqlite3 compile, gated on myco tags only.
  # Runner OS per target:
  #   darwin-*  → macos-latest (host-compile both archs with clang -arch)
  #   linux-x64 → ubuntu-latest (host-compile)
  #   linux-arm64, windows-x64 → ubuntu-latest with cross toolchain installed
  # We intentionally avoid osxcross for darwin targets.
  compile-libsqlite3:
    name: Compile libsqlite3 (${{ matrix.target }})
    needs: validate-tag
    if: needs.validate-tag.outputs.tag_prefix == 'myco'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            os: macos-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-latest
          - target: windows-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cross toolchain (linux-arm64)
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross toolchain (windows-x64)
        if: matrix.target == 'windows-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64

      - name: Build libsqlite3
        env:
          TARGET: ${{ matrix.target }}
        run: bash packages/myco/scripts/build-libsqlite3-target.sh "$TARGET"

      - name: Upload libsqlite3 artifact
        uses: actions/upload-artifact@v7
        with:
          name: libsqlite3-${{ matrix.target }}
          path: packages/myco/vendor-src/libsqlite3/${{ matrix.target }}/
          if-no-files-found: error

  # Per-target myco binary compile via `bun build --compile`. Each matrix job
  # stages the target's sqlite-vec + ripgrep native binaries and downloads
  # the matching libsqlite3 artifact before compiling.
  cross-compile:
    name: Cross-compile myco (${{ matrix.target }})
    needs: [validate-tag, compile-libsqlite3]
    if: needs.validate-tag.outputs.tag_prefix == 'myco'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64, windows-x64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Cross-compile does not use host postinstall side effects: we stage the
      # target sqlite-vec package and ripgrep binary explicitly below. Skipping
      # scripts avoids flaky host-only GitHub downloads from @vscode/ripgrep.
      - run: npm ci --ignore-scripts

      - name: Sync target package versions from tag
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TAG_PREFIX: ${{ needs.validate-tag.outputs.tag_prefix }}
        run: |
          case "$TAG_PREFIX" in
            myco) export MYCO_VERSION="$VERSION" ;;
            myco-team) export MYCO_TEAM_VERSION="$VERSION" ;;
            myco-collective) export MYCO_COLLECTIVE_VERSION="$VERSION" ;;
          esac
          node scripts/sync-package-versions.mjs

      # The target's sqlite-vec native extension must be present in
      # node_modules for the per-target entry's import to resolve. npm ci on
      # the host only pulls the host optional subpackage, so force-install
      # the target's subpackage at the same pinned version.
      - name: Install sqlite-vec target subpackage
        env:
          TARGET: ${{ matrix.target }}
        run: |
          SQLITE_VEC_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./node_modules/sqlite-vec/package.json', 'utf8')).version")"
          npm install "sqlite-vec-${TARGET}@${SQLITE_VEC_VERSION}" --no-save --ignore-scripts --force

      # @vscode/ripgrep's postinstall only downloads the host-matching
      # binary, so for cross-compile we fetch the target-specific release
      # from microsoft/ripgrep-prebuilt directly (VERSION matches the
      # constant in node_modules/@vscode/ripgrep/lib/postinstall.js).
      - name: Install target-specific ripgrep binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          RG_VERSION="v15.0.1"
          case "$TARGET" in
            darwin-arm64) RG_TRIPLE="aarch64-apple-darwin" ;;
            darwin-x64)   RG_TRIPLE="x86_64-apple-darwin" ;;
            linux-x64)    RG_TRIPLE="x86_64-unknown-linux-musl" ;;
            linux-arm64)  RG_TRIPLE="aarch64-unknown-linux-musl" ;;
            windows-x64)  RG_TRIPLE="x86_64-pc-windows-msvc" ;;
            *) echo "unknown target: $TARGET" >&2; exit 1 ;;
          esac
          RG_BIN_DIR="node_modules/@vscode/ripgrep/bin"
          mkdir -p "$RG_BIN_DIR"
          STAGE="$(mktemp -d)"
          if [ "$TARGET" = "windows-x64" ]; then
            ARCHIVE="ripgrep-${RG_VERSION}-${RG_TRIPLE}.zip"
            curl --fail --silent --show-error --location \
              -o "${STAGE}/${ARCHIVE}" \
              "https://github.com/microsoft/ripgrep-prebuilt/releases/download/${RG_VERSION}/${ARCHIVE}"
            unzip -q "${STAGE}/${ARCHIVE}" -d "${STAGE}"
            mv "${STAGE}/rg.exe" "${RG_BIN_DIR}/rg.exe"
            # The per-target entry imports '@vscode/ripgrep/bin/rg' — file
            # content is what matters; extension is irrelevant to Bun's
            # file-embed. Mirror the Windows binary to both names.
            cp "${RG_BIN_DIR}/rg.exe" "${RG_BIN_DIR}/rg"
          else
            ARCHIVE="ripgrep-${RG_VERSION}-${RG_TRIPLE}.tar.gz"
            curl --fail --silent --show-error --location \
              -o "${STAGE}/${ARCHIVE}" \
              "https://github.com/microsoft/ripgrep-prebuilt/releases/download/${RG_VERSION}/${ARCHIVE}"
            tar -xzf "${STAGE}/${ARCHIVE}" -C "${STAGE}"
            mv "${STAGE}/rg" "${RG_BIN_DIR}/rg"
            chmod +x "${RG_BIN_DIR}/rg"
          fi
          ls -lh "${RG_BIN_DIR}"

      - name: Download libsqlite3 artifact
        uses: actions/download-artifact@v8
        with:
          name: libsqlite3-${{ matrix.target }}
          path: packages/myco/vendor-src/libsqlite3/${{ matrix.target }}/

      - run: npm run codegen -w @goondocks/myco

      - name: Compile myco binary
        env:
          TARGET: ${{ matrix.target }}
        run: TARGET="$TARGET" npm run build:binary -w @goondocks/myco

      - name: Upload myco binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: myco-binary-${{ matrix.target }}
          path: packages/myco/vendor/${{ matrix.target }}/
          if-no-files-found: error

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [validate-tag, cross-compile]
    # cross-compile is skipped for team/collective tags, which would
    # normally cascade-skip this job. Force it to run in that case.
    if: |
      always() &&
      needs.validate-tag.result == 'success' &&
      (needs.cross-compile.result == 'success' || needs.cross-compile.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/myco/ui/package-lock.json
            packages/myco-collective/ui/package-lock.json
            packages/myco-team/worker/package-lock.json
            packages/myco-collective/worker/package-lock.json

      - run: npm ci
      - name: Install myco UI deps
        run: npm ci --prefix packages/myco/ui
      - name: Install myco-collective UI deps
        run: npm ci --prefix packages/myco-collective/ui
      - name: Install worker deps
        run: |
          set -eu
          for workspace in packages/myco-team/worker packages/myco-collective/worker; do
            for attempt in 1 2 3; do
              if npm ci --prefix "$workspace"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "$workspace npm ci failed after 3 attempts" >&2
                exit 1
              fi
              echo "$workspace npm ci failed on attempt $attempt; retrying..." >&2
              sleep 5
            done
          done

      - name: Sync target package versions from tag
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          TAG_PREFIX: ${{ needs.validate-tag.outputs.tag_prefix }}
        run: |
          case "$TAG_PREFIX" in
            myco) export MYCO_VERSION="$VERSION" ;;
            myco-team) export MYCO_TEAM_VERSION="$VERSION" ;;
            myco-collective) export MYCO_COLLECTIVE_VERSION="$VERSION" ;;
          esac
          node scripts/sync-package-versions.mjs

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Lint
        run: npm run lint

      - name: Run test suite under Bun
        run: npm test

      # For team/collective tags, run the normal build (tsup-based). For
      # myco tags, the binaries arrive from the cross-compile matrix —
      # downloaded in the next step. Run only the UI build locally.
      - name: Build target package (team/collective)
        if: needs.validate-tag.outputs.tag_prefix != 'myco'
        env:
          PACKAGE_NAME: ${{ needs.validate-tag.outputs.package_name }}
        run: npm run build -w "$PACKAGE_NAME"

      # Stage the pre-built per-target binaries into vendor/ so the fat
      # tarball contains all 5. Only runs for myco tags. download-artifact
      # with a pattern places each artifact in a subdirectory named after
      # the artifact (e.g. myco-binary-darwin-arm64/myco); we then rename
      # each to the target-only key the select-binary.mjs postinstall
      # expects (vendor/<target>/myco).
      - name: Download cross-compiled myco binaries
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        uses: actions/download-artifact@v8
        with:
          pattern: myco-binary-*
          path: packages/myco/vendor-staging/

      - name: Reshape vendor layout
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        run: |
          set -euo pipefail
          STAGING="packages/myco/vendor-staging"
          VENDOR="packages/myco/vendor"
          mkdir -p "$VENDOR"
          for dir in "$STAGING"/myco-binary-*; do
            [ -d "$dir" ] || continue
            target="${dir##*/myco-binary-}"
            mkdir -p "$VENDOR/$target"
            cp -R "$dir"/. "$VENDOR/$target/"
          done
          rm -rf "$STAGING"
          ls -lR "$VENDOR"

      - name: Build myco UI
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        run: npm run build:ui -w @goondocks/myco

      # Verify that every target has a binary staged in vendor/ before we
      # pack. Fails loudly if any cross-compile artifact is missing.
      - name: Verify vendor/ completeness (myco)
        if: needs.validate-tag.outputs.tag_prefix == 'myco'
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            ext=""
            [ "$target" = "windows-x64" ] && ext=".exe"
            if [ ! -f "packages/myco/vendor/${target}/myco${ext}" ]; then
              echo "missing binary: packages/myco/vendor/${target}/myco${ext}" >&2
              exit 1
            fi
          done

      - name: Pack npm tarball
        working-directory: ${{ needs.validate-tag.outputs.package_dir }}
        run: npm pack

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ needs.validate-tag.outputs.package_dir }}/${{ needs.validate-tag.outputs.tarball_prefix }}-*.tgz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-tag, build]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: release-files

      - name: Generate release notes
        id: notes
        env:
          TAG_NAME: ${{ needs.validate-tag.outputs.tag_name }}
          TAG_PREFIX: ${{ needs.validate-tag.outputs.tag_prefix }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          PACKAGE_NAME: ${{ needs.validate-tag.outputs.package_name }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.is_prerelease }}
        run: |
          PREVIOUS_TAG=$(git tag --list "${TAG_PREFIX}/v*" --sort=-version:refname | grep -Fxv "$TAG_NAME" | head -1 || true)
          if [ -z "$PREVIOUS_TAG" ] && [ "$TAG_PREFIX" = "myco" ]; then
            PREVIOUS_TAG=$(git tag --list "v*.*.*" --sort=-version:refname | head -1 || true)
          fi

          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s" --no-merges | head -50)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            cat > release-notes.md <<NOTES_EOF
          ## Pre-release

          This is a pre-release for \`${PACKAGE_NAME}\` and may contain bugs or incomplete features.

          ## What's Changed

          ${COMMITS}
          NOTES_EOF
          else
            cat > release-notes.md <<NOTES_EOF
          ## Package

          - \`${PACKAGE_NAME}\`
          - Version \`${VERSION}\`

          ## What's Changed

          ${COMMITS}
          NOTES_EOF
          fi

          sed -i 's/^          //' release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.validate-tag.outputs.tag_name }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.is_prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            edit_args=(
              "$TAG_NAME"
              --draft=false
              --title "$TAG_NAME"
              --notes-file release-notes.md
            )
            if [ "$IS_PRERELEASE" = "true" ]; then
              edit_args+=(--prerelease)
            fi
            gh release edit "${edit_args[@]}"
            gh release upload "$TAG_NAME" release-files/* --clobber
          else
            create_args=(
              "$TAG_NAME"
              release-files/*
              --verify-tag
              --title "$TAG_NAME"
              --notes-file release-notes.md
            )
            if [ "$IS_PRERELEASE" = "true" ]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

  publish:
    name: Publish to npmjs.org
    runs-on: ubuntu-latest
    needs: [validate-tag, create-release]
    environment: npm-publish
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download packaged artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: publish-files

      - name: Publish package
        env:
          NPM_TAG: ${{ needs.validate-tag.outputs.npm_tag }}
        run: |
          set -euo pipefail
          TARBALL="$(find publish-files -maxdepth 1 -name '*.tgz' -print -quit)"
          if [ -z "$TARBALL" ]; then
            echo "no tarball found in publish-files/" >&2
            exit 1
          fi
          npx npm@latest publish "./$TARBALL" --tag "$NPM_TAG" --provenance --access public

      - name: Publish summary
        env:
          TAG_NAME: ${{ needs.validate-tag.outputs.tag_name }}
          PACKAGE_NAME: ${{ needs.validate-tag.outputs.package_name }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.is_prerelease }}
          NPM_TAG: ${{ needs.validate-tag.outputs.npm_tag }}
        run: |
          echo "## Published to npmjs.org" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** $TAG_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Package:** $PACKAGE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "**npm tag:** $NPM_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "**Pre-release:** $IS_PRERELEASE" >> "$GITHUB_STEP_SUMMARY"
