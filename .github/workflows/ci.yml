name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # GitHub Actions defaults to a 6-hour job timeout. We've hit
    # bun-test-doesn't-exit hangs (a test leaks a handle and the runner
    # waits indefinitely for the event loop to drain). 25 minutes is
    # generous for the suite — locally it runs in under 3 — and forces
    # a fast failure so we can grab logs and diagnose, rather than
    # waiting hours on a wedged runner.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: npm ci
      # packages/myco-team/worker is not npm workspaces (the root workspaces
      # glob only matches packages/*, one level up), so `npm run lint` below
      # cannot type-check it via check:workers without its own node_modules
      # installed first. packages/myco-server sits at packages/* and the root
      # `npm ci` above covers it.
      - run: npm ci --prefix packages/myco-team/worker
      - run: npm run lint
      # Build the host-target libsqlite3 so the compiled binary can embed it.
      - run: bash packages/myco/scripts/build-libsqlite3-target.sh linux-x64
      # Host-target only in CI — full cross-compile is reserved for release.
      - run: TARGET=linux-x64 npm run build:binary -w @goondocks/myco
      - run: npm run build:ui -w @goondocks/myco
      - run: npm run build:ui -w @goondocks/myco-server
      # Full test suite under `bun test` (Phase 5 of the bun migration).
      # `npm test` runs both the Node-env and jsdom passes via the
      # run-bun-tests.mjs driver, handling tsx UI tests in their own pass.
      - run: npm test
      # Per-feature both-target parity scenarios (#1042): the Bun server
      # in-process and the Worker under wrangler dev with local D1.
      - run: npm run test:parity

  # The self-hosted Deployment, on the platform it actually ships to.
  #
  # Every other check here proves the server's request handler. This one proves
  # the container: the entrypoint, the migration it applies before the listener
  # binds, the bind shape a published port requires, and the Host allowlist as
  # an operator meets it. None of those are exercised by driving the handler
  # directly.
  #
  # It also holds the image multi-architecture. A Dockerfile that quietly stops
  # building for one of the two would pass every other job.
  self-hosted-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for both architectures
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f packages/myco-server/Dockerfile -t myco-server:ci .

      - name: Assert the manifest carries amd64 AND arm64
        run: |
          set -eu
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f packages/myco-server/Dockerfile --output type=oci,dest=image.tar .
          mkdir -p oci && tar -xf image.tar -C oci
          python3 - <<'EOF'
          import json
          idx = json.load(open('oci/index.json'))
          digest = idx['manifests'][0]['digest'].split(':')[1]
          inner = json.load(open(f'oci/blobs/sha256/{digest}'))
          found = sorted({
              f"{m['platform']['os']}/{m['platform']['architecture']}"
              for m in inner.get('manifests', [])
              if m.get('platform', {}).get('architecture') not in (None, 'unknown')
          })
          print('platforms:', found)
          assert found == ['linux/amd64', 'linux/arm64'], f'expected both architectures, got {found}'
          EOF

      - name: Run the native image and smoke it
        run: |
          set -eu
          docker buildx build --platform linux/amd64 \
            -f packages/myco-server/Dockerfile -t myco-server:native --load .
          docker run -d --name myco-ci \
            -p 127.0.0.1:18787:18787 -e MYCO_PORT=18787 -e MYCO_BIND=all myco-server:native

          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              -H 'Host: 127.0.0.1:18787' http://127.0.0.1:18787/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker logs myco-ci

          # Serves on the published loopback port.
          [ "$code" = "200" ] || { echo "health was $code, expected 200"; exit 1; }

          # The Host allowlist is what protects a container: its socket sees
          # every address the publish spec forwards, so a forged Host is
          # refused by the header check or by nothing at all.
          rebind=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
            -H 'Host: evil.example.com' http://127.0.0.1:18787/health || true)
          [ "$rebind" = "421" ] || { echo "foreign Host was $rebind, expected 421"; exit 1; }

          # `localhost` the NAME stays refused while the literal is admitted.
          named=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
            -H 'Host: localhost:18787' http://127.0.0.1:18787/health || true)
          [ "$named" = "421" ] || { echo "localhost was $named, expected 421"; exit 1; }

          # A replacement container on the same volume migrates nothing and
          # serves: data survives container replacement.
          docker rm -f myco-ci
          docker volume create myco-ci-data
          docker run -d --name myco-v1 -v myco-ci-data:/data \
            -p 127.0.0.1:18788:18788 -e MYCO_PORT=18788 -e MYCO_BIND=all myco-server:native
          sleep 8
          docker rm -f myco-v1
          docker run -d --name myco-v2 -v myco-ci-data:/data \
            -p 127.0.0.1:18788:18788 -e MYCO_PORT=18788 -e MYCO_BIND=all myco-server:native
          for _ in $(seq 1 30); do
            again=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              -H 'Host: 127.0.0.1:18788' http://127.0.0.1:18788/health || true)
            [ "$again" = "200" ] && break
            sleep 2
          done
          [ "$again" = "200" ] || { echo "replacement served $again, expected 200"; docker logs myco-v2; exit 1; }
          docker rm -f myco-v2

      - name: Tear down
        if: always()
        run: |
          docker rm -f myco-ci myco-v1 myco-v2 2>/dev/null || true
          docker volume rm myco-ci-data 2>/dev/null || true

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MYCO_WINDOWS_NATIVE_TASK_LABEL: 'Myco-CI-Native-${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Configure Windows native contract paths
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "Myco Native Ω $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $executable = Join-Path $env:RUNNER_TEMP 'Myco Native Contract.exe'
          "MYCO_WINDOWS_NATIVE_SCRATCH=$scratch" >> $env:GITHUB_ENV
          "MYCO_WINDOWS_NATIVE_EXE=$executable" >> $env:GITHUB_ENV
      - run: npm ci
      - name: Focused Windows unit contracts
        run: >-
          bun test
          tests/service/windows-native-ci-contract.test.ts
          tests/service/windows.test.ts
          tests/service/sandbox-runner-gate.test.ts
          tests/utils/windows-atomic-replace.test.ts
          tests/utils/user-lock-root.test.ts
      - name: Compile Windows native contract executable
        shell: pwsh
        run: |
          Remove-Item -LiteralPath $env:MYCO_WINDOWS_NATIVE_EXE -Force -ErrorAction SilentlyContinue
          bun build --compile --target=bun-windows-x64 tests/helpers/windows-native-contract.ts --outfile "$env:MYCO_WINDOWS_NATIVE_EXE"
      - name: Execute Windows native contract
        shell: pwsh
        run: |
          & $env:MYCO_WINDOWS_NATIVE_EXE
          if ($LASTEXITCODE -ne 0) {
            throw "Windows native contract exited $LASTEXITCODE"
          }
      - name: Clean exact Windows native contract artifacts
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $cleanupFailures = [System.Collections.Generic.List[string]]::new()
          & schtasks.exe /End /TN "$env:MYCO_WINDOWS_NATIVE_TASK_LABEL" 2>$null | Out-Null
          & schtasks.exe /Delete /TN "$env:MYCO_WINDOWS_NATIVE_TASK_LABEL" /F 2>$null | Out-Null
          $global:LASTEXITCODE = 0
          Start-Sleep -Milliseconds 500
          try {
            $remainingTasks = @(
              Get-ScheduledTask -TaskPath '\' -ErrorAction Stop |
                Where-Object { $_.TaskName -ceq $env:MYCO_WINDOWS_NATIVE_TASK_LABEL }
            )
            if ($remainingTasks.Count -gt 0) {
              $cleanupFailures.Add("Task Scheduler task remained installed: $env:MYCO_WINDOWS_NATIVE_TASK_LABEL")
            }
          } catch {
            $cleanupFailures.Add("could not verify exact task cleanup: $($_.Exception.Message)")
          }
          try {
            $contractExecutable = [IO.Path]::GetFullPath($env:MYCO_WINDOWS_NATIVE_EXE)
            $contractProcesses = @(
              Get-CimInstance -ClassName Win32_Process -ErrorAction Stop |
                Where-Object {
                  [StringComparer]::OrdinalIgnoreCase.Equals($_.ExecutablePath, $contractExecutable)
                }
            )
            $processStopFailures = [System.Collections.Generic.List[string]]::new()
            foreach ($contractProcess in $contractProcesses) {
              try {
                Stop-Process -Id $contractProcess.ProcessId -Force -ErrorAction Stop
              } catch {
                $processStopFailures.Add(
                  "could not stop exact contract process $($contractProcess.ProcessId): $($_.Exception.Message)"
                )
              }
            }

            $processDeadline = [DateTime]::UtcNow.AddSeconds(10)
            do {
              $remainingContractProcesses = @(
                Get-CimInstance -ClassName Win32_Process -ErrorAction Stop |
                  Where-Object {
                    [StringComparer]::OrdinalIgnoreCase.Equals($_.ExecutablePath, $contractExecutable)
                  }
              )
              if ($remainingContractProcesses.Count -eq 0) {
                break
              }
              Start-Sleep -Milliseconds 100
            } while ([DateTime]::UtcNow -lt $processDeadline)

            if ($remainingContractProcesses.Count -gt 0) {
              $remainingPids = $remainingContractProcesses.ProcessId -join ', '
              $cleanupFailures.Add("Contract child processes remained for exact executable ${contractExecutable}: ${remainingPids}")
              foreach ($stopFailure in $processStopFailures) {
                $cleanupFailures.Add($stopFailure)
              }
            }
          } catch {
            $cleanupFailures.Add("could not clean exact contract child processes: $($_.Exception.Message)")
          }
          Remove-Item -LiteralPath $env:MYCO_WINDOWS_NATIVE_SCRATCH -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:MYCO_WINDOWS_NATIVE_EXE -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $env:MYCO_WINDOWS_NATIVE_SCRATCH) {
            $cleanupFailures.Add("Scratch path remained: $env:MYCO_WINDOWS_NATIVE_SCRATCH")
          }
          if (Test-Path -LiteralPath $env:MYCO_WINDOWS_NATIVE_EXE) {
            $cleanupFailures.Add("Contract executable remained: $env:MYCO_WINDOWS_NATIVE_EXE")
          }
          if ($cleanupFailures.Count -gt 0) {
            throw ($cleanupFailures -join [Environment]::NewLine)
          }
