name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - run: npm run lint
      - run: node scripts/run-test-command.mjs node scripts/check-test-shards.mjs
      # The docs site (myco.sh, including install.sh) deploys only from main;
      # building it here keeps a broken page from silently blocking that deploy.
      - name: Build docs site
        working-directory: docs
        run: |
          npm ci --no-audit --no-fund
          npm run build

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      darwin_distribution_required: ${{ steps.darwin-inputs.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Select Darwin release recipe checks
        id: darwin-inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/darwin-release-inputs.mjs
      - uses: ./.github/actions/ci-setup
      - run: bash packages/myco/scripts/build-libsqlite3-target.sh linux-x64
      - name: The standalone dashboard matches its committed bundle without shared build artifacts
        run: |
          test ! -d packages/myco-shared/dist
          npm run build:ui -w @goondocks/myco-server
          rm packages/myco/src/server-ui-assets.generated.ts
          npx tsx packages/myco/scripts/gen-ui-assets.ts
          git diff --exit-code -- packages/myco/src/server-ui-assets.generated.ts
      - name: Build from a clean checkout
        run: |
          test -z "$(git status --porcelain)"
          npm run build
      - name: Dev binary identifies the clean commit and generators preserve the checkout
        run: node scripts/check-clean-build.mjs packages/myco-linux-x64/bin/myco
      - name: One machine routes each repository to its explicit Deployment
        run: npm test -- tests/member/rbac-routing-smoke.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: rbac-routing-linux-x64
          path: packages/myco-linux-x64/bin/myco
          if-no-files-found: error
          retention-days: 1

  # Gate G2 (#1561): a compiled binary answers a no-op hook within its ceiling on every release target a runner here
  # can run. Each target is built the way the release builds it (`--compile --splitting`, darwin signed in place)
  # and measured where it runs: natively, and windows-x64 cross-compiled here and measured on a Windows runner by
  # `hook-startup-windows`. darwin-x64 has no runner that can run it (an x64 build raises SIGILL under the macOS
  # runner's Rosetta), so it is measured under Rosetta on an Apple Silicon Mac and recorded in the release checklist.
  #
  # The ceilings are per runner: 80 ms where Linux runs natively, 150 ms on the macOS and Windows runners, whose
  # shared virtual machines start a process far slower than hardware (the same build answers in 25 ms on an M-series
  # Mac). Every ceiling stays well under the 175 ms the unsplit binary takes on that hardware.
  hook-startup:
    name: hook startup (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest, rg: linux-x64, ceiling: 80 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, rg: linux-arm64, ceiling: 80 }
          - { target: darwin-arm64, os: macos-14, rg: darwin-arm64, ceiling: 150 }
          - { target: windows-x64, os: ubuntu-latest, rg: win32-x64, cross: true, measure_elsewhere: true }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Install the target's native subpackages
        if: matrix.cross
        env:
          TARGET: ${{ matrix.target }}
          RG_PLATFORM: ${{ matrix.rg }}
        run: |
          SQLITE_VEC_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./node_modules/sqlite-vec/package.json', 'utf8')).version")"
          RG_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./node_modules/@vscode/ripgrep/package.json', 'utf8')).version")"
          npm install "sqlite-vec-${TARGET}@${SQLITE_VEC_VERSION}" "@vscode/ripgrep-${RG_PLATFORM}@${RG_VERSION}" --no-save --ignore-scripts --force
      - name: Install the mingw toolchain
        if: matrix.target == 'windows-x64'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64
      - run: bash packages/myco/scripts/build-libsqlite3-target.sh "${{ matrix.target }}"
      - name: Hand the Darwin native library to the Linux cross-compiler
        if: matrix.target == 'darwin-arm64'
        uses: actions/upload-artifact@v7
        with:
          name: ci-libsqlite3-darwin-arm64
          path: packages/myco/vendor-src/libsqlite3/darwin-arm64/
          if-no-files-found: error
          retention-days: 1
      - name: Set macOS distribution smoke version
        if: matrix.target == 'darwin-arm64'
        run: node scripts/sync-package-versions.mjs --target myco --version 0.0.0-ci
      - run: npm run build:ui -w @goondocks/myco
      - run: npm run codegen -w @goondocks/myco
      - run: TARGET="${{ matrix.target }}" npm run build:binary -w @goondocks/myco
      - name: Verify macOS distributions
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/darwin-distribution
          cp packages/myco-darwin-arm64/bin/myco target/darwin-distribution/myco-darwin-arm64
          node scripts/inject-platform-metadata.mjs darwin-arm64
          (cd packages/myco-darwin-arm64 && npm pack --pack-destination ../../target/darwin-distribution)
          version="$(node -p "require('./packages/myco/package.json').version")"
          tarballs=(target/darwin-distribution/goondocks-myco-darwin-arm64-*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "Expected one packed npm tarball for darwin-arm64" >&2
            exit 1
          fi
          bash scripts/verify-darwin-distribution.sh "$version" target/darwin-distribution/myco-darwin-arm64 "${tarballs[0]}" native
      - name: Measure a no-op hook
        if: ${{ !matrix.measure_elsewhere }}
        run: node packages/myco/scripts/measure-hook-startup.mjs "packages/myco-${{ matrix.target }}/bin/myco" --prefix "${{ matrix.prefix }}" --max-p95-ms "${{ matrix.ceiling }}"
      # Gate G1, timed: every hook doing its real work, under both credential sources, each inside its own budget.
      - name: Measure every hook at work
        if: ${{ !matrix.measure_elsewhere }}
        run: bun packages/myco/scripts/measure-hook-work.ts "packages/myco-${{ matrix.target }}/bin/myco" --prefix "${{ matrix.prefix }}"
      - name: Hand the Windows binary to its runner
        if: matrix.measure_elsewhere
        uses: actions/upload-artifact@v7
        with:
          name: hook-startup-${{ matrix.target }}
          path: packages/myco-${{ matrix.target }}/bin/myco.exe
          if-no-files-found: error
          retention-days: 1

  darwin-release-build:
    name: Cross-compile Darwin release recipe
    needs: [build, hook-startup]
    if: needs.build.outputs.darwin_distribution_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: npm ci --ignore-scripts
      - run: node scripts/sync-package-versions.mjs --target myco --version 0.0.0-ci
      - name: Install Darwin target subpackages
        run: |
          set -euo pipefail
          SQLITE_VEC_VERSION="$(node -p "require('./node_modules/sqlite-vec/package.json').version")"
          RG_VERSION="$(node -p "require('./node_modules/@vscode/ripgrep/package.json').version")"
          npm install "sqlite-vec-darwin-arm64@${SQLITE_VEC_VERSION}" "@vscode/ripgrep-darwin-arm64@${RG_VERSION}" --no-save --ignore-scripts --force
      - uses: actions/download-artifact@v8
        with:
          name: ci-libsqlite3-darwin-arm64
          path: packages/myco/vendor-src/libsqlite3/darwin-arm64/
      - run: npm run build:ui -w @goondocks/myco
      - run: npm run codegen -w @goondocks/myco
      - run: TARGET=darwin-arm64 npm run build:binary -w @goondocks/myco
      - uses: actions/upload-artifact@v7
        with:
          name: ci-myco-cross-darwin-arm64
          path: packages/myco-darwin-arm64/bin/
          if-no-files-found: error
          retention-days: 1

  darwin-release-verify:
    name: Sign and verify Linux-built Darwin distribution
    needs: [build, darwin-release-build]
    if: needs.build.outputs.darwin_distribution_required == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: ci-myco-cross-darwin-arm64
          path: binary/
      - name: Sign macOS executable
        run: bash scripts/sign-darwin-binary.sh binary/myco
      - name: Pack and verify signed distribution
        run: |
          set -euo pipefail
          node scripts/sync-package-versions.mjs --target myco --version 0.0.0-ci
          chmod +x binary/myco
          mkdir -p packages/myco-darwin-arm64/bin target/darwin-release
          cp binary/myco packages/myco-darwin-arm64/bin/myco
          node scripts/inject-platform-metadata.mjs darwin-arm64
          (cd packages/myco-darwin-arm64 && npm pack --pack-destination ../../target/darwin-release)
          bash scripts/verify-darwin-distribution.sh 0.0.0-ci binary/myco target/darwin-release/goondocks-myco-darwin-arm64-0.0.0-ci.tgz native

  hook-startup-windows:
    name: hook startup (windows-x64, measured)
    needs: hook-startup
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - uses: actions/download-artifact@v8
        with:
          name: hook-startup-windows-x64
          path: hook-startup-bin
      - name: Measure a no-op hook
        run: node packages/myco/scripts/measure-hook-startup.mjs hook-startup-bin/myco.exe
      - name: Measure every hook at work
        run: bun packages/myco/scripts/measure-hook-work.ts hook-startup-bin/myco.exe

  tests:
    needs: build
    name: tests (${{ matrix.kind }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: node, shard: '1/5' }
          - { kind: node, shard: '2/5' }
          - { kind: node, shard: '3/5' }
          - { kind: node, shard: '4/5' }
          - { kind: node, shard: '5/5' }
          - { kind: dom, shard: '1/2' }
          - { kind: dom, shard: '2/2' }
    env:
      MYCO_TEST_KIND: ${{ matrix.kind }}
      MYCO_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Install dashboard test dependencies
        run: npm ci --prefix packages/myco-server/ui
      - if: matrix.kind == 'node'
        run: bash packages/myco/scripts/build-libsqlite3-target.sh linux-x64
      - if: matrix.kind == 'node'
        uses: actions/download-artifact@v8
        with:
          name: rbac-routing-linux-x64
          path: packages/myco-linux-x64/bin
      - if: matrix.kind == 'node'
        run: chmod +x packages/myco-linux-x64/bin/myco
      - run: npm test
      - name: Test timing summary
        if: always()
        shell: bash
        run: |
          echo '### Test phase timings' >> "$GITHUB_STEP_SUMMARY"
          find target/test-reports -name '*.log' -type f -exec grep -hE '\[run-bun-tests\] (FINISHED|KILLED)' {} + >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ matrix.kind }}-${{ strategy.job-index }}
          path: target/test-reports/
          if-no-files-found: error

  parity:
    name: parity (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      MYCO_PARITY_SHARD: ${{ matrix.shard }}/6
      MYCO_RUNNER_GROUP_BUDGET_MS: 780000
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - run: npm run test:parity
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: parity-wrangler-logs-${{ matrix.shard }}
          path: packages/myco-server/.wrangler/parity-dev-*.log
          include-hidden-files: true
          if-no-files-found: ignore

  # The dashboard in a real browser: the built UI served by the self-hosted
  # server over a seeded fixture, checked page by page (landmarks, console and
  # request errors, axe-core, raw ids) and shot at two viewports in both modes.
  ui-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/target/playwright-browsers
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - run: npm ci --prefix packages/myco-server/ui
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: target/playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build:ui -w @goondocks/myco-server
      - run: npm run build:specimen --prefix packages/myco-server/ui
      - run: npm run test:screens
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screens
          path: target/ui-screens/
          if-no-files-found: warn

  check:
    if: always()
    needs: [lint, build, tests, parity, self-hosted-container, windows-native, ui-screens, hook-startup, hook-startup-windows, darwin-release-build, darwin-release-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          DARWIN_DISTRIBUTION_REQUIRED: ${{ needs.build.outputs.darwin_distribution_required }}
        run: |
          echo "$RESULTS" | jq -e --arg required "$DARWIN_DISTRIBUTION_REQUIRED" 'all(to_entries[]; .value.result == "success" or ($required == "false" and (.key == "darwin-release-build" or .key == "darwin-release-verify") and .value.result == "skipped"))'

  # The self-hosted Deployment, on the platform it actually ships to.
  #
  # Every other check here proves the server's request handler. This one proves
  # the container: the entrypoint, the migration it applies before the listener
  # binds, the bind shape a published port requires, and the Host allowlist as
  # an operator meets it. None of those are exercised by driving the handler
  # directly.
  #
  # It also holds both shipped images multi-architecture — the server's and the
  # harness's. A Dockerfile that quietly stops building for one of the two
  # architectures would pass every other job.
  self-hosted-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: npm ci
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for both architectures
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f packages/myco-server/Dockerfile -t myco-server:ci .

      - name: Assert the manifest carries amd64 AND arm64
        run: |
          set -eu
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f packages/myco-server/Dockerfile --output type=oci,dest=image.tar .
          mkdir -p oci && tar -xf image.tar -C oci
          python3 - <<'EOF'
          import json
          idx = json.load(open('oci/index.json'))
          digest = idx['manifests'][0]['digest'].split(':')[1]
          inner = json.load(open(f'oci/blobs/sha256/{digest}'))
          found = sorted({
              f"{m['platform']['os']}/{m['platform']['architecture']}"
              for m in inner.get('manifests', [])
              if m.get('platform', {}).get('architecture') not in (None, 'unknown')
          })
          print('platforms:', found)
          assert found == ['linux/amd64', 'linux/arm64'], f'expected both architectures, got {found}'
          EOF

      # The harness image carries the runtime entry and the supervisor that
      # starts one runtime per run; both are bundled from source, so the build
      # proves the bundle as well as the Dockerfile.
      - name: Bundle the harness entries
        run: npm run harness:bundle -w @goondocks/myco-server

      - name: Build the harness image for both architectures
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f packages/myco-server/harness/Dockerfile \
            -t myco-harness:ci packages/myco-server/harness

      - name: Run the native image and smoke it
        run: |
          set -eu
          docker buildx build --platform linux/amd64 \
            -f packages/myco-server/Dockerfile -t myco-server:native --load .
          docker run -d --name myco-ci \
            -p 127.0.0.1:18787:18787 -e MYCO_PORT=18787 -e MYCO_BIND=all myco-server:native

          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              -H 'Host: 127.0.0.1:18787' http://127.0.0.1:18787/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          docker logs myco-ci

          # Serves on the published loopback port, with no secrets mounted at
          # all: a deployment establishes its sign-in credential later.
          [ "$code" = "200" ] || { echo "health was $code, expected 200"; exit 1; }

          # The entrypoint starts as root to copy its mounted secrets somewhere
          # the runtime user owns, and drops before it migrates or serves. The
          # image carries no ps, so the owner of PID 1 is read from /proc.
          served=$(docker exec myco-ci stat -c '%U:%u' /proc/1)
          [ "$served" = "myco:10001" ] || { echo "PID 1 runs as $served, expected myco:10001"; exit 1; }

          # The Host allowlist is what protects a container: its socket sees
          # every address the publish spec forwards, so a forged Host is
          # refused by the header check or by nothing at all.
          rebind=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
            -H 'Host: evil.example.com' http://127.0.0.1:18787/health || true)
          [ "$rebind" = "421" ] || { echo "foreign Host was $rebind, expected 421"; exit 1; }

          # `localhost` the NAME stays refused while the literal is admitted.
          named=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
            -H 'Host: localhost:18787' http://127.0.0.1:18787/health || true)
          [ "$named" = "421" ] || { echo "localhost was $named, expected 421"; exit 1; }

          docker rm -f myco-ci

      - name: Preserve relational and blob data across container replacement
        run: node scripts/smoke-container-persistence.mjs myco-server:native

      - name: Reject data loss in altered container images
        env:
          MYCO_SMOKE_MUTATION_ROOT: ${{ runner.temp }}
        run: node scripts/test-container-persistence-mutations.mjs myco-server:native

      - name: Tear down
        if: always()
        run: |
          docker rm -f myco-ci 2>/dev/null || true

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MYCO_WINDOWS_NATIVE_TASK_LABEL: 'Myco-CI-Native-${{ github.run_id }}-${{ github.run_attempt }}'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Configure Windows native contract paths
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "Myco Native Ω $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $executable = Join-Path $env:RUNNER_TEMP 'Myco Native Contract.exe'
          "MYCO_WINDOWS_NATIVE_SCRATCH=$scratch" >> $env:GITHUB_ENV
          "MYCO_WINDOWS_NATIVE_EXE=$executable" >> $env:GITHUB_ENV
      - run: npm ci
      - name: Focused Windows unit contracts
        run: >-
          npm test --
          tests/service/windows-native-ci-contract.test.ts
          tests/service/windows.test.ts
          tests/service/sandbox-runner-gate.test.ts
          tests/utils/windows-atomic-replace.test.ts
          tests/utils/user-lock-root.test.ts
          tests/utils/lifecycle-lock-shared.test.ts
          tests/server/runner.test.ts
          tests/install/place-binary.test.ts
          tests/upgrade/apply-binary.test.ts
          tests/meta/binary-replaced-mid-run.test.ts
          tests/meta/test-temp-fence.test.ts
          tests/scripts/test-temp-root.test.ts
          tests/member/journal-v2.test.ts
          tests/runtime/spawn-detached.test.ts
          tests/member/inline-and-upgrade.test.ts
          tests/member/helper.test.ts
          tests/member/auto-join-lock.test.ts
          tests/utils/git-files.test.ts
          tests/utils/git-capabilities.test.ts
          tests/scripts/run-test-command.test.ts
          tests/member/git-verdict.test.ts
          tests/member/hook-git-calls.test.ts
      - name: Compile Windows native contract executable
        shell: pwsh
        run: |
          Remove-Item -LiteralPath $env:MYCO_WINDOWS_NATIVE_EXE -Force -ErrorAction SilentlyContinue
          bun build --compile --target=bun-windows-x64 tests/helpers/windows-native-contract.ts --outfile "$env:MYCO_WINDOWS_NATIVE_EXE"
      - name: Execute Windows native contract
        shell: pwsh
        run: |
          & $env:MYCO_WINDOWS_NATIVE_EXE
          if ($LASTEXITCODE -ne 0) {
            throw "Windows native contract exited $LASTEXITCODE"
          }
      - name: Clean exact Windows native contract artifacts
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $cleanupFailures = [System.Collections.Generic.List[string]]::new()
          & schtasks.exe /End /TN "$env:MYCO_WINDOWS_NATIVE_TASK_LABEL" 2>$null | Out-Null
          & schtasks.exe /Delete /TN "$env:MYCO_WINDOWS_NATIVE_TASK_LABEL" /F 2>$null | Out-Null
          $global:LASTEXITCODE = 0
          Start-Sleep -Milliseconds 500
          try {
            $remainingTasks = @(
              Get-ScheduledTask -TaskPath '\' -ErrorAction Stop |
                Where-Object { $_.TaskName -ceq $env:MYCO_WINDOWS_NATIVE_TASK_LABEL }
            )
            if ($remainingTasks.Count -gt 0) {
              $cleanupFailures.Add("Task Scheduler task remained installed: $env:MYCO_WINDOWS_NATIVE_TASK_LABEL")
            }
          } catch {
            $cleanupFailures.Add("could not verify exact task cleanup: $($_.Exception.Message)")
          }
          try {
            $contractExecutable = [IO.Path]::GetFullPath($env:MYCO_WINDOWS_NATIVE_EXE)
            $contractProcesses = @(
              Get-CimInstance -ClassName Win32_Process -ErrorAction Stop |
                Where-Object {
                  [StringComparer]::OrdinalIgnoreCase.Equals($_.ExecutablePath, $contractExecutable)
                }
            )
            $processStopFailures = [System.Collections.Generic.List[string]]::new()
            foreach ($contractProcess in $contractProcesses) {
              try {
                Stop-Process -Id $contractProcess.ProcessId -Force -ErrorAction Stop
              } catch {
                $processStopFailures.Add(
                  "could not stop exact contract process $($contractProcess.ProcessId): $($_.Exception.Message)"
                )
              }
            }

            $processDeadline = [DateTime]::UtcNow.AddSeconds(10)
            do {
              $remainingContractProcesses = @(
                Get-CimInstance -ClassName Win32_Process -ErrorAction Stop |
                  Where-Object {
                    [StringComparer]::OrdinalIgnoreCase.Equals($_.ExecutablePath, $contractExecutable)
                  }
              )
              if ($remainingContractProcesses.Count -eq 0) {
                break
              }
              Start-Sleep -Milliseconds 100
            } while ([DateTime]::UtcNow -lt $processDeadline)

            if ($remainingContractProcesses.Count -gt 0) {
              $remainingPids = $remainingContractProcesses.ProcessId -join ', '
              $cleanupFailures.Add("Contract child processes remained for exact executable ${contractExecutable}: ${remainingPids}")
              foreach ($stopFailure in $processStopFailures) {
                $cleanupFailures.Add($stopFailure)
              }
            }
          } catch {
            $cleanupFailures.Add("could not clean exact contract child processes: $($_.Exception.Message)")
          }
          Remove-Item -LiteralPath $env:MYCO_WINDOWS_NATIVE_SCRATCH -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:MYCO_WINDOWS_NATIVE_EXE -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $env:MYCO_WINDOWS_NATIVE_SCRATCH) {
            $cleanupFailures.Add("Scratch path remained: $env:MYCO_WINDOWS_NATIVE_SCRATCH")
          }
          if (Test-Path -LiteralPath $env:MYCO_WINDOWS_NATIVE_EXE) {
            $cleanupFailures.Add("Contract executable remained: $env:MYCO_WINDOWS_NATIVE_EXE")
          }
          if ($cleanupFailures.Count -gt 0) {
            throw ($cleanupFailures -join [Environment]::NewLine)
          }
