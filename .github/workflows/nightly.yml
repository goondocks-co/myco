name: Nightly full CI

# The full run on main. A failed run opens or updates the one "Nightly full CI is failing" issue.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  full:
    uses: ./.github/workflows/ci.yml
    with:
      full: true
      enforce_test_headroom: true

  report-failure:
    name: Report a failed nightly
    needs: full
    if: always() && needs.full.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/report-nightly-failure.mjs
