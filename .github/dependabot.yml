# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Each npm project gets at most two grouped pull requests a week: one for
# minor and patch updates, one for major updates. Security updates are grouped
# separately. GitHub Actions updates arrive as one monthly pull request.

version: 2
updates:
  # The root workspace (packages/*), the dashboard UI and the docs site each
  # keep their own lockfile.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/myco-server/ui"
      - "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      npm-major:
        update-types:
          - "major"
        patterns:
          - "*"
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    ignore:
      # These majors move with the toolchain (Bun, Node in CI) and are upgraded by hand.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # The npm:typescript@^6 alias stays on 6 for tools that need the TypeScript 6 API.
      - dependency-name: "typescript-v6"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
